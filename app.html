<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#070d1c">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
<title>Auralis — App (test)</title>
</head>
<style>
  :root{
    --bg:#070d1c; --pan:#111a33; --pan2:#18223f; --line:#26325a; --line2:#334066;
    --cyan:#7fd8f0; --mauve:#b98fe0; --gold:#e9c96a;
    --txt:#e8edf8; --dim:#93a2c2; --dimmer:#63719a;
    --endo:#7fd8f0; --phyto:#8fe0a8; --he:#e6b866; --elem:#b98fe0;
    /* derives du fond, pour les rgba() : voir --bg */
    --bg-rgb:7,13,28;
    /* accents en composantes, pour les filets et halos colores */
    --cyan-rgb:127,216,240; --mauve-rgb:185,143,224;
    --glow:.39;   /* opacite du halo autour d un contour mis en valeur */
    --scrim:rgba(0,0,0,.85);
    --shadow:rgba(0,0,0,.65);
    --onaccent:#071223;
    --veil:rgba(255,255,255,.06);
    --bgimg:url("app-images/bg.webp");
    --pagebg:#000000;
    /* Indispensable : sans color-scheme, Android/Chrome applique son propre
       assombrissement automatique (force-dark) quand le telephone est en
       theme sombre, et le fond creme vire au gris-brun. */
    color-scheme:dark;
  }
  :root[data-theme="light"]{
    --bg:#faf3ea; --pan:#fffdfa; --pan2:#fff8f0; --line:#e8dfd3; --line2:#d8ccbc;
    --cyan:#3fa9be; --mauve:#a283c9; --gold:#c9a43f;
    --txt:#14203a; --dim:#5a6880; --dimmer:#8b96ac;
    --endo:#3fa9be; --phyto:#4aa86a; --he:#b8873a; --elem:#a283c9;
    --bg-rgb:250,243,234;
    --cyan-rgb:63,169,190; --mauve-rgb:162,131,201;
    /* halo plus discret en clair : une lueur sur fond pale se lit comme un flou */
    --glow:.15;
    --scrim:rgba(20,32,58,.5);
    --shadow:rgba(120,100,80,.22);
    --onaccent:#ffffff;
    --veil:rgba(20,32,58,.05);
    --bgimg:url("app-images/bg-light.webp");
    --pagebg:#f7f6f2;
    color-scheme:light;
  }
  /* Le voile du mode sombre assombrit l'image pour la lisibilite ; en clair
     l'image est deja pale, un voile aussi dense l'effacerait. */
  :root[data-theme="light"] .appbg::after{background:linear-gradient(180deg, rgba(var(--bg-rgb),.05), rgba(var(--bg-rgb),.12) 55%, rgba(var(--bg-rgb),.22))}
  *{box-sizing:border-box}
  html,body{margin:0; height:100%}
  body{background:var(--bg);
    color:var(--txt); font:16px/1.5 -apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; -webkit-font-smoothing:antialiased; display:flex; justify-content:center}
  .appbg{position:fixed; inset:0; z-index:0; background:var(--bg) var(--bgimg) center center / cover no-repeat; pointer-events:none; transition:opacity .6s ease}
  .appbg.off{opacity:0}
  /* Page Frequences : aplat uni au lieu du fond ondule. Les 136 cartes sont
     elles-memes des photos, un fond charge derriere les rendait bruyantes.
     Sombre = vantablack (#000), clair = blanc casse (voir --pagebg). */
  body[data-view="lib"] .appbg{background-image:none; background-color:var(--pagebg)}
  body[data-view="lib"] .appbg::after{display:none}
  body[data-view="lib"]{background:var(--pagebg)}
  .appbg::after{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(var(--bg-rgb),.18), rgba(var(--bg-rgb),.3) 55%, rgba(var(--bg-rgb),.42))}
  .pbg{position:fixed; inset:0; width:100%; height:100%; z-index:0; pointer-events:none}
  .app{width:100%; max-width:520px; min-height:100%; display:flex; flex-direction:column; position:relative; z-index:1}
  .view{display:none; flex-direction:column; flex:1}
  .view.on{display:flex}
  .view.on.nav-fwd{animation:viewInFwd .28s cubic-bezier(.22,.61,.36,1) both}
  .view.on.nav-back{animation:viewInBack .28s cubic-bezier(.22,.61,.36,1) both}
  @keyframes viewInFwd{from{opacity:0; transform:translateX(30px)} to{opacity:1; transform:none}}
  @keyframes viewInBack{from{opacity:0; transform:translateX(-30px)} to{opacity:1; transform:none}}

  .bar{position:sticky; top:0; z-index:5; display:flex; align-items:center; gap:12px; padding:16px 18px 12px;
       background:linear-gradient(180deg,var(--bg),rgba(var(--bg-rgb),.86)); backdrop-filter:blur(8px)}
  .bar .logo{font-size:1rem; font-weight:800; letter-spacing:.3em; margin:0}
  .bar .logo .a{color:var(--cyan)} .bar .logo .l{color:var(--mauve)}
  .bar .count{margin-left:auto; font-size:.74rem; color:var(--dimmer); font-variant-numeric:tabular-nums}
  .langwrap{position:relative; margin-left:auto}
  .langbtn{background:transparent; border:1px solid var(--mauve); color:var(--mauve); border-radius:50%; width:34px; height:34px; font-size:1.05rem; line-height:1; cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center}
  .langbtn:active{background:rgba(185,143,224,.15)}
  .langmenu{position:absolute; top:calc(100% + 8px); right:0; z-index:40; min-width:168px; background:var(--pan2); border:1px solid var(--line2); border-radius:14px; padding:6px; box-shadow:0 14px 34px -8px var(--shadow); display:flex; flex-direction:column; gap:3px; animation:langIn .16s ease both}
  .langmenu[hidden]{display:none}
  @keyframes langIn{from{opacity:0; transform:translateY(-6px)} to{opacity:1; transform:none}}
  .langlist{display:flex; flex-direction:column; gap:7px}
  .langopt{display:flex; align-items:center; gap:10px; width:100%; text-align:left; background:var(--pan); border:1px solid var(--line); border-radius:11px; color:var(--txt); font:inherit; font-size:.9rem; padding:11px 13px; cursor:pointer; transition:border-color .12s ease, color .12s ease}
  .langopt:active{background:var(--pan2)}
  .langopt[aria-selected="true"]{border-color:var(--cyan); color:var(--cyan)}
  .langmenu .langopt{border-color:transparent; background:transparent; padding:10px 12px; border-radius:9px}
  .langmenu .langopt:active{background:var(--pan)}
  .langopt .ck{margin-left:auto; color:var(--cyan); font-weight:700}
  .backbtn{background:var(--pan); border:1px solid var(--line); color:var(--cyan); font:inherit; font-size:1.1rem; width:40px; height:40px; border-radius:11px; cursor:pointer; flex:0 0 auto}
  /* Bandeau image en tete de la liste Frequences : l image du heros sert de fond
     a la barre. Le voile garantit la lisibilite du titre et du compteur, quel
     que soit le theme (l image est sombre dans les deux cas). */
  .libbar{position:relative; overflow:hidden; padding-top:22px; padding-bottom:26px;
    background:var(--bg) url("app-images/228.webp") center 38% / cover no-repeat; backdrop-filter:none}
  .libbar::before{content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(4,8,18,.58), rgba(4,8,18,.34) 45%, rgba(4,8,18,.72)); z-index:0}
  .libbar > *{position:relative; z-index:1}
  .libbar h2{color:#fff; font-size:1.15rem; text-shadow:0 1px 10px rgba(0,0,0,.8)}
  .libbar .count{color:var(--cyan); font-weight:700; font-size:.8rem; text-shadow:0 1px 8px rgba(0,0,0,.9)}
  .libbar .backbtn{background:rgba(255,255,255,.1); border-color:rgba(255,255,255,.28); color:#fff; border-radius:50%; backdrop-filter:blur(4px)}
  .bar h2{font-size:1rem; font-weight:700; margin:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}

  .home{flex:1; display:flex; flex-direction:column; padding:2px 16px 22px; overflow-y:auto; -webkit-overflow-scrolling:touch}
  .home.in > *{opacity:0; animation:cardIn .38s cubic-bezier(.22,.61,.36,1) both}
  .home.in > :nth-child(1){animation-delay:0ms} .home.in > :nth-child(2){animation-delay:50ms}
  .home.in > :nth-child(3){animation-delay:100ms} .home.in > :nth-child(4){animation-delay:150ms}
  .home.in > :nth-child(5){animation-delay:200ms} .home.in > :nth-child(6){animation-delay:250ms}
  .home.in > :nth-child(7){animation-delay:300ms} .home.in > :nth-child(8){animation-delay:350ms}
  @keyframes cardIn{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}

  .heyebrow{display:flex; align-items:center; gap:9px; margin:16px 2px 10px}
  .home > .heyebrow:first-child{margin-top:4px}
  .heyebrow .het{font-size:.66rem; letter-spacing:.2em; text-transform:uppercase; color:var(--dim); font-weight:700; white-space:nowrap}
  .heyebrow .hel{height:1px; flex:1; background:linear-gradient(90deg,var(--line),transparent)}
  .heyebrow.cy .het{color:var(--cyan)}
  .heyebrow.mv .het{color:var(--mauve)} .heyebrow.mv .hel{background:linear-gradient(90deg,rgba(185,143,224,.5),transparent)}

  .hhero,.hscard,.hxcard{position:relative; display:block; text-align:left; padding:0; overflow:hidden; cursor:pointer; color:var(--txt); font:inherit; border:1px solid var(--line); border-radius:20px; transition:transform .12s ease, box-shadow .22s ease, border-color .22s ease}
  .hhero > img,.hscard > img,.hxcard > img{position:absolute; inset:0; width:100%; height:100%; object-fit:cover}
  .hscrim{position:absolute; inset:0; background:none}
  .hhero:active,.hscard:active,.hxcard:active,.hmethod:active{transform:scale(.98)}

  .hring{position:absolute; border-radius:50%; border:2px solid rgba(255,255,255,.9); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; color:#fff; font-weight:700; text-shadow:0 1px 10px rgba(0,0,0,.55); box-shadow:0 0 30px rgba(127,216,240,.5), inset 0 0 24px rgba(127,216,240,.2)}

  .hhero{height:300px; border-color:rgba(127,216,240,.22)}
  .hhero .hring{width:150px; height:150px; top:40px; left:50%; transform:translateX(-50%); font-size:1.6rem; font-variant-numeric:tabular-nums}
  .hhero .hring i{font-style:normal; font-size:.6rem; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:rgba(255,255,255,.72); margin-top:3px}
  /* Texte cale a DROITE depuis le retrait de l'anneau : le padding gauche
     degage le bouton lecture, passe en bas a gauche. */
  .hherobody{position:absolute; left:0; right:0; bottom:0; padding:16px 16px 16px 78px; text-align:right}
  .htag{display:block; font-size:.62rem; letter-spacing:.13em; text-transform:uppercase; color:var(--cyan); font-weight:700; margin-bottom:6px; text-shadow:0 1px 8px rgba(0,0,0,.75)}
  .hh2{display:block; font-size:1.25rem; font-weight:700; text-shadow:0 1px 8px rgba(0,0,0,.8), 0 0 18px rgba(0,0,0,.5)}
  .hsub{display:block; font-size:.76rem; color:#d7e0f2; margin-top:3px; text-shadow:0 1px 6px rgba(0,0,0,.8)}
  /* Carte heros : tout le texte en blanc (l'eyebrow etait cyan, le sous-titre
     bleu pale) — demande de Jonathan, meilleure lisibilite sur cette image. */
  .hhero .htag, .hhero .hh2, .hhero .hsub{color:#fff}
  .hplay{position:absolute; left:16px; bottom:18px; width:48px; height:48px; border-radius:50%; background:var(--cyan); color:#04121a; display:flex; align-items:center; justify-content:center; font-size:1.1rem; box-shadow:0 8px 22px -6px rgba(127,216,240,.6)}

  .hsgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
  .hsgrid .hscard:nth-child(3):last-child{grid-column:1/-1}
  .hscard{height:150px}
  .hsbody{position:absolute; left:0; right:0; bottom:0; padding:10px 12px}
  .hsbody b{display:block; font-size:.95rem; font-weight:700; text-shadow:0 1px 8px rgba(0,0,0,.85), 0 0 16px rgba(0,0,0,.5)}
  .hsbody i{display:block; font-style:normal; font-size:.68rem; color:#d7e0f2; margin-top:2px; text-shadow:0 1px 6px rgba(0,0,0,.85)}
  .hstar{position:absolute; top:9px; right:11px; z-index:2; color:var(--gold); font-size:.9rem; text-shadow:0 1px 6px rgba(0,0,0,.6)}

  .hexplain{margin:0 2px 10px; font-size:.72rem; line-height:1.5; color:var(--dimmer)}
  .hxrail{display:flex; gap:10px; overflow-x:auto; padding:0 16px 6px; margin:0 -16px; scrollbar-width:none}
  .hxrail::-webkit-scrollbar{display:none}
  .hxcard{flex:0 0 auto; width:120px; height:145px; border-radius:16px; border-color:rgba(185,143,224,.2)}
  .hxcard b{position:absolute; left:0; right:0; bottom:0; padding:9px 10px; font-size:.78rem; font-weight:700; z-index:2; text-shadow:0 1px 8px rgba(0,0,0,.85), 0 0 16px rgba(0,0,0,.5)}
  /* Cartes dont la photo passe en version claire (celles qui portent un data-light) :
     le halo sombre du mode nuit rend le texte boueux sur une image pale, et le
     sous-titre bleu pale (#d7e0f2) devient invisible. Titre en bleu nuit + halo
     blanc, comme la maquette. Les cartes restees sombres (Construis ta musique,
     Couleurs) ne sont pas touchees : leur texte blanc reste le bon choix. */
  :root[data-theme="light"] .hscard:has(img[data-light]) .hsbody b,
  :root[data-theme="light"] .hxcard:has(img[data-light]) > b{
    color:var(--txt); text-shadow:0 1px 6px rgba(255,255,255,.95), 0 0 14px rgba(255,255,255,.8)}
  :root[data-theme="light"] .hscard:has(img[data-light]) .hsbody i{
    color:var(--dim); text-shadow:0 1px 5px rgba(255,255,255,.95)}
  :root[data-theme="light"] .hscard:has(img[data-light]) .hstar{
    text-shadow:0 1px 6px rgba(255,255,255,.95)}
  /* Symetrique : les cartes qui gardent une photo SOMBRE en mode clair (carte
     heros, Construis ta musique, Couleurs) doivent rendre leur texte comme en
     mode nuit, sinon le titre en bleu nuit devient illisible sur du noir.
     On redefinit les jetons a l'echelle de la carte : tout ce qu'elle contient
     suit, sans avoir a lister chaque element. */
  :root[data-theme="light"] .hhero:not(:has(img[data-light])),
  :root[data-theme="light"] .hscard:not(:has(img[data-light])),
  :root[data-theme="light"] .hxcard:not(:has(img[data-light])){
    --txt:#e8edf8; --dim:#93a2c2; --cyan:#7fd8f0; --mauve:#b98fe0; --gold:#e9c96a}

  .hmethod{display:flex; align-items:center; gap:12px; width:100%; margin-top:16px; padding:13px 14px; border:1px solid var(--line); border-radius:15px; background:linear-gradient(120deg, rgba(127,216,240,.08), rgba(17,26,51,.5)); color:var(--txt); font:inherit; cursor:pointer; text-align:left; transition:transform .12s ease}
  .hmic{flex:0 0 auto; width:34px; height:34px; border-radius:10px; background:rgba(127,216,240,.14); color:var(--cyan); display:flex; align-items:center; justify-content:center; font-size:1.05rem}
  .hmt{flex:1} .hmt b{display:block; font-size:.9rem; font-weight:700} .hmt i{display:block; font-style:normal; font-size:.72rem; color:var(--dim); margin-top:1px}
  .hmar{color:var(--cyan); font-size:1.1rem}

  .pad{padding:0 18px}
  /* La loupe et le bouton d effacement sont poses par-dessus le champ ; le
     padding interne du champ leur reserve la place. */
  .searchwrap{position:relative; margin-bottom:12px}
  .searchwrap .searchicon{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:18px; height:18px; color:var(--dimmer); pointer-events:none; z-index:1}
  .searchclear{position:absolute; right:8px; top:50%; transform:translateY(-50%); width:28px; height:28px; border-radius:50%; border:0; background:var(--line); color:var(--txt); font:inherit; font-size:1rem; line-height:1; cursor:pointer; z-index:1; display:flex; align-items:center; justify-content:center}
  .searchclear[hidden]{display:none}
  .search{width:100%; background:var(--pan); border:1px solid var(--line); border-radius:26px; color:var(--txt); font:inherit; font-size:.95rem; padding:13px 44px 13px 42px; margin:0}
  .search::-webkit-search-cancel-button{display:none}
  .search::placeholder{color:var(--dimmer)}
  /* Contour mis en valeur : filet colore en degrade + halo diffus. Le degrade
     de bordure demande deux fonds superposes — le fond plein s arrete au
     padding-box, le degrade occupe la border-box et n est visible que la ou la
     bordure est transparente. Donc pas de border-color au focus, elle
     masquerait le degrade : c est le halo qui reagit. */
  .search{border-color:transparent;
    background:linear-gradient(var(--pan),var(--pan)) padding-box,
               linear-gradient(115deg, rgba(var(--cyan-rgb),1), rgba(var(--cyan-rgb),.57) 48%, rgba(var(--cyan-rgb),1)) border-box;
    box-shadow:0 0 30px rgba(var(--cyan-rgb),var(--glow));
    transition:box-shadow .22s ease}
  .search:focus{outline:none; box-shadow:0 0 33px rgba(var(--cyan-rgb),calc(var(--glow) + .21))}
  /* Passage en 2 lignes plutot qu en defilement horizontal : la barre de
     defilement etait masquee (scrollbar-width:none), donc rien n indiquait que
     "Huile essentielle" et "Element" existaient. Meme probleme sur la page
     Geometrie, qui a 6 filtres. */
  .filters{display:flex; flex-wrap:wrap; gap:8px; padding-bottom:12px}
  .filters::-webkit-scrollbar{display:none}
  .filters button{flex:0 0 auto; background:var(--pan); border:1px solid var(--line); color:var(--dim); font:inherit; font-size:.82rem; padding:7px 13px; border-radius:20px; cursor:pointer; white-space:nowrap}
  .filters button[aria-pressed="true"]{background:rgba(127,216,240,.13); border-color:var(--cyan); color:var(--cyan)}
  .lsec{display:flex; align-items:center; gap:8px; margin:16px 0 9px; color:var(--cyan); font-size:.72rem; font-weight:700; letter-spacing:.18em; text-transform:uppercase}
  .lsec:first-child{margin-top:2px}
  .lsec .lsecicon{width:14px; height:14px; flex:0 0 auto}
  .lsec .lsecline{flex:1; height:1px; background:currentColor; opacity:.3}
  .lsec.Endogène{color:var(--endo)}
  .lsec.Phyto{color:var(--phyto)}
  .lsec.Huiles{color:var(--he)}
  .lsec.Élément{color:var(--elem)}
  .fbtn{display:inline-flex; align-items:center; gap:6px; padding:8px 14px 8px 10px}
  .fbtn .ficon{width:15px; height:15px; flex:0 0 auto}
  .fbtn[data-c="Phyto"][aria-pressed="true"]{background:rgba(143,224,168,.14); border-color:var(--phyto); color:var(--phyto)}
  .fbtn[data-c="Huiles ess."][aria-pressed="true"]{background:rgba(230,184,102,.14); border-color:var(--he); color:var(--he)}
  .fbtn[data-c="Élément"][aria-pressed="true"]{background:rgba(185,143,224,.14); border-color:var(--elem); color:var(--elem)}
  .dot.Endogène{background:var(--endo)}
  .dot.Élément{background:var(--elem)}
  .manualbtn{width:100%; background:var(--pan); border:1px dashed var(--line2); color:var(--cyan); font:inherit; font-size:.9rem; font-weight:600; padding:12px; border-radius:12px; cursor:pointer; margin-bottom:12px}
  .actrow{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px}
  .actbtn{display:flex; align-items:center; gap:10px; width:100%; background:var(--pan); border:1px solid var(--line2); color:var(--txt); font:inherit; text-align:left; padding:12px 10px; border-radius:16px; cursor:pointer}
  /* Meme filet en degrade que la barre de recherche, dans la couleur de
     l action : cyan pour la saisie manuelle, mauve pour l enchainement. */
  .actbtn{border-color:transparent;
    background:linear-gradient(var(--pan),var(--pan)) padding-box,
               linear-gradient(135deg, rgba(var(--cyan-rgb),1), rgba(var(--cyan-rgb),.52) 52%, rgba(var(--cyan-rgb),1)) border-box;
    box-shadow:0 0 30px rgba(var(--cyan-rgb),var(--glow));
    transition:box-shadow .22s ease, transform .12s ease}
  .actbtn:nth-child(2){
    background:linear-gradient(var(--pan),var(--pan)) padding-box,
               linear-gradient(135deg, rgba(var(--mauve-rgb),1), rgba(var(--mauve-rgb),.52) 52%, rgba(var(--mauve-rgb),1)) border-box;
    box-shadow:0 0 30px rgba(var(--mauve-rgb),var(--glow))}
  .actbtn:active{transform:scale(.98); box-shadow:0 0 36px rgba(var(--cyan-rgb),calc(var(--glow) + .21))}
  .actbtn:nth-child(2):active{box-shadow:0 0 36px rgba(var(--mauve-rgb),calc(var(--glow) + .21))}
  .actbtn .acticon{flex:0 0 auto; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:1rem; background:rgba(127,216,240,.14); color:var(--cyan)}
  .actbtn:nth-child(2) .acticon{background:rgba(185,143,224,.14); color:var(--mauve)}
  .actbtn .actlabel{flex:1; font-size:.82rem; font-weight:600; line-height:1.3}
  .actbtn .actarrow{flex:0 0 auto; color:var(--dimmer); font-size:1.1rem}
  .manualbtn:active{background:var(--pan2)}

  .list{padding:2px 18px 20px; overflow-y:auto}
  .geogrid{display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:4px 18px 22px; overflow-y:auto}
  .gtile{display:flex; flex-direction:column; background:rgba(17,26,51,.5); border:1px solid var(--line); border-radius:14px; overflow:hidden; cursor:pointer; color:var(--txt); font:inherit; padding:0; transition:transform .12s ease, box-shadow .22s ease, background .12s ease, border-color .22s ease}
  .gtile:active{background:var(--pan2); transform:scale(.975); border-color:rgba(185,143,224,.5); box-shadow:0 0 20px rgba(185,143,224,.26)}
  .gtvis{position:relative; width:100%; aspect-ratio:1; display:flex; align-items:center; justify-content:center; background:#05070f}
  .gtvis img{width:100%; height:100%; object-fit:cover; filter:grayscale(1) contrast(1.12)}

  /* Une meme photo etalee sur plusieurs cartes : l image est agrandie a la
     hauteur du bloc complet (cartes + gouttieres de 9px) puis remontee, chaque
     carte n en laissant voir que sa tranche. Les 100% de top se referent a la
     hauteur de la carte (98px), donc -100% - 9px = une carte plus la gouttiere. */
  .item.mol .itembg.sl{bottom:auto}
  .item.mol .itembg.sl3{height:calc(300% + 18px)}
  .item.mol .itembg.sl3-1{top:calc(-100% - 9px)}

(function(){

var MOLDESC={"Azote": {"fr": "Gaz incolore et inodore qui compose près de 78 % de l'atmosphère terrestre. Malgré cette discrétion, l'azote est partout dans le vivant : chaque acide aminé, chaque brin d'ADN et la chlorophylle en contiennent. Les plantes en dépendent pour croître, ce qui en fait la base de la plupart des engrais, et sous forme liquide il sert à conserver cellules et aliments par le froid. Dans Auralis, sa fréquence de 83,53 Hz est dérivée de sa masse molaire.", "en": "A colorless, odorless gas that makes up nearly 78% of Earth's atmosphere. Despite its discretion, nitrogen is everywhere in living things: every amino acid, every strand of DNA and chlorophyll contains it. Plants depend on it to grow, which makes it the basis of most fertilizers, and in liquid form it is used to preserve cells and food by cold. In Auralis, its 83.53 Hz frequency is derived from its molar mass.", "es": "Gas incoloro e inodoro que compone cerca del 78 % de la atmósfera terrestre. Pese a su discreción, el nitrógeno está en todas partes en lo vivo: cada aminoácido, cada hebra de ADN y la clorofila lo contienen. Las plantas dependen de él para crecer, lo que lo convierte en la base de la mayoría de los fertilizantes, y en forma líquida sirve para conservar células y alimentos por el frío. En Auralis, su frecuencia de 83,53 Hz se deriva de su masa molar."}, "Bore": {"fr": "Métalloïde relativement rare, présent en traces dans l'organisme et en petites quantités dans les fruits, légumes, noix et légumineuses. Il est essentiel aux plantes et fait l'objet de recherches pour son rôle possible dans la santé osseuse. Le bore donne une flamme verte caractéristique et entre dans la composition de verres très résistants à la chaleur, comme le Pyrex. Sa fréquence Auralis (64,45 Hz) dérive de sa masse molaire.", "en": "A relatively rare metalloid, present in trace amounts in the body and in small quantities in fruits, vegetables, nuts and legumes. It is essential to plants and is being researched for its possible role in bone health. Boron produces a characteristic green flame and is used to make highly heat-resistant glass, such as Pyrex. Its Auralis frequency (64.45 Hz) is derived from its molar mass.", "es": "Metaloide relativamente raro, presente en trazas en el organismo y en pequeñas cantidades en frutas, verduras, frutos secos y legumbres. Es esencial para las plantas y se investiga por su posible papel en la salud ósea. El boro produce una llama verde característica y forma parte de vidrios muy resistentes al calor, como el Pyrex. Su frecuencia Auralis (64,45 Hz) se deriva de su masa molar."}, "Calcium": {"fr": "Minéral le plus abondant de l'organisme, dont la grande majorité se trouve dans les os et les dents, qu'il structure. Au-delà du squelette, il participe à la contraction musculaire, à la coagulation du sang et à la transmission des signaux nerveux. On le trouve dans les produits laitiers, les légumes à feuilles vertes, les amandes, le tofu et certaines eaux minérales. Sa fréquence Auralis (59,74 Hz) est dérivée de sa masse molaire.", "en": "The most abundant mineral in the body, the vast majority of which is found in the bones and teeth, which it structures. Beyond the skeleton, it takes part in muscle contraction, blood clotting and the transmission of nerve signals. It is found in dairy products, leafy green vegetables, almonds, tofu and some mineral waters. Its Auralis frequency (59.74 Hz) is derived from its molar mass.", "es": "El mineral más abundante del organismo, cuya gran mayoría se encuentra en los huesos y los dientes, a los que da estructura. Más allá del esqueleto, participa en la contracción muscular, la coagulación de la sangre y la transmisión de las señales nerviosas. Se encuentra en los lácteos, las verduras de hoja verde, las almendras, el tofu y algunas aguas minerales. Su frecuencia Auralis (59,74 Hz) se deriva de su masa molar."}, "Carbone": {"fr": "Le carbone est l'élément central de la vie : sa capacité à former de longues chaînes fait de lui le squelette de presque toutes les molécules organiques, des sucres à l'ADN. On le rencontre sous des formes très différentes — graphite tendre, diamant très dur, ou gaz carbonique dans l'air. Chimiquement, tout organisme vivant est une architecture de carbone. Sa fréquence Auralis (71,60 Hz) dérive de sa masse molaire.", "en": "Carbon is the central element of life: its ability to form long chains makes it the backbone of almost every organic molecule, from sugars to DNA. It appears in very different forms — soft graphite, very hard diamond, or carbon dioxide gas in the air. Chemically, every living organism is an architecture of carbon. Its Auralis frequency (71.60 Hz) derives from its molar mass.", "es": "El carbono es el elemento central de la vida: su capacidad para formar largas cadenas lo convierte en el esqueleto de casi todas las moléculas orgánicas, desde los azúcares hasta el ADN. Se presenta en formas muy distintas — grafito blando, diamante muy duro, o dióxido de carbono en el aire. Químicamente, todo organismo vivo es una arquitectura de carbono. Su frecuencia Auralis (71,60 Hz) deriva de su masa molar."}, "Chrome": {"fr": "Oligo-élément que le corps ne contient qu'en traces, apporté par des aliments comme le brocoli, les grains entiers, la viande et la levure. On l'étudie pour son rôle dans le métabolisme des glucides. Sous forme métallique, le chrome donne son éclat brillant aux surfaces « chromées » et sa résistance aux aciers inoxydables. Sa fréquence Auralis (77,50 Hz) est dérivée de sa masse molaire.", "en": "A trace element that the body contains only in traces, supplied by foods such as broccoli, whole grains, meat and yeast. It is studied for its role in carbohydrate metabolism. In metallic form, chromium gives its bright shine to 'chromed' surfaces and its resistance to stainless steels. Its Auralis frequency (77.50 Hz) is derived from its molar mass.", "es": "Oligoelemento que el cuerpo solo contiene en trazas, aportado por alimentos como el brócoli, los granos enteros, la carne y la levadura. Se estudia por su papel en el metabolismo de los carbohidratos. En forma metálica, el cromo da su brillo a las superficies «cromadas» y su resistencia a los aceros inoxidables. Su frecuencia Auralis (77,50 Hz) se deriva de su masa molar."}, "Cuivre": {"fr": "Métal rougeâtre connu depuis la préhistoire, à la fois oligo-élément essentiel et grand conducteur d'électricité. Dans l'organisme, il participe à la formation des globules rouges et au bon fonctionnement des nerfs et du système immunitaire. On l'apporte par les fruits de mer, les noix, les graines, le chocolat noir et les abats. Sa fréquence Auralis (94,71 Hz) dérive de sa masse molaire.", "en": "A reddish metal known since prehistory, both an essential trace element and a great conductor of electricity. In the body, it takes part in the formation of red blood cells and in the proper functioning of the nerves and immune system. It is supplied by seafood, nuts, seeds, dark chocolate and organ meats. Its Auralis frequency (94.71 Hz) derives from its molar mass.", "es": "Metal rojizo conocido desde la prehistoria, a la vez oligoelemento esencial y gran conductor de la electricidad. En el organismo, participa en la formación de los glóbulos rojos y en el buen funcionamiento de los nervios y el sistema inmunitario. Se aporta con mariscos, frutos secos, semillas, chocolate negro y vísceras. Su frecuencia Auralis (94,71 Hz) deriva de su masa molar."}, "Eau Structurée (H3O2) - R.Ruhlmann": {"fr": "Concept d'« eau structurée » (parfois notée H₃O₂), une eau organisée en couches, décrite entre autres par R. Ruhlmann et rapprochée des recherches sur l'« eau de zone d'exclusion ». Elle est présentée comme un état intermédiaire entre l'eau liquide et la glace, que l'on retrouverait au contact des surfaces et dans le vivant. C'est un sujet exploratoire, encore débattu sur le plan scientifique. Sa fréquence Auralis (104,40 Hz) est dérivée de la masse molaire retenue pour cette forme.", "en": "The concept of 'structured water' (sometimes written H₃O₂), a layered form of water described among others by R. Ruhlmann and linked to research on 'exclusion-zone water'. It is presented as an intermediate state between liquid water and ice, said to be found at the contact of surfaces and in living things. It is an exploratory topic, still debated scientifically. Its Auralis frequency (104.40 Hz) is derived from the molar mass adopted for this form.", "es": "El concepto de «agua estructurada» (a veces escrita H₃O₂), un agua organizada en capas, descrita entre otros por R. Ruhlmann y relacionada con la investigación sobre el «agua de zona de exclusión». Se presenta como un estado intermedio entre el agua líquida y el hielo, que se encontraría en el contacto de las superficies y en lo vivo. Es un tema exploratorio, aún debatido en el plano científico. Su frecuencia Auralis (104,40 Hz) se deriva de la masa molar adoptada para esta forma."}, "Fer": {"fr": "Minéral indispensable à la vie : au cœur de l'hémoglobine, il transporte l'oxygène des poumons vers tout le corps. C'est aussi l'un des métaux qui ont façonné l'histoire humaine, de l'âge du fer à l'acier moderne. On l'apporte par la viande rouge, les légumineuses, les épinards, le boudin et les fruits secs. Sa fréquence Auralis (83,24 Hz) dérive de sa masse molaire.", "en": "A mineral indispensable to life: at the heart of hemoglobin, it carries oxygen from the lungs to the whole body. It is also one of the metals that shaped human history, from the Iron Age to modern steel. It is supplied by red meat, legumes, spinach, blood sausage and dried fruit. Its Auralis frequency (83.24 Hz) derives from its molar mass.", "es": "Mineral indispensable para la vida: en el corazón de la hemoglobina, transporta el oxígeno desde los pulmones a todo el cuerpo. Es también uno de los metales que moldearon la historia humana, desde la Edad del Hierro hasta el acero moderno. Se aporta con la carne roja, las legumbres, las espinacas, la morcilla y los frutos secos. Su frecuencia Auralis (83,24 Hz) deriva de su masa molar."}, "Fluor": {"fr": "Élément très réactif dont la forme utile à l'organisme, le fluorure, est surtout connue pour renforcer l'émail des dents — d'où sa présence dans de nombreux dentifrices et eaux. On le trouve naturellement dans l'eau, le thé, le poisson et certains végétaux. À l'état pur, le fluor est un gaz jaunâtre extrêmement réactif. Sa fréquence Auralis (113,27 Hz) est dérivée de sa masse molaire.", "en": "A highly reactive element whose form useful to the body, fluoride, is mainly known for strengthening tooth enamel — hence its presence in many toothpastes and waters. It is found naturally in water, tea, fish and some plants. In pure form, fluorine is an extremely reactive yellowish gas. Its Auralis frequency (113.27 Hz) is derived from its molar mass.", "es": "Elemento muy reactivo cuya forma útil para el organismo, el fluoruro, es conocida sobre todo por reforzar el esmalte de los dientes — de ahí su presencia en muchas pastas dentales y aguas. Se encuentra de forma natural en el agua, el té, el pescado y algunas plantas. En estado puro, el flúor es un gas amarillento extremadamente reactivo. Su frecuencia Auralis (113,27 Hz) se deriva de su masa molar."}, "Hélium": {"fr": "Deuxième élément le plus abondant de l'univers, l'hélium est un gaz noble ultraléger et chimiquement inerte, né au cœur des étoiles. Sur Terre il est rare et précieux : on l'utilise pour refroidir les appareils d'IRM, gonfler ballons et dirigeables, et dans de nombreuses applications scientifiques. Respiré, il rend la voix aiguë car le son y voyage plus vite. Sa fréquence Auralis (95,45 Hz) dérive de sa masse molaire.", "en": "The second most abundant element in the universe, helium is an ultralight, chemically inert noble gas born in the heart of stars. On Earth it is rare and precious: it is used to cool MRI machines, inflate balloons and airships, and in many scientific applications. When breathed, it makes the voice high-pitched because sound travels faster through it. Its Auralis frequency (95.45 Hz) derives from its molar mass.", "es": "Segundo elemento más abundante del universo, el helio es un gas noble ultraligero y químicamente inerte, nacido en el corazón de las estrellas. En la Tierra es raro y valioso: se usa para enfriar los equipos de resonancia magnética, inflar globos y dirigibles, y en numerosas aplicaciones científicas. Al respirarlo, agudiza la voz porque el sonido viaja más rápido por él. Su frecuencia Auralis (95,45 Hz) deriva de su masa molar."}, "Iode": {"fr": "Oligo-élément indispensable à la thyroïde, la glande qui règle le métabolisme ; c'est pourquoi le sel de table est souvent enrichi en iode. On le trouve surtout dans les produits de la mer, les algues, le poisson et les fruits de mer. Sous forme pure, l'iode est un solide violet foncé qui se sublime en vapeurs mauves. Sa fréquence Auralis (94,57 Hz) est dérivée de sa masse molaire.", "en": "A trace element indispensable to the thyroid, the gland that regulates metabolism; this is why table salt is often enriched with iodine. It is found mainly in seafood, seaweed, fish and shellfish. In pure form, iodine is a dark violet solid that sublimates into purple vapors. Its Auralis frequency (94.57 Hz) is derived from its molar mass.", "es": "Oligoelemento indispensable para la tiroides, la glándula que regula el metabolismo; por eso la sal de mesa suele enriquecerse con yodo. Se encuentra sobre todo en los productos del mar, las algas, el pescado y los mariscos. En estado puro, el yodo es un sólido violeta oscuro que se sublima en vapores morados. Su frecuencia Auralis (94,57 Hz) se deriva de su masa molar."}, "Lithium": {"fr": "Le lithium est le métal le plus léger, si peu dense qu'il flotte sur l'eau. Il est aujourd'hui au cœur des batteries de nos téléphones et voitures électriques. On le trouve à l'état de traces dans certaines eaux minérales, végétaux et céréales. Sa fréquence Auralis (82,77 Hz) dérive de sa masse molaire.", "en": "Lithium is the lightest metal, so low in density that it floats on water. It is today at the heart of the batteries in our phones and electric cars. It is found in trace amounts in some mineral waters, plants and grains. Its Auralis frequency (82.77 Hz) derives from its molar mass.", "es": "El litio es el metal más ligero, tan poco denso que flota en el agua. Hoy está en el corazón de las baterías de nuestros teléfonos y coches eléctricos. Se encuentra en trazas en algunas aguas minerales, plantas y cereales. Su frecuencia Auralis (82,77 Hz) deriva de su masa molar."}, "Magnésium": {"fr": "Minéral essentiel présent dans les légumes verts, les noix, les graines, les légumineuses, le cacao et certaines eaux minérales. Dans l'organisme, il intervient dans des centaines de réactions enzymatiques et contribue au fonctionnement du système nerveux et des muscles ainsi qu'à l'équilibre électrolytique. C'est l'un des minéraux les plus étudiés en nutrition et l'un des plus présents dans les compléments de bien-être. Il est traditionnellement associé à la détente, à la récupération et à la qualité du repos. Dans Auralis, sa fréquence de 72,45 Hz dérive de sa masse molaire (24,305 g/mol), ramenée par octaves dans la plage audible.", "en": "An essential mineral present in green vegetables, nuts, seeds, legumes, cocoa and some mineral waters. In the body, it is involved in hundreds of enzyme reactions and contributes to the functioning of the nervous system and muscles as well as to electrolyte balance. It is one of the most studied minerals in nutrition and one of the most common in wellness supplements. It is traditionally associated with relaxation, recovery and quality of rest. In Auralis, its 72.45 Hz frequency derives from its molar mass (24.305 g/mol), brought by octaves into the audible range.", "es": "Mineral esencial presente en verduras verdes, frutos secos, semillas, legumbres, cacao y algunas aguas minerales. En el organismo interviene en cientos de reacciones enzimáticas y contribuye al funcionamiento del sistema nervioso y los músculos, así como al equilibrio electrolítico. Es uno de los minerales más estudiados en nutrición y uno de los más presentes en los complementos de bienestar. Se asocia tradicionalmente con la relajación, la recuperación y la calidad del descanso. En Auralis, su frecuencia de 72,45 Hz deriva de su masa molar (24,305 g/mol), llevada por octavas al rango audible."}, "Manganèse": {"fr": "Oligo-élément que l'organisme utilise en petites quantités dans de nombreuses enzymes, notamment celles qui protègent les cellules et participent au métabolisme. On l'apporte par les grains entiers, les noix, les légumineuses, le thé et les légumes à feuilles. Comme métal, le manganèse sert surtout à durcir l'acier. Sa fréquence Auralis (83,24 Hz) est dérivée de sa masse molaire.", "en": "A trace element that the body uses in small amounts in many enzymes, notably those that protect cells and take part in metabolism. It is supplied by whole grains, nuts, legumes, tea and leafy vegetables. As a metal, manganese is used mainly to harden steel. Its Auralis frequency (83.24 Hz) is derived from its molar mass.", "es": "Oligoelemento que el organismo utiliza en pequeñas cantidades en numerosas enzimas, en particular las que protegen las células y participan en el metabolismo. Se aporta con los granos enteros, los frutos secos, las legumbres, el té y las verduras de hoja. Como metal, el manganeso sirve sobre todo para endurecer el acero. Su frecuencia Auralis (83,24 Hz) se deriva de su masa molar."}, "Molybdène": {"fr": "Oligo-élément présent en très petites quantités dans l'organisme, où il sert de cofacteur à des enzymes qui aident à traiter certains composés et médicaments. On l'apporte surtout par les légumineuses, les grains entiers et les noix. Comme métal, le molybdène résiste à des températures extrêmes et renforce les aciers. Sa fréquence Auralis (71,51 Hz) dérive de sa masse molaire.", "en": "A trace element present in very small amounts in the body, where it acts as a cofactor for enzymes that help process certain compounds and medications. It is supplied mainly by legumes, whole grains and nuts. As a metal, molybdenum withstands extreme temperatures and strengthens steels. Its Auralis frequency (71.51 Hz) derives from its molar mass.", "es": "Oligoelemento presente en cantidades muy pequeñas en el organismo, donde actúa como cofactor de enzimas que ayudan a procesar ciertos compuestos y medicamentos. Se aporta sobre todo con las legumbres, los granos enteros y los frutos secos. Como metal, el molibdeno resiste temperaturas extremas y refuerza los aceros. Su frecuencia Auralis (71,51 Hz) deriva de su masa molar."}, "Or": {"fr": "Métal précieux par excellence, l'or fascine l'humanité depuis des millénaires par son éclat et son inaltérabilité — il ne rouille ni ne ternit. Très stable chimiquement, il est aussi utilisé en électronique, en dentisterie et en joaillerie. On en trouve des traces infimes dans l'eau de mer et le corps humain. Sa fréquence Auralis (73,23 Hz) est dérivée de sa masse molaire.", "en": "The precious metal par excellence, gold has fascinated humanity for millennia with its shine and its unalterability — it neither rusts nor tarnishes. Chemically very stable, it is also used in electronics, dentistry and jewelry. Tiny traces of it are found in seawater and the human body. Its Auralis frequency (73.23 Hz) is derived from its molar mass.", "es": "El metal precioso por excelencia, el oro fascina a la humanidad desde hace milenios por su brillo y su inalterabilidad — no se oxida ni se empaña. Químicamente muy estable, también se usa en electrónica, odontología y joyería. Se encuentran trazas ínfimas en el agua de mar y el cuerpo humano. Su frecuencia Auralis (73,23 Hz) se deriva de su masa molar."}, "Oxygène": {"fr": "L'oxygène, qui forme environ 21 % de l'air, est le gaz dont dépend presque toute vie : nos cellules l'utilisent pour transformer les aliments en énergie. Produit par les plantes et les algues lors de la photosynthèse, il est aussi l'élément le plus abondant de la croûte terrestre et du corps humain, surtout sous forme d'eau. Sans lui, ni combustion ni respiration ne seraient possibles. Sa fréquence Auralis (95,39 Hz) dérive de sa masse molaire.", "en": "Oxygen, which makes up about 21% of the air, is the gas on which almost all life depends: our cells use it to turn food into energy. Produced by plants and algae during photosynthesis, it is also the most abundant element in Earth's crust and in the human body, mostly as water. Without it, neither combustion nor respiration would be possible. Its Auralis frequency (95.39 Hz) derives from its molar mass.", "es": "El oxígeno, que forma cerca del 21 % del aire, es el gas del que depende casi toda la vida: nuestras células lo usan para transformar los alimentos en energía. Producido por las plantas y las algas durante la fotosíntesis, es también el elemento más abundante de la corteza terrestre y del cuerpo humano, sobre todo en forma de agua. Sin él, ni la combustión ni la respiración serían posibles. Su frecuencia Auralis (95,39 Hz) deriva de su masa molar."}, "Phosphore": {"fr": "Minéral essentiel qui, avec le calcium, structure les os et les dents. Il est aussi au cœur de l'ADN et de l'ATP, la molécule qui stocke l'énergie des cellules. On l'apporte par la viande, le poisson, les œufs, les produits laitiers et les légumineuses. Sa fréquence Auralis (92,32 Hz) est dérivée de sa masse molaire.", "en": "An essential mineral that, together with calcium, structures the bones and teeth. It is also at the heart of DNA and of ATP, the molecule that stores the cells' energy. It is supplied by meat, fish, eggs, dairy products and legumes. Its Auralis frequency (92.32 Hz) is derived from its molar mass.", "es": "Mineral esencial que, junto al calcio, da estructura a los huesos y los dientes. También está en el corazón del ADN y del ATP, la molécula que almacena la energía de las células. Se aporta con la carne, el pescado, los huevos, los lácteos y las legumbres. Su frecuencia Auralis (92,32 Hz) se deriva de su masa molar."}, "Platine": {"fr": "Métal précieux plus rare que l'or, gris-blanc, dense et remarquablement résistant à la corrosion. On l'emploie en joaillerie fine, mais surtout comme catalyseur — notamment dans les pots catalytiques des voitures et l'industrie chimique. Il entre aussi dans certains équipements médicaux. Sa fréquence Auralis (72,53 Hz) dérive de sa masse molaire.", "en": "A precious metal rarer than gold, gray-white, dense and remarkably resistant to corrosion. It is used in fine jewelry, but above all as a catalyst — notably in the catalytic converters of cars and in the chemical industry. It is also used in some medical equipment. Its Auralis frequency (72.53 Hz) derives from its molar mass.", "es": "Metal precioso más raro que el oro, gris-blanco, denso y notablemente resistente a la corrosión. Se emplea en joyería fina, pero sobre todo como catalizador — en particular en los catalizadores de los coches y en la industria química. También se usa en ciertos equipos médicos. Su frecuencia Auralis (72,53 Hz) deriva de su masa molar."}, "Potassium": {"fr": "Minéral parmi les plus importants de l'organisme : il règle l'équilibre des liquides et permet la transmission des signaux nerveux et la contraction des muscles, dont le cœur. Il travaille en tandem avec le sodium. On le trouve dans la banane, la pomme de terre, les légumineuses, les épinards et l'avocat. Sa fréquence Auralis (116,55 Hz) est dérivée de sa masse molaire.", "en": "One of the most important minerals in the body: it regulates fluid balance and enables the transmission of nerve signals and the contraction of muscles, including the heart. It works in tandem with sodium. It is found in banana, potato, legumes, spinach and avocado. Its Auralis frequency (116.55 Hz) is derived from its molar mass.", "es": "Uno de los minerales más importantes del organismo: regula el equilibrio de los líquidos y permite la transmisión de las señales nerviosas y la contracción de los músculos, incluido el corazón. Trabaja en tándem con el sodio. Se encuentra en el plátano, la patata, las legumbres, las espinacas y el aguacate. Su frecuencia Auralis (116,55 Hz) se deriva de su masa molar."}, "Silicium": {"fr": "Après l'oxygène, le silicium est l'élément le plus abondant de la croûte terrestre : c'est le composant principal du sable, du quartz et du verre. Il est aussi le cœur de l'électronique moderne — les puces de nos appareils sont gravées dans le silicium. Présent en traces dans le corps, on l'associe aux tissus conjonctifs, à la peau et aux ongles. Sa fréquence Auralis (83,72 Hz) dérive de sa masse molaire.", "en": "After oxygen, silicon is the most abundant element in Earth's crust: it is the main component of sand, quartz and glass. It is also the heart of modern electronics — the chips in our devices are etched into silicon. Present in traces in the body, it is associated with connective tissue, skin and nails. Its Auralis frequency (83.72 Hz) derives from its molar mass.", "es": "Después del oxígeno, el silicio es el elemento más abundante de la corteza terrestre: es el componente principal de la arena, el cuarzo y el vidrio. También es el corazón de la electrónica moderna — los chips de nuestros aparatos están grabados en silicio. Presente en trazas en el cuerpo, se asocia con los tejidos conjuntivos, la piel y las uñas. Su frecuencia Auralis (83,72 Hz) deriva de su masa molar."}, "Sodium": {"fr": "Le sodium, associé au chlore, forme le sel de table. Dans l'organisme, il règle l'équilibre de l'eau et permet, avec le potassium, la transmission des influx nerveux et la contraction musculaire. Naturellement présent dans de nombreux aliments, il est surtout apporté par le sel ajouté. Sa fréquence Auralis (68,53 Hz) est dérivée de sa masse molaire.", "en": "Sodium, combined with chlorine, forms table salt. In the body, it regulates water balance and, together with potassium, enables the transmission of nerve impulses and muscle contraction. Naturally present in many foods, it is supplied mainly by added salt. Its Auralis frequency (68.53 Hz) is derived from its molar mass.", "es": "El sodio, combinado con el cloro, forma la sal de mesa. En el organismo, regula el equilibrio del agua y, junto al potasio, permite la transmisión de los impulsos nerviosos y la contracción muscular. Presente de forma natural en muchos alimentos, se aporta sobre todo con la sal añadida. Su frecuencia Auralis (68,53 Hz) se deriva de su masa molar."}, "Soufre": {"fr": "Le soufre entre dans la composition de plusieurs acides aminés, et donc de toutes les protéines, ainsi que de nombreux composés odorants — l'odeur de l'ail, de l'oignon ou de l'œuf. On l'apporte par les protéines, l'ail, l'oignon, les crucifères et les œufs. À l'état pur, c'est un solide jaune connu depuis l'Antiquité. Sa fréquence Auralis (95,58 Hz) dérive de sa masse molaire.", "en": "Sulfur is part of several amino acids, and therefore of all proteins, as well as of many odorous compounds — the smell of garlic, onion or egg. It is supplied by proteins, garlic, onion, cruciferous vegetables and eggs. In pure form, it is a yellow solid known since antiquity. Its Auralis frequency (95.58 Hz) derives from its molar mass.", "es": "El azufre forma parte de varios aminoácidos, y por tanto de todas las proteínas, así como de numerosos compuestos olorosos — el olor del ajo, la cebolla o el huevo. Se aporta con las proteínas, el ajo, la cebolla, las crucíferas y los huevos. En estado puro, es un sólido amarillo conocido desde la Antigüedad. Su frecuencia Auralis (95,58 Hz) deriva de su masa molar."}, "Strontium": {"fr": "Métal proche du calcium par sa chimie, présent en traces dans l'eau, les fruits de mer et certains végétaux. Le corps le traite un peu comme le calcium, et on l'étudie pour son rapport avec le tissu osseux. Ses sels colorent en rouge vif les feux d'artifice et les fusées éclairantes. Sa fréquence Auralis (87,62 Hz) est dérivée de sa masse molaire.", "en": "A metal close to calcium in its chemistry, present in traces in water, seafood and some plants. The body treats it somewhat like calcium, and it is studied for its relationship with bone tissue. Its salts color fireworks and flares bright red. Its Auralis frequency (87.62 Hz) is derived from its molar mass.", "es": "Metal cercano al calcio por su química, presente en trazas en el agua, los mariscos y algunas plantas. El cuerpo lo trata un poco como al calcio, y se estudia por su relación con el tejido óseo. Sus sales colorean de rojo vivo los fuegos artificiales y las bengalas. Su frecuencia Auralis (87,62 Hz) se deriva de su masa molar."}, "Sélénium": {"fr": "Oligo-élément dont le corps n'a besoin qu'en très petites quantités, mais qui intervient dans des enzymes aux propriétés antioxydantes et dans le bon fonctionnement de la thyroïde. La noix du Brésil en est la source la plus concentrée ; on le trouve aussi dans les fruits de mer, les œufs et les céréales. Sa fréquence Auralis (117,71 Hz) dérive de sa masse molaire.", "en": "A trace element the body needs only in very small amounts, but which is involved in enzymes with antioxidant properties and in the proper functioning of the thyroid. The Brazil nut is its most concentrated source; it is also found in seafood, eggs and cereals. Its Auralis frequency (117.71 Hz) derives from its molar mass.", "es": "Oligoelemento que el cuerpo solo necesita en cantidades muy pequeñas, pero que interviene en enzimas de propiedades antioxidantes y en el buen funcionamiento de la tiroides. La nuez de Brasil es su fuente más concentrada; también se encuentra en los mariscos, los huevos y los cereales. Su frecuencia Auralis (117,71 Hz) deriva de su masa molar."}, "Vanadium": {"fr": "Oligo-élément présent en traces infimes dans l'organisme et dans des aliments comme les champignons, les fruits de mer, le persil et l'aneth. On l'étudie pour son rôle possible dans le métabolisme du sucre. Comme métal, le vanadium est surtout utilisé pour fabriquer des aciers très résistants, notamment ceux des outils. Sa fréquence Auralis (75,93 Hz) est dérivée de sa masse molaire.", "en": "A trace element present in tiny traces in the body and in foods such as mushrooms, seafood, parsley and dill. It is studied for its possible role in sugar metabolism. As a metal, vanadium is used mainly to make very strong steels, notably those of tools. Its Auralis frequency (75.93 Hz) is derived from its molar mass.", "es": "Oligoelemento presente en trazas ínfimas en el organismo y en alimentos como las setas, los mariscos, el perejil y el eneldo. Se estudia por su posible papel en el metabolismo del azúcar. Como metal, el vanadio se usa sobre todo para fabricar aceros muy resistentes, en particular los de las herramientas. Su frecuencia Auralis (75,93 Hz) se deriva de su masa molar."}, "Xénon": {"fr": "Gaz noble lourd, rare et chimiquement très stable, présent à l'état de traces infimes dans l'atmosphère. Il produit une lumière blanche intense, d'où son usage dans les phares au xénon, les flashs et certaines lampes de projection. Il a aussi des applications médicales, notamment comme agent d'anesthésie. Sa fréquence Auralis (97,84 Hz) dérive de sa masse molaire.", "en": "A heavy noble gas, rare and chemically very stable, present in tiny traces in the atmosphere. It produces an intense white light, hence its use in xenon headlights, flashes and some projection lamps. It also has medical applications, notably as an anesthetic agent. Its Auralis frequency (97.84 Hz) derives from its molar mass.", "es": "Gas noble pesado, raro y químicamente muy estable, presente en trazas ínfimas en la atmósfera. Produce una luz blanca intensa, de ahí su uso en los faros de xenón, los flashes y algunas lámparas de proyección. También tiene aplicaciones médicas, en particular como agente anestésico. Su frecuencia Auralis (97,84 Hz) deriva de su masa molar."}, "Zinc": {"fr": "Oligo-élément impliqué dans des centaines d'enzymes, le zinc participe à l'immunité, à la cicatrisation et à la perception du goût et de l'odorat. Le corps n'en fait pas de réserve, d'où l'importance d'un apport régulier par l'alimentation : huîtres, viande, graines, noix et légumineuses. Comme métal, il protège l'acier de la rouille par galvanisation. Sa fréquence Auralis (97,45 Hz) est dérivée de sa masse molaire.", "en": "A trace element involved in hundreds of enzymes, zinc takes part in immunity, healing, and the perception of taste and smell. The body does not store it, hence the importance of a regular intake from food: oysters, meat, seeds, nuts and legumes. As a metal, it protects steel from rust through galvanization. Its Auralis frequency (97.45 Hz) is derived from its molar mass.", "es": "Oligoelemento implicado en cientos de enzimas, el zinc participa en la inmunidad, la cicatrización y la percepción del gusto y el olfato. El cuerpo no lo almacena, de ahí la importancia de un aporte regular con la alimentación: ostras, carne, semillas, frutos secos y legumbres. Como metal, protege el acero del óxido mediante galvanización. Su frecuencia Auralis (97,45 Hz) se deriva de su masa molar."}, "Rhénium": {"fr": "L'un des éléments les plus rares de la croûte terrestre, le rhénium possède l'un des points de fusion les plus élevés de tous les métaux. C'est pourquoi on l'emploie dans les aubes de turbines des réacteurs d'avion et certains catalyseurs de l'industrie pétrolière. Il n'a pas de rôle biologique connu. Sa fréquence Auralis (138,77 Hz) dérive de sa masse molaire.", "en": "One of the rarest elements in Earth's crust, rhenium has one of the highest melting points of all metals. This is why it is used in the turbine blades of jet engines and in some catalysts of the oil industry. It has no known biological role. Its Auralis frequency (138.77 Hz) derives from its molar mass.", "es": "Uno de los elementos más raros de la corteza terrestre, el renio posee uno de los puntos de fusión más altos de todos los metales. Por eso se emplea en los álabes de las turbinas de los reactores de avión y en algunos catalizadores de la industria petrolera. No tiene un papel biológico conocido. Su frecuencia Auralis (138,77 Hz) deriva de su masa molar."}, "Rubidium": {"fr": "Métal alcalin léger et si réactif qu'il s'enflamme à l'air, présent en petites quantités un peu partout dans les roches, l'eau de mer et certains aliments comme le café ou la banane. Le corps le traite un peu comme le potassium. On l'utilise surtout dans les horloges atomiques et la recherche. Sa fréquence Auralis (127,39 Hz) est dérivée de sa masse molaire.", "en": "A light alkali metal so reactive that it ignites in air, present in small amounts almost everywhere in rocks, seawater and some foods such as coffee or banana. The body treats it somewhat like potassium. It is used mainly in atomic clocks and research. Its Auralis frequency (127.39 Hz) is derived from its molar mass.", "es": "Metal alcalino ligero y tan reactivo que se inflama en el aire, presente en pequeñas cantidades casi en todas partes en las rocas, el agua de mar y algunos alimentos como el café o el plátano. El cuerpo lo trata un poco como al potasio. Se usa sobre todo en los relojes atómicos y la investigación. Su frecuencia Auralis (127,39 Hz) se deriva de su masa molar."}, "Sulfate (SO4)": {"fr": "Le sulfate est un ion très répandu, formé de soufre et d'oxygène, présent dans l'eau de mer, de nombreuses eaux minérales et le sel d'Epsom (sulfate de magnésium). Dans l'organisme, les sulfates participent à la détoxification et à la structure des cartilages. On les rencontre aussi dans l'alimentation et de nombreux minéraux. Sa fréquence Auralis (143,18 Hz) dérive de la masse molaire de l'ion.", "en": "Sulfate is a very widespread ion, made of sulfur and oxygen, present in seawater, many mineral waters and Epsom salt (magnesium sulfate). In the body, sulfates take part in detoxification and in the structure of cartilage. They are also found in food and in many minerals. Its Auralis frequency (143.18 Hz) derives from the molar mass of the ion.", "es": "El sulfato es un ion muy extendido, formado por azufre y oxígeno, presente en el agua de mar, numerosas aguas minerales y la sal de Epsom (sulfato de magnesio). En el organismo, los sulfatos participan en la desintoxicación y en la estructura de los cartílagos. También se encuentran en la alimentación y en numerosos minerales. Su frecuencia Auralis (143,18 Hz) deriva de la masa molar del ion."}, "Bicarbonate (HCO3)": {"fr": "Le bicarbonate est un ion central dans la régulation de l'acidité du sang et des liquides du corps : il agit comme un tampon qui neutralise les excès d'acide. On le retrouve dans le sang, la salive et le suc digestif, ainsi que dans les eaux minérales gazeuses. Sous forme de bicarbonate de soude, c'est un produit ménager et culinaire courant. Sa fréquence Auralis (181,89 Hz) est dérivée de la masse molaire de l'ion.", "en": "Bicarbonate is a central ion in regulating the acidity of the blood and body fluids: it acts as a buffer that neutralizes excess acid. It is found in blood, saliva and digestive juice, as well as in sparkling mineral waters. In the form of baking soda, it is a common household and cooking product. Its Auralis frequency (181.89 Hz) is derived from the molar mass of the ion.", "es": "El bicarbonato es un ion central en la regulación de la acidez de la sangre y los líquidos del cuerpo: actúa como un tampón que neutraliza el exceso de ácido. Se encuentra en la sangre, la saliva y el jugo digestivo, así como en las aguas minerales con gas. En forma de bicarbonato de sodio, es un producto doméstico y culinario común. Su frecuencia Auralis (181,89 Hz) se deriva de la masa molar del ion."}, "Bleu de méthylène": {"fr": "Composé de synthèse au bleu profond, le bleu de méthylène fut l'un des premiers colorants artificiels, avant de devenir un outil précieux en laboratoire pour colorer cellules et tissus au microscope. Il possède aussi une longue histoire d'usages médicaux, comme marqueur et comme antidote dans certaines intoxications, et fait aujourd'hui l'objet de recherches variées. Sa fréquence Auralis (119,18 Hz) dérive de sa masse molaire.", "en": "A synthetic compound of deep blue, methylene blue was one of the first artificial dyes, before becoming a valuable laboratory tool for staining cells and tissues under the microscope. It also has a long history of medical uses, as a marker and as an antidote in certain poisonings, and is today the subject of varied research. Its Auralis frequency (119.18 Hz) derives from its molar mass.", "es": "Compuesto de síntesis de azul profundo, el azul de metileno fue uno de los primeros colorantes artificiales, antes de convertirse en una valiosa herramienta de laboratorio para teñir células y tejidos al microscopio. También posee una larga historia de usos médicos, como marcador y como antídoto en ciertas intoxicaciones, y hoy es objeto de investigaciones variadas. Su frecuencia Auralis (119,18 Hz) deriva de su masa molar."}, "Acétylcholine": {"fr": "L'acétylcholine est l'un des premiers neurotransmetteurs découverts : elle transporte les messages entre les neurones, mais aussi entre les nerfs et les muscles, dont elle déclenche la contraction. Dans le cerveau, elle joue un rôle clé dans l'attention, l'apprentissage et la mémoire. Le corps la fabrique à partir de la choline, un nutriment présent dans les œufs et le soja. Sa fréquence Auralis (108,96 Hz) est dérivée de sa masse molaire.", "en": "Acetylcholine is one of the first neurotransmitters ever discovered: it carries messages between neurons, but also between nerves and muscles, whose contraction it triggers. In the brain, it plays a key role in attention, learning and memory. The body makes it from choline, a nutrient found in eggs and soy. Its Auralis frequency (108.96 Hz) is derived from its molar mass.", "es": "La acetilcolina es uno de los primeros neurotransmisores descubiertos: transporta los mensajes entre las neuronas, pero también entre los nervios y los músculos, cuya contracción desencadena. En el cerebro, desempeña un papel clave en la atención, el aprendizaje y la memoria. El cuerpo la fabrica a partir de la colina, un nutriente presente en los huevos y la soja. Su frecuencia Auralis (108,96 Hz) se deriva de su masa molar."}, "Adénosine": {"fr": "L'adénosine est une molécule fondamentale du vivant : elle forme la base de l'ATP (l'énergie cellulaire) et de l'ADN. Au fil de la journée, elle s'accumule dans le cerveau et favorise la sensation de fatigue, préparant le sommeil — c'est d'ailleurs son action que la caféine vient bloquer. Elle intervient aussi dans la circulation et le rythme cardiaque. Sa fréquence Auralis (199,16 Hz) dérive de sa masse molaire.", "en": "Adenosine is a fundamental molecule of life: it forms the basis of ATP (cellular energy) and of DNA. Over the course of the day, it builds up in the brain and promotes the feeling of tiredness, preparing for sleep — indeed it is its action that caffeine blocks. It is also involved in circulation and heart rhythm. Its Auralis frequency (199.16 Hz) derives from its molar mass.", "es": "La adenosina es una molécula fundamental de la vida: forma la base del ATP (la energía celular) y del ADN. A lo largo del día se acumula en el cerebro y favorece la sensación de cansancio, preparando el sueño — de hecho es su acción la que bloquea la cafeína. También interviene en la circulación y el ritmo cardíaco. Su frecuencia Auralis (199,16 Hz) deriva de su masa molar."}, "Alpha-GPC": {"fr": "L'alpha-GPC est une forme naturelle de choline que l'on trouve dans le corps et dans des aliments comme le lait et les abats. La choline qu'il libère sert notamment à fabriquer l'acétylcholine, un neurotransmetteur de la mémoire, et entre dans la structure des membranes cellulaires. C'est pourquoi il est étudié et proposé comme complément lié aux fonctions cognitives. Sa fréquence Auralis (191,69 Hz) est dérivée de sa masse molaire.", "en": "Alpha-GPC is a natural form of choline found in the body and in foods such as milk and organ meats. The choline it releases is used notably to make acetylcholine, a memory neurotransmitter, and forms part of the structure of cell membranes. This is why it is studied and offered as a supplement linked to cognitive function. Its Auralis frequency (191.69 Hz) is derived from its molar mass.", "es": "La alfa-GPC es una forma natural de colina que se encuentra en el cuerpo y en alimentos como la leche y las vísceras. La colina que libera se usa en particular para fabricar acetilcolina, un neurotransmisor de la memoria, y forma parte de la estructura de las membranas celulares. Por eso se estudia y se ofrece como complemento ligado a las funciones cognitivas. Su frecuencia Auralis (191,69 Hz) se deriva de su masa molar."}, "ATP": {"fr": "L'ATP (adénosine triphosphate) est la véritable « pile » des cellules : c'est la molécule qui stocke et libère l'énergie nécessaire à presque toutes les fonctions du corps, du battement du cœur à la pensée. Chaque cellule en recycle sans cesse d'énormes quantités. Produite surtout dans les mitochondries à partir des aliments et de l'oxygène, elle est au cœur du métabolisme. Sa fréquence Auralis (188,98 Hz) dérive de sa masse molaire.", "en": "ATP (adenosine triphosphate) is the true 'battery' of cells: it is the molecule that stores and releases the energy needed for almost every function of the body, from the beating of the heart to thought. Each cell constantly recycles enormous amounts of it. Produced mainly in the mitochondria from food and oxygen, it is at the heart of metabolism. Its Auralis frequency (188.98 Hz) derives from its molar mass.", "es": "El ATP (trifosfato de adenosina) es la verdadera «pila» de las células: es la molécula que almacena y libera la energía necesaria para casi todas las funciones del cuerpo, desde el latido del corazón hasta el pensamiento. Cada célula recicla constantemente enormes cantidades. Producido sobre todo en las mitocondrias a partir de los alimentos y el oxígeno, está en el corazón del metabolismo. Su frecuencia Auralis (188,98 Hz) deriva de su masa molar."}, "Citicoline": {"fr": "La citicoline (ou CDP-choline) est une molécule que le corps fabrique naturellement et qui participe à la construction des membranes des cellules, en particulier dans le cerveau. Elle est une source de choline et intervient dans la synthèse de neurotransmetteurs. On l'étudie pour son rôle dans les fonctions cognitives et elle est utilisée comme complément. Sa fréquence Auralis (181,96 Hz) est dérivée de sa masse molaire.", "en": "Citicoline (or CDP-choline) is a molecule the body makes naturally and which takes part in building cell membranes, particularly in the brain. It is a source of choline and is involved in the synthesis of neurotransmitters. It is studied for its role in cognitive function and is used as a supplement. Its Auralis frequency (181.96 Hz) is derived from its molar mass.", "es": "La citicolina (o CDP-colina) es una molécula que el cuerpo fabrica de forma natural y que participa en la construcción de las membranas de las células, en particular en el cerebro. Es una fuente de colina e interviene en la síntesis de neurotransmisores. Se estudia por su papel en las funciones cognitivas y se usa como complemento. Su frecuencia Auralis (181,96 Hz) se deriva de su masa molar."}, "Coenzyme Q10": {"fr": "Le coenzyme Q10, ou ubiquinone, est une molécule présente dans toutes les cellules, où elle joue un rôle central dans la production d'énergie au sein des mitochondries. C'est aussi un antioxydant qui protège les cellules. Le corps en fabrique, et on en trouve dans le poisson gras, la viande et les abats ; sa présence tend à diminuer avec l'âge, d'où son usage courant en complément. Sa fréquence Auralis (160,85 Hz) dérive de sa masse molaire.", "en": "Coenzyme Q10, or ubiquinone, is a molecule present in all cells, where it plays a central role in energy production within the mitochondria. It is also an antioxidant that protects cells. The body makes some, and it is found in oily fish, meat and organ meats; its presence tends to decrease with age, hence its common use as a supplement. Its Auralis frequency (160.85 Hz) derives from its molar mass.", "es": "La coenzima Q10, o ubiquinona, es una molécula presente en todas las células, donde desempeña un papel central en la producción de energía dentro de las mitocondrias. También es un antioxidante que protege las células. El cuerpo fabrica algo, y se encuentra en el pescado azul, la carne y las vísceras; su presencia tiende a disminuir con la edad, de ahí su uso común como complemento. Su frecuencia Auralis (160,85 Hz) deriva de su masa molar."}, "Créatine": {"fr": "La créatine est une molécule que le corps produit et stocke surtout dans les muscles, où elle permet de régénérer très vite l'énergie lors des efforts brefs et intenses. On l'apporte aussi par la viande et le poisson. C'est l'un des compléments les plus étudiés dans le sport, traditionnellement associé à la force et à la récupération musculaire. Sa fréquence Auralis (195,45 Hz) est dérivée de sa masse molaire.", "en": "Creatine is a molecule the body produces and stores mainly in the muscles, where it allows energy to be regenerated very quickly during short, intense efforts. It is also supplied by meat and fish. It is one of the most studied supplements in sport, traditionally associated with strength and muscle recovery. Its Auralis frequency (195.45 Hz) is derived from its molar mass.", "es": "La creatina es una molécula que el cuerpo produce y almacena sobre todo en los músculos, donde permite regenerar muy rápido la energía en los esfuerzos breves e intensos. También se aporta con la carne y el pescado. Es uno de los complementos más estudiados en el deporte, asociado tradicionalmente con la fuerza y la recuperación muscular. Su frecuencia Auralis (195,45 Hz) se deriva de su masa molar."}, "Dopamine": {"fr": "La dopamine est un neurotransmetteur central du cerveau, impliqué dans la motivation, le plaisir, l'apprentissage par la récompense et le contrôle des mouvements. Souvent évoquée comme « molécule de la récompense », elle nous pousse à agir et à rechercher ce qui nous fait du bien. Le corps la fabrique à partir d'un acide aminé, la tyrosine, présent dans l'alimentation. Sa fréquence Auralis (114,16 Hz) dérive de sa masse molaire.", "en": "Dopamine is a central neurotransmitter of the brain, involved in motivation, pleasure, reward-based learning and the control of movement. Often referred to as the 'reward molecule', it drives us to act and to seek out what makes us feel good. The body makes it from an amino acid, tyrosine, found in food. Its Auralis frequency (114.16 Hz) derives from its molar mass.", "es": "La dopamina es un neurotransmisor central del cerebro, implicado en la motivación, el placer, el aprendizaje por recompensa y el control de los movimientos. A menudo evocada como «molécula de la recompensa», nos impulsa a actuar y a buscar lo que nos hace sentir bien. El cuerpo la fabrica a partir de un aminoácido, la tirosina, presente en la alimentación. Su frecuencia Auralis (114,16 Hz) deriva de su masa molar."}, "GABA": {"fr": "Le GABA (acide gamma-aminobutyrique) est le grand neurotransmetteur inhibiteur du cerveau : il tempère l'activité des neurones et agit comme un frein naturel face à l'excitation. C'est pourquoi il est traditionnellement associé au calme, à la détente et à l'endormissement. Le corps le fabrique à partir du glutamate ; on le retrouve aussi dans certains aliments fermentés. Sa fréquence Auralis (153,70 Hz) est dérivée de sa masse molaire.", "en": "GABA (gamma-aminobutyric acid) is the great inhibitory neurotransmitter of the brain: it tempers the activity of neurons and acts as a natural brake against overstimulation. This is why it is traditionally associated with calm, relaxation and falling asleep. The body makes it from glutamate; it is also found in some fermented foods. Its Auralis frequency (153.70 Hz) is derived from its molar mass.", "es": "El GABA (ácido gamma-aminobutírico) es el gran neurotransmisor inhibidor del cerebro: modera la actividad de las neuronas y actúa como un freno natural frente a la sobreexcitación. Por eso se asocia tradicionalmente con la calma, la relajación y la conciliación del sueño. El cuerpo lo fabrica a partir del glutamato; también se encuentra en algunos alimentos fermentados. Su frecuencia Auralis (153,70 Hz) se deriva de su masa molar."}, "Glutathion": {"fr": "Le glutathion est un antioxydant que le corps fabrique lui-même et que l'on trouve dans chacune de nos cellules. On le surnomme « antioxydant maître » car il aide à neutraliser les molécules instables et participe à la détoxification, notamment au niveau du foie. Ses niveaux tendent à baisser avec l'âge et le stress. Sa fréquence Auralis (114,51 Hz) dérive de sa masse molaire.", "en": "Glutathione is an antioxidant the body makes itself and which is found in each of our cells. It is nicknamed the 'master antioxidant' because it helps neutralize unstable molecules and takes part in detoxification, notably in the liver. Its levels tend to fall with age and stress. Its Auralis frequency (114.51 Hz) derives from its molar mass.", "es": "El glutatión es un antioxidante que el cuerpo fabrica por sí mismo y que se encuentra en cada una de nuestras células. Se lo apoda «antioxidante maestro» porque ayuda a neutralizar las moléculas inestables y participa en la desintoxicación, en particular en el hígado. Sus niveles tienden a bajar con la edad y el estrés. Su frecuencia Auralis (114,51 Hz) deriva de su masa molar."}, "Glycine": {"fr": "La glycine est le plus petit et le plus simple des acides aminés qui composent nos protéines ; elle est particulièrement abondante dans le collagène, la protéine de soutien de la peau et des articulations. Elle joue aussi un rôle de neurotransmetteur apaisant et est traditionnellement associée à la qualité du sommeil. On la trouve dans les bouillons d'os, la viande et la gélatine. Sa fréquence Auralis (111,89 Hz) est dérivée de sa masse molaire.", "en": "Glycine is the smallest and simplest of the amino acids that make up our proteins; it is particularly abundant in collagen, the support protein of skin and joints. It also plays the role of a soothing neurotransmitter and is traditionally associated with sleep quality. It is found in bone broths, meat and gelatin. Its Auralis frequency (111.89 Hz) is derived from its molar mass.", "es": "La glicina es el más pequeño y simple de los aminoácidos que componen nuestras proteínas; es particularmente abundante en el colágeno, la proteína de sostén de la piel y las articulaciones. También cumple el papel de neurotransmisor calmante y se asocia tradicionalmente con la calidad del sueño. Se encuentra en los caldos de huesos, la carne y la gelatina. Su frecuencia Auralis (111,89 Hz) se deriva de su masa molar."}, "Histamine": {"fr": "L'histamine est une molécule que le corps libère dans le cadre des réactions immunitaires et allergiques — c'est elle qui provoque démangeaisons et éternuements, et que ciblent les « antihistaminiques ». Mais elle est aussi un messager utile : elle participe à l'éveil dans le cerveau et à la sécrétion des sucs digestifs. On la retrouve également dans certains aliments fermentés. Sa fréquence Auralis (165,67 Hz) dérive de sa masse molaire.", "en": "Histamine is a molecule the body releases as part of immune and allergic reactions — it is what causes itching and sneezing, and what 'antihistamines' target. But it is also a useful messenger: it takes part in wakefulness in the brain and in the secretion of digestive juices. It is also found in some fermented foods. Its Auralis frequency (165.67 Hz) derives from its molar mass.", "es": "La histamina es una molécula que el cuerpo libera en el marco de las reacciones inmunitarias y alérgicas — es la que provoca picores y estornudos, y a la que apuntan los «antihistamínicos». Pero también es un mensajero útil: participa en la vigilia en el cerebro y en la secreción de los jugos digestivos. También se encuentra en algunos alimentos fermentados. Su frecuencia Auralis (165,67 Hz) deriva de su masa molar."}, "L-Carnitine": {"fr": "La L-carnitine est une molécule qui joue un rôle de « navette » : elle transporte les acides gras à l'intérieur des mitochondries, où ils sont brûlés pour produire de l'énergie. Le corps en fabrique à partir d'acides aminés, et on la trouve surtout dans la viande rouge. Elle est traditionnellement associée à l'énergie et à la performance, et utilisée comme complément sportif. Sa fréquence Auralis (120,13 Hz) est dérivée de sa masse molaire.", "en": "L-carnitine is a molecule that acts as a 'shuttle': it carries fatty acids inside the mitochondria, where they are burned to produce energy. The body makes some from amino acids, and it is found mainly in red meat. It is traditionally associated with energy and performance, and used as a sports supplement. Its Auralis frequency (120.13 Hz) is derived from its molar mass.", "es": "La L-carnitina es una molécula que actúa como «lanzadera»: transporta los ácidos grasos al interior de las mitocondrias, donde se queman para producir energía. El cuerpo fabrica algo a partir de aminoácidos, y se encuentra sobre todo en la carne roja. Se asocia tradicionalmente con la energía y el rendimiento, y se usa como complemento deportivo. Su frecuencia Auralis (120,13 Hz) se deriva de su masa molar."}, "Mélatonine": {"fr": "Hormone produite naturellement par le corps, surtout la nuit par la glande pinéale. Elle est au cœur du rythme circadien — l'horloge interne qui règle l'alternance de l'éveil et du repos sur 24 heures. Sa sécrétion est directement influencée par la lumière : elle monte dans l'obscurité et chute au jour, d'où son rôle de « signal de la nuit » pour l'organisme. Elle est traditionnellement associée au sommeil et compte parmi les compléments les plus connus pour accompagner l'endormissement ou atténuer le décalage horaire. Sa fréquence Auralis (173,10 Hz) est dérivée de sa masse molaire par la même méthode.", "en": "A hormone produced naturally by the body, mainly at night by the pineal gland. It is at the heart of the circadian rhythm — the internal clock that regulates the alternation of wakefulness and rest over 24 hours. Its secretion is directly influenced by light: it rises in darkness and falls in daylight, hence its role as the body's 'night signal'. It is traditionally associated with sleep and is among the best-known supplements for easing falling asleep or reducing jet lag. Its Auralis frequency (173.10 Hz) is derived from its molar mass by the same method.", "es": "Hormona producida de forma natural por el cuerpo, sobre todo de noche por la glándula pineal. Está en el corazón del ritmo circadiano — el reloj interno que regula la alternancia de la vigilia y el descanso a lo largo de 24 horas. Su secreción está directamente influida por la luz: sube en la oscuridad y baja con la luz del día, de ahí su papel de «señal de la noche» para el organismo. Se asocia tradicionalmente con el sueño y está entre los complementos más conocidos para acompañar la conciliación del sueño o atenuar el desfase horario. Su frecuencia Auralis (173,10 Hz) se deriva de su masa molar por el mismo método."}, "NAD+": {"fr": "Le NAD+ (nicotinamide adénine dinucléotide) est une molécule indispensable présente dans chaque cellule, où elle sert de « transporteur » dans les réactions qui produisent l'énergie. Elle intervient aussi dans la réparation de l'ADN et la régulation du vieillissement cellulaire, ce qui en fait un sujet de recherche très actif. Ses niveaux dim
