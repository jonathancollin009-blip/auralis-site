 de las semillas del ricino (Ricinus communis). Espeso y rico en ácido ricinoleico, se usa tradicionalmente en cuidado externo para la piel, el cabello, las pestañas y las uñas, así como en las famosas «cataplasmas» de la tradición. Su frecuencia Auralis (111,21 Hz) se deriva de su masa molar."}, "1,8-Cinéole": {"fr": "Le 1,8-cinéole, aussi appelé eucalyptol, est la molécule à l'origine de la note fraîche et pénétrante de l'eucalyptus, du romarin et de la sauge. C'est l'un des composés les plus caractéristiques des huiles essentielles « respiratoires ». En aromathérapie traditionnelle, l'eucalyptus est associé à la sensation de dégagement et à l'air frais de l'hiver. Sa fréquence Auralis (114,95 Hz) est dérivée de sa masse molaire.", "en": "1,8-cineole, also called eucalyptol, is the molecule behind the fresh, penetrating note of eucalyptus, rosemary and sage. It is one of the most characteristic compounds of 'respiratory' essential oils. In traditional aromatherapy, eucalyptus is associated with a sense of clearing and the fresh air of winter. Its Auralis frequency (114.95 Hz) is derived from its molar mass.", "es": "El 1,8-cineol, también llamado eucaliptol, es la molécula que origina la nota fresca y penetrante del eucalipto, el romero y la salvia. Es uno de los compuestos más característicos de los aceites esenciales «respiratorios». En la aromaterapia tradicional, el eucalipto se asocia con la sensación de despeje y el aire fresco del invierno. Su frecuencia Auralis (114,95 Hz) se deriva de su masa molar."}, "Acétate de linalyle": {"fr": "L'acétate de linalyle est, avec le linalol, l'une des deux molécules majeures de la lavande vraie et de la bergamote ; c'est lui qui apporte la note florale, douce et fruitée de ces huiles. En aromathérapie traditionnelle, il participe à la réputation apaisante de la lavande, très utilisée pour la détente et le coucher. Sa fréquence Auralis (146,28 Hz) dérive de sa masse molaire.", "en": "Linalyl acetate is, together with linalool, one of the two major molecules of true lavender and bergamot; it is what gives these oils their floral, soft and fruity note. In traditional aromatherapy, it contributes to the soothing reputation of lavender, widely used for relaxation and bedtime. Its Auralis frequency (146.28 Hz) derives from its molar mass.", "es": "El acetato de linalilo es, junto al linalol, una de las dos moléculas mayores de la lavanda verdadera y la bergamota; es lo que da a estos aceites su nota floral, suave y afrutada. En la aromaterapia tradicional, contribuye a la reputación calmante de la lavanda, muy usada para la relajación y la hora de dormir. Su frecuencia Auralis (146,28 Hz) deriva de su masa molar."}, "Alpha-Pinène": {"fr": "L'alpha-pinène est la molécule qui donne son parfum de forêt de conifères aux aiguilles de pin et de sapin ; on la retrouve aussi dans le romarin, le basilic et l'encens. C'est l'un des composés à l'origine de la sensation de « bain de forêt ». En aromathérapie traditionnelle, les senteurs de pin sont associées à l'air pur et à la vivacité. Sa fréquence Auralis (101,52 Hz) est dérivée de sa masse molaire.", "en": "Alpha-pinene is the molecule that gives its coniferous forest scent to pine and fir needles; it is also found in rosemary, basil and frankincense. It is one of the compounds behind the sensation of a 'forest bath'. In traditional aromatherapy, pine scents are associated with pure air and liveliness. Its Auralis frequency (101.52 Hz) is derived from its molar mass.", "es": "El alfa-pineno es la molécula que da su perfume de bosque de coníferas a las agujas de pino y abeto; también se encuentra en el romero, la albahaca y el incienso. Es uno de los compuestos que originan la sensación de «baño de bosque». En la aromaterapia tradicional, los aromas de pino se asocian con el aire puro y la vivacidad. Su frecuencia Auralis (101,52 Hz) se deriva de su masa molar."}, "Bisabolol": {"fr": "Le bisabolol est l'un des composés les plus doux de la camomille (et du bois de candeia). Très utilisé en cosmétique pour son extrême douceur, il est associé aux soins apaisants de la peau. En aromathérapie traditionnelle, la camomille évoque le réconfort et la sérénité. Sa fréquence Auralis (165,72 Hz) dérive de sa masse molaire.", "en": "Bisabolol is one of the gentlest compounds of chamomile (and of candeia wood). Widely used in cosmetics for its extreme softness, it is associated with soothing skin care. In traditional aromatherapy, chamomile evokes comfort and serenity. Its Auralis frequency (165.72 Hz) derives from its molar mass.", "es": "El bisabolol es uno de los compuestos más suaves de la manzanilla (y de la madera de candeia). Muy usado en cosmética por su extrema suavidad, se asocia con los cuidados calmantes de la piel. En la aromaterapia tradicional, la manzanilla evoca el consuelo y la serenidad. Su frecuencia Auralis (165,72 Hz) deriva de su masa molar."}, "Camphre": {"fr": "Le camphre est une molécule à l'arôme puissant, fraîche et pénétrante, extraite traditionnellement du bois de camphrier, un arbre d'Asie. On le connaît surtout dans les baumes chauffants et les préparations « décongestionnantes ». En usage traditionnel, il est associé à la sensation de chaleur et au confort musculaire. Sa fréquence Auralis (113,45 Hz) est dérivée de sa masse molaire.", "en": "Camphor is a molecule with a powerful, fresh and penetrating aroma, traditionally extracted from the wood of the camphor tree, an Asian tree. It is best known in warming balms and 'decongestant' preparations. In traditional use, it is associated with the sensation of warmth and muscle comfort. Its Auralis frequency (113.45 Hz) is derived from its molar mass.", "es": "El alcanfor es una molécula de aroma potente, fresco y penetrante, extraída tradicionalmente de la madera del alcanforero, un árbol de Asia. Se conoce sobre todo en los bálsamos calentadores y las preparaciones «descongestionantes». En uso tradicional, se asocia con la sensación de calor y el confort muscular. Su frecuencia Auralis (113,45 Hz) se deriva de su masa molar."}, "Carvacrol": {"fr": "Le carvacrol est le composé qui donne à l'origan et à la sarriette leur parfum chaud et épicé caractéristique. C'est l'un des composés aromatiques les plus étudiés pour ses propriétés antimicrobiennes naturelles. Ces herbes méditerranéennes sont traditionnellement associées à la robustesse et au soutien de l'organisme. Sa fréquence Auralis (111,95 Hz) dérive de sa masse molaire.", "en": "Carvacrol is the compound that gives oregano and savory their characteristic warm, spicy scent. It is one of the most studied aromatic compounds for its natural antimicrobial properties. These Mediterranean herbs are traditionally associated with robustness and support of the body. Its Auralis frequency (111.95 Hz) derives from its molar mass.", "es": "El carvacrol es el compuesto que da al orégano y la ajedrea su aroma cálido y especiado característico. Es uno de los compuestos aromáticos más estudiados por sus propiedades antimicrobianas naturales. Estas hierbas mediterráneas se asocian tradicionalmente con la robustez y el apoyo del organismo. Su frecuencia Auralis (111,95 Hz) deriva de su masa molar."}, "Cinnamaldéhyde": {"fr": "Le cinnamaldéhyde est la molécule responsable de l'arôme chaud, sucré et boisé de la cannelle. Épice précieuse échangée depuis l'Antiquité, la cannelle est traditionnellement associée à la chaleur, au réconfort et à la convivialité des saisons froides. Le composé est aussi étudié pour ses propriétés antimicrobiennes. Sa fréquence Auralis (196,98 Hz) est dérivée de sa masse molaire.", "en": "Cinnamaldehyde is the molecule responsible for the warm, sweet and woody aroma of cinnamon. A precious spice traded since antiquity, cinnamon is traditionally associated with warmth, comfort and the conviviality of cold seasons. The compound is also studied for its antimicrobial properties. Its Auralis frequency (196.98 Hz) is derived from its molar mass.", "es": "El cinamaldehído es la molécula responsable del aroma cálido, dulce y amaderado de la canela. Especia preciosa comerciada desde la Antigüedad, la canela se asocia tradicionalmente con el calor, el consuelo y la convivencia de las estaciones frías. El compuesto también se estudia por sus propiedades antimicrobianas. Su frecuencia Auralis (196,98 Hz) se deriva de su masa molar."}, "Citronellal": {"fr": "Le citronellal est la molécule à l'origine de la note citronnée de la mélisse, de la citronnelle et de l'eucalyptus citronné. On l'associe classiquement aux senteurs fraîches d'été et à l'éloignement des insectes. La mélisse, plante de jardin des traditions européennes, est réputée apaisante. Sa fréquence Auralis (114,95 Hz) dérive de sa masse molaire.", "en": "Citronellal is the molecule behind the lemony note of lemon balm, citronella and lemon eucalyptus. It is classically associated with fresh summer scents and with keeping insects away. Lemon balm, a garden herb of European traditions, is reputed to be soothing. Its Auralis frequency (114.95 Hz) derives from its molar mass.", "es": "El citronelal es la molécula que origina la nota cítrica de la melisa, la citronela y el eucalipto limón. Se asocia clásicamente con los aromas frescos de verano y con el alejamiento de los insectos. La melisa, hierba de jardín de las tradiciones europeas, es reputada calmante. Su frecuencia Auralis (114,95 Hz) deriva de su masa molar."}, "Eugénol": {"fr": "L'eugénol est la molécule qui donne au clou de girofle son parfum chaud et épicé si reconnaissable ; on la retrouve aussi dans la cannelle et le basilic. Traditionnellement, le clou de girofle est associé au confort dentaire et à la chaleur des épices. C'est une épice ancienne, longtemps aussi précieuse que l'or. Sa fréquence Auralis (122,37 Hz) est dérivée de sa masse molaire.", "en": "Eugenol is the molecule that gives clove its recognizable warm, spicy scent; it is also found in cinnamon and basil. Traditionally, clove is associated with dental comfort and the warmth of spices. It is an ancient spice, long as precious as gold. Its Auralis frequency (122.37 Hz) is derived from its molar mass.", "es": "El eugenol es la molécula que da al clavo de olor su aroma cálido y especiado tan reconocible; también se encuentra en la canela y la albahaca. Tradicionalmente, el clavo se asocia con el confort dental y el calor de las especias. Es una especia antigua, durante mucho tiempo tan preciosa como el oro. Su frecuencia Auralis (122,37 Hz) se deriva de su masa molar."}, "Géraniol": {"fr": "Le géraniol est la molécule au doux parfum de rose et de géranium, présente dans l'huile essentielle de rose, de géranium, de palmarosa et de citronnelle. C'est l'un des grands piliers de la parfumerie florale. Les senteurs de rose sont traditionnellement associées à la douceur, à l'harmonie et au cœur. Sa fréquence Auralis (114,95 Hz) dérive de sa masse molaire.", "en": "Geraniol is the molecule with the sweet scent of rose and geranium, present in the essential oils of rose, geranium, palmarosa and citronella. It is one of the great pillars of floral perfumery. Rose scents are traditionally associated with softness, harmony and the heart. Its Auralis frequency (114.95 Hz) derives from its molar mass.", "es": "El geraniol es la molécula de dulce perfume de rosa y geranio, presente en los aceites esenciales de rosa, geranio, palmarosa y citronela. Es uno de los grandes pilares de la perfumería floral. Los aromas de rosa se asocian tradicionalmente con la suavidad, la armonía y el corazón. Su frecuencia Auralis (114,95 Hz) deriva de su masa molar."}, "Limonène": {"fr": "Le limonène est la molécule qui donne aux agrumes — citron, orange, pamplemousse — leur odeur vive et ensoleillée ; on la trouve concentrée dans leur zeste. C'est l'une des senteurs les plus universellement perçues comme fraîches et joyeuses. En aromathérapie traditionnelle, les agrumes sont associés à la bonne humeur et à la vitalité. Sa fréquence Auralis (101,52 Hz) est dérivée de sa masse molaire.", "en": "Limonene is the molecule that gives citrus fruits — lemon, orange, grapefruit — their bright, sunny scent; it is found concentrated in their peel. It is one of the scents most universally perceived as fresh and joyful. In traditional aromatherapy, citrus fruits are associated with good mood and vitality. Its Auralis frequency (101.52 Hz) is derived from its molar mass.", "es": "El limoneno es la molécula que da a los cítricos — limón, naranja, pomelo — su olor vivo y soleado; se encuentra concentrada en su cáscara. Es uno de los aromas más universalmente percibidos como frescos y alegres. En la aromaterapia tradicional, los cítricos se asocian con el buen humor y la vitalidad. Su frecuencia Auralis (101,52 Hz) se deriva de su masa molar."}, "Linalol": {"fr": "Principale molécule aromatique de la lavande vraie (Lavandula angustifolia), responsable de son parfum floral et frais. On la retrouve aussi dans le bois de rose, la bergamote et la coriandre. La lavande est cultivée depuis l'Antiquité en Méditerranée, où elle parfumait déjà le linge et les bains — son nom vient du latin lavare, « laver ». En aromathérapie traditionnelle, elle est réputée pour ses ambiances apaisantes et son usage au coucher, et reste l'une des huiles essentielles les plus populaires au monde. Sa fréquence Auralis (114,95 Hz) est dérivée de sa masse molaire.", "en": "The main aromatic molecule of true lavender (Lavandula angustifolia), responsible for its floral, fresh scent. It is also found in rosewood, bergamot and coriander. Lavender has been cultivated since antiquity in the Mediterranean, where it already scented linen and baths — its name comes from the Latin lavare, 'to wash'. In traditional aromatherapy, it is reputed for its soothing atmospheres and its use at bedtime, and remains one of the most popular essential oils in the world. Its Auralis frequency (114.95 Hz) is derived from its molar mass.", "es": "La principal molécula aromática de la lavanda verdadera (Lavandula angustifolia), responsable de su perfume floral y fresco. También se encuentra en el palo de rosa, la bergamota y el cilantro. La lavanda se cultiva desde la Antigüedad en el Mediterráneo, donde ya perfumaba la ropa y los baños — su nombre viene del latín lavare, «lavar». En la aromaterapia tradicional, es reputada por sus ambientes calmantes y su uso a la hora de dormir, y sigue siendo uno de los aceites esenciales más populares del mundo. Su frecuencia Auralis (114,95 Hz) se deriva de su masa molar."}, "Menthol": {"fr": "Le menthol est la molécule emblématique de la menthe poivrée : c'est elle qui procure cette fameuse sensation de fraîcheur en activant les récepteurs du froid de la peau et de la bouche. On l'utilise partout, des bonbons aux baumes. La menthe est traditionnellement associée à la fraîcheur, au confort digestif et à la clarté. Sa fréquence Auralis (116,46 Hz) est dérivée de sa masse molaire.", "en": "Menthol is the emblematic molecule of peppermint: it is what produces that famous cooling sensation by activating the cold receptors of the skin and mouth. It is used everywhere, from candies to balms. Mint is traditionally associated with freshness, digestive comfort and clarity. Its Auralis frequency (116.46 Hz) is derived from its molar mass.", "es": "El mentol es la molécula emblemática de la menta piperita: es lo que produce esa famosa sensación de frescor al activar los receptores del frío de la piel y la boca. Se usa por todas partes, desde los caramelos hasta los bálsamos. La menta se asocia tradicionalmente con el frescor, el confort digestivo y la claridad. Su frecuencia Auralis (116,46 Hz) se deriva de su masa molar."}, "Thymol": {"fr": "Le thymol est le composé au parfum chaud et puissant du thym (et de l'origan). Reconnu de longue date pour ses propriétés antiseptiques, il a même donné son nom à des produits d'hygiène. Le thym est une herbe méditerranéenne traditionnellement associée à la robustesse, au soutien respiratoire et à la protection. Sa fréquence Auralis (111,95 Hz) dérive de sa masse molaire.", "en": "Thymol is the compound with the warm, powerful scent of thyme (and oregano). Long recognized for its antiseptic properties, it even gave its name to hygiene products. Thyme is a Mediterranean herb traditionally associated with robustness, respiratory support and protection. Its Auralis frequency (111.95 Hz) derives from its molar mass.", "es": "El timol es el compuesto de aroma cálido y potente del tomillo (y el orégano). Reconocido desde antiguo por sus propiedades antisépticas, incluso dio su nombre a productos de higiene. El tomillo es una hierba mediterránea tradicionalmente asociada con la robustez, el apoyo respiratorio y la protección. Su frecuencia Auralis (111,95 Hz) deriva de su masa molar."}, "Tea tree (arbre à thé)": {"fr": "L'huile essentielle d'arbre à thé (Melaleuca alternifolia) est extraite d'un arbuste australien, traditionnellement utilisée par les peuples aborigènes. C'est l'une des huiles essentielles les plus populaires, réputée pour ses propriétés purifiantes et assainissantes, souvent employée pour la peau. Sa fréquence Auralis (114,95 Hz) est dérivée de sa masse molaire.", "en": "Tea tree essential oil (Melaleuca alternifolia) is extracted from an Australian shrub, traditionally used by Aboriginal peoples. It is one of the most popular essential oils, reputed for its purifying and cleansing properties, often used for the skin. Its Auralis frequency (114.95 Hz) is derived from its molar mass.", "es": "El aceite esencial de árbol del té (Melaleuca alternifolia) se extrae de un arbusto australiano, tradicionalmente usado por los pueblos aborígenes. Es uno de los aceites esenciales más populares, reputado por sus propiedades purificantes y saneantes, a menudo empleado para la piel. Su frecuencia Auralis (114,95 Hz) se deriva de su masa molar."}, "DHEA": {"fr": "La DHEA (déhydroépiandrostérone) est une hormone produite par les glandes surrénales. C'est une molécule « mère » : le corps s'en sert comme précurseur pour fabriquer d'autres hormones, dont la testostérone et les estrogènes. Son taux culmine chez le jeune adulte puis décline avec l'âge, ce qui en fait un sujet d'intérêt sur le vieillissement. Sa fréquence Auralis (107,47 Hz) dérive de sa masse molaire.", "en": "DHEA (dehydroepiandrosterone) is a hormone produced by the adrenal glands. It is a 'mother' molecule: the body uses it as a precursor to make other hormones, including testosterone and estrogens. Its level peaks in young adulthood and then declines with age, which makes it a topic of interest in aging. Its Auralis frequency (107.47 Hz) derives from its molar mass.", "es": "La DHEA (dehidroepiandrosterona) es una hormona producida por las glándulas suprarrenales. Es una molécula «madre»: el cuerpo la usa como precursora para fabricar otras hormonas, incluidas la testosterona y los estrógenos. Su nivel alcanza el máximo en la juventud y luego declina con la edad, lo que la convierte en un tema de interés sobre el envejecimiento. Su frecuencia Auralis (107,47 Hz) deriva de su masa molar."}, "Glutamate": {"fr": "Le glutamate est le grand neurotransmetteur excitateur du cerveau — le « feu vert » face au « frein » qu'est le GABA, qu'il sert d'ailleurs à fabriquer. Il joue un rôle central dans l'apprentissage et la mémoire. C'est aussi un acide aminé naturellement présent dans de nombreux aliments, à l'origine du fameux goût « umami ». Sa fréquence Auralis (109,65 Hz) dérive de sa masse molaire.", "en": "Glutamate is the great excitatory neurotransmitter of the brain — the 'go' signal opposite the 'brake' of GABA, which it is used to make. It plays a central role in learning and memory. It is also an amino acid naturally present in many foods, behind the famous 'umami' taste. Its Auralis frequency (109.65 Hz) derives from its molar mass.", "es": "El glutamato es el gran neurotransmisor excitador del cerebro — la señal de «adelante» frente al «freno» del GABA, que además sirve para fabricarlo. Desempeña un papel central en el aprendizaje y la memoria. También es un aminoácido naturalmente presente en muchos alimentos, detrás del famoso sabor «umami». Su frecuencia Auralis (109,65 Hz) deriva de su masa molar."}, "Noradrénaline": {"fr": "La noradrénaline (ou norépinéphrine) est à la fois un neurotransmetteur et une hormone, cousine proche de l'adrénaline. Elle est au cœur de l'éveil, de la vigilance et de l'attention, et le corps la libère en réponse au stress — la réaction « combat ou fuite ». Elle accélère le rythme cardiaque et aiguise la concentration. Le corps la fabrique à partir de la dopamine. Sa fréquence Auralis (126,08 Hz) dérive de sa masse molaire.", "en": "Noradrenaline (or norepinephrine) is both a neurotransmitter and a hormone, a close cousin of adrenaline. It is at the heart of wakefulness, alertness and attention, and the body releases it in response to stress — the 'fight or flight' reaction. It speeds up the heart rate and sharpens concentration. The body makes it from dopamine. Its Auralis frequency (126.08 Hz) derives from its molar mass.", "es": "La noradrenalina (o norepinefrina) es a la vez un neurotransmisor y una hormona, prima cercana de la adrenalina. Está en el corazón de la vigilia, la atención y la concentración, y el cuerpo la libera en respuesta al estrés — la reacción de «lucha o huida». Acelera el ritmo cardíaco y agudiza la concentración. El cuerpo la fabrica a partir de la dopamina. Su frecuencia Auralis (126,08 Hz) deriva de su masa molar."}, "Endorphine": {"fr": "L'endorphine — plus précisément la β-endorphine — est un peptide produit par le cerveau, considéré comme un « opioïde naturel ». On l'associe au plaisir, au soulagement de la douleur et à la sensation d'euphorie, notamment après l'effort physique (le fameux « runner's high »). Elle est aussi stimulée par le rire, la musique ou le chocolat. Sa fréquence Auralis (161,39 Hz) dérive de sa masse molaire — approchée ici, car c'est un gros peptide.", "en": "Endorphin — more precisely β-endorphin — is a peptide produced by the brain, considered a 'natural opioid'. It is associated with pleasure, pain relief and the feeling of euphoria, notably after physical exercise (the famous 'runner's high'). It is also boosted by laughter, music or chocolate. Its Auralis frequency (161.39 Hz) derives from its molar mass — approximate here, as it is a large peptide.", "es": "La endorfina — más precisamente la β-endorfina — es un péptido producido por el cerebro, considerado un «opioide natural». Se asocia con el placer, el alivio del dolor y la sensación de euforia, sobre todo tras el ejercicio físico (el famoso «runner's high»). También la estimulan la risa, la música o el chocolate. Su frecuencia Auralis (161,39 Hz) deriva de su masa molar — aproximada aquí, por ser un péptido grande."}};

 home_method_body:{fr:"<h3>Éléments &amp; molécules</h3><p>Chaque fréquence est dérivée d'une molécule ou d'un élément par une formule simple et constante. On part de sa <b>masse molaire</b> (sa masse en g/mol), qu'on multiplie par un facteur fixe, puis on ramène le résultat par octaves (en divisant ou multipliant par 2) dans une plage douce et audible, autour de 70 à 200 Hz.</p><div class='formula'><span class='fline'>masse molaire × 2,98095 → octave (× ou ÷ 2) → fréquence</span><span class='fex'>Exemple : Magnésium 24,305 g/mol × 2,98095 = 72,45 Hz</span></div><p>Cette approche — traduire la masse molaire d'une molécule en fréquence sonore — s'inscrit dans la lignée des travaux du physicien français <b>Joël Sternheimer</b>, utilisés en France depuis plus de 30 ans. Il a formulé la théorie des « protéodies », les mélodies des protéines, en associant à chaque acide aminé une note calculée à partir de sa masse, via l'équation d'Einstein/Planck (h·f = m·c²) transposée de plusieurs octaves. C'est une théorie exploratoire, présentée ici comme source d'inspiration de notre démarche, sans prétention thérapeutique.</p><p class='note'>C'est une transposition : on traduit l'identité numérique d'une molécule en une note. Cette correspondance est une démarche de conception et d'exploration sonore — elle n'a pas d'effet thérapeutique démontré.</p><h3>Planètes</h3><p>Les planètes suivent l'<b>Octave Cosmique</b>. On part de la <b>période</b> d'un astre — son année, son jour ou son mois — qui correspond à une fréquence très basse (1 ÷ durée). On la <b>double un grand nombre de fois</b> (montée par octaves, ×2) jusqu'à entrer dans le domaine audible. Exemple : l'année terrestre donne le fameux 136,10 Hz (le « Om »).</p><h3>Couleurs</h3><p>Chaque couleur part de sa <b>longueur d'onde lumineuse</b>, ramenée dans le son par octaves jusqu'au domaine audible — comme les molécules, mais à partir de la lumière.</p><h3>Agroglyphes, géométrie sacrée &amp; flocons</h3><p>Ces figures ne partent pas d'une masse mais de leur <b>forme</b>. Leur symétrie et leurs proportions (nombre de branches, nombre d'or, axes) sont traduites en <b>rapports diatoniques</b> — des intervalles musicaux à nombres simples : l'octave (2:1), la quinte (3:2), la quarte (4:3), la tierce (5:4)… Chaque figure joue ainsi un accord ou une gamme qui reflète sa structure géométrique.</p><p class='note'>Bien-être et relaxation — sans usage médical ni allégation de santé.</p>",en:"<h3>Elements &amp; molecules</h3><p>Each frequency is derived from a molecule or an element through a simple, constant formula. We start from its <b>molar mass</b> (its mass in g/mol), multiply it by a fixed factor, then bring the result into a gentle, audible range (around 70–200 Hz) by octaves (dividing or multiplying by 2).</p><div class='formula'><span class='fline'>molar mass × 2.98095 → octave (× or ÷ 2) → frequency</span><span class='fex'>Example: Magnesium 24.305 g/mol × 2.98095 = 72.45 Hz</span></div><p>This approach — turning a molecule's molar mass into a sound frequency — follows the work of French physicist <b>Joël Sternheimer</b>, used in France for over 30 years. He formulated the theory of 'proteodies', the melodies of proteins, matching each amino acid to a note calculated from its mass via the Einstein/Planck equation (h·f = m·c²) transposed by several octaves. It is an exploratory theory, presented here as the inspiration behind our approach, with no therapeutic claim.</p><p class='note'>It's a transposition: we turn a molecule's numerical identity into a note. This correspondence is a design and sound-exploration approach — it has no proven therapeutic effect.</p><h3>Planets</h3><p>The planets follow the <b>Cosmic Octave</b>. We start from a body's <b>period</b> — its year, day or month — which corresponds to a very low frequency (1 ÷ duration). We <b>double it many times</b> (raising by octaves, ×2) until it reaches the audible range. Example: the Earth year gives the well-known 136.10 Hz (the 'Om').</p><h3>Colors</h3><p>Each color starts from its <b>light wavelength</b>, brought into sound by octaves down to the audible range — like the molecules, but from light.</p><h3>Crop circles, sacred geometry &amp; snowflakes</h3><p>These figures don't come from a mass but from their <b>shape</b>. Their symmetry and proportions (number of arms, golden ratio, axes) are turned into <b>diatonic ratios</b> — musical intervals with simple whole numbers: the octave (2:1), the fifth (3:2), the fourth (4:3), the third (5:4)… Each figure thus plays a chord or scale that mirrors its geometric structure.</p><p class='note'>Wellness and relaxation — not for medical use and with no health claims.</p>",es:"<h3>Elementos y moléculas</h3><p>Cada frecuencia se deriva de una molécula o de un elemento mediante una fórmula simple y constante. Partimos de su <b>masa molar</b> (su masa en g/mol), la multiplicamos por un factor fijo, y luego llevamos el resultado por octavas (dividiendo o multiplicando por 2) a un rango suave y audible, en torno a 70 a 200 Hz.</p><div class='formula'><span class='fline'>masa molar × 2,98095 → octava (× o ÷ 2) → frecuencia</span><span class='fex'>Ejemplo: Magnesio 24,305 g/mol × 2,98095 = 72,45 Hz</span></div><p>Este enfoque — traducir la masa molar de una molécula en frecuencia sonora — se inscribe en la línea de los trabajos del físico francés <b>Joël Sternheimer</b>, utilizados en Francia desde hace más de 30 años. Formuló la teoría de las «proteodías», las melodías de las proteínas, asociando a cada aminoácido una nota calculada a partir de su masa, mediante la ecuación de Einstein/Planck (h·f = m·c²) transpuesta varias octavas. Es una teoría exploratoria, presentada aquí como fuente de inspiración de nuestro enfoque, sin pretensión terapéutica.</p><p class='note'>Es una transposición: traducimos la identidad numérica de una molécula en una nota. Esta correspondencia es un enfoque de diseño y exploración sonora — no tiene efecto terapéutico demostrado.</p><h3>Planetas</h3><p>Los planetas siguen la <b>Octava Cósmica</b>. Partimos del <b>período</b> de un astro — su año, su día o su mes — que corresponde a una frecuencia muy baja (1 ÷ duración). La <b>duplicamos muchas veces</b> (subida por octavas, ×2) hasta entrar en el rango audible. Ejemplo: el año terrestre da el famoso 136,10 Hz (el 'Om').</p><h3>Colores</h3><p>Cada color parte de su <b>longitud de onda luminosa</b>, llevada al sonido por octavas hasta el rango audible — como las moléculas, pero a partir de la luz.</p><h3>Agroglifos, geometría sagrada y copos de nieve</h3><p>Estas figuras no parten de una masa sino de su <b>forma</b>. Su simetría y proporciones (número de brazos, número áureo, ejes) se traducen en <b>proporciones diatónicas</b> — intervalos musicales de números simples: la octava (2:1), la quinta (3:2), la cuarta (4:3), la tercera (5:4)… Cada figura toca así un acorde o escala que refleja su estructura geométrica.</p><p class='note'>Bienestar y relajación — sin uso médico ni afirmaciones de salud.</p>"}

  var LIBIMG={

  /* Repartition des fonds. Une molecule avec sa photo propre coupe la serie :
     on decoupe donc la liste en suites de cartes sans photo, et chaque suite
     est remplie par blocs de 3 (reste de 2 = image sur 2 moities, reste de 1 =
     image entiere) pour ne jamais laisser un tiers orphelin. Un changement de
     categorie coupe aussi, l en-tete de section separant les cartes. */
  function planBg(arr){
    var plan=new Array(arr.length), gi=0, run=[], lastC=null;
    function flush(){
      var i=0;
      while(i<run.length){
        var left=run.length-i;
        /* 4 restants -> 2+2 : mieux vaut deux moities qu un tiers tout seul */
        var n=left>=3?(left===4?2:3):left;
        var img=SLICEBG[gi++%SLICEBG.length];
        for(var k=0;k<n;k++) plan[run[i+k]]={img:img,n:n,k:k};
        i+=n;
      }
      run=[];
    }
    arr.forEach(function(m,i){
      if(m.c!==lastC){ lastC=m.c; flush(); }
      if(LIBIMG[m.n]){ flush(); plan[i]={img:LIBIMG[m.n],n:1,k:0}; }
      else run.push(i);
    });
    flush();
    return plan;
  }

    else if(type==="pearth"){

      g.beginPath(); g.ellipse(cx,cy,R*0.55,R*0.2,0,0,Math.PI*2); g.stroke();
      g.beginPath(); g.ellipse(cx,cy,R*0.2,R*0.55,0,0,Math.PI*2); g.stroke();

    else if(type==="planet1"||type==="planet2"||type==="planet3"){

  var pulse={bpm:72,vol:0.5,playing:false,master:null,osc:null,trem:null,dc:null,lfo:null,lfoGain:null};
  function pulseSetBtn(on){ var b=$("pPlay"); b.classList.toggle("on",on); b.textContent=on?t("stop"):t("play"); var st=$("pViz").parentNode; st.classList.toggle("playing",on); if(on)st.style.setProperty("--pulse-dur",(60/pulse.bpm).toFixed(3)+"s"); else st.style.removeProperty("--pulse-dur"); setBg(false); }
  function pulseStart(){ ensureCtx(); unlockAudio(); var t=ctx.currentTime+0.05;
    pulse.master=ctx.createGain(); pulse.master.gain.setValueAtTime(0.0001,t); pulse.master.gain.linearRampToValueAtTime(pulse.vol,t+0.08); pulse.master.connect(ctx.destination);
    pulse.osc=ctx.createOscillator(); pulse.osc.type="sine"; pulse.osc.frequency.setValueAtTime(432,t);
    pulse.trem=ctx.createGain(); pulse.trem.gain.setValueAtTime(0.65,t);
    pulse.dc=ctx.createConstantSource(); pulse.dc.offset.setValueAtTime(0.65,t);
    pulse.lfo=ctx.createOscillator(); pulse.lfo.type="sine"; pulse.lfo.frequency.setValueAtTime(pulse.bpm/60,t);
    pulse.lfoGain=ctx.createGain(); pulse.lfoGain.gain.setValueAtTime(0.35,t);
    pulse.lfo.connect(pulse.lfoGain); pulse.lfoGain.connect(pulse.trem.gain); pulse.dc.connect(pulse.trem.gain);
    pulse.osc.connect(pulse.trem); pulse.trem.connect(pulse.master);
    pulse.osc.start(t); pulse.lfo.start(t); pulse.dc.start(t);
    pulse.playing=true; pulseSetBtn(true); }
  function pulseStop(immediate){ if(!ctx||!pulse.master){ pulse.playing=false; pulseSetBtn(false); return; }
    var ti=ctx.currentTime,m=pulse.master,o=pulse.osc,l=pulse.lfo,d=pulse.dc;
    try{ m.gain.cancelScheduledValues(ti); m.gain.setValueAtTime(m.gain.value,ti); m.gain.linearRampToValueAtTime(0.0001,ti+(immediate?0.02:0.08)); }catch(e){}
    setTimeout(function(){ [o,l,d].forEach(function(nd){ try{nd.stop();nd.disconnect();}catch(e){} }); try{m.disconnect();}catch(e){} }, immediate?40:140);
    pulse.master=null; pulse.osc=null; pulse.trem=null; pulse.dc=null; pulse.lfo=null; pulse.lfoGain=null; pulse.playing=false; pulseSetBtn(false); }
  function pulseUpdTitle(){ $("pulseTitle").textContent=t("pulse_base")+" @ "+pulse.bpm+" bpm"; }
  function openPulse(from,bpm){ pulseStop(true); returnTo=from||"home";
    if(typeof bpm==="number"){ pulse.bpm=Math.max(40,Math.min(120,bpm)); }
    $("pBpm").value=pulse.bpm; $("pBpmVal").textContent=pulse.bpm+" bpm"; $("pBpmNum").textContent=pulse.bpm;
    pulseUpdTitle(); pulseSetBtn(false); show("pulse"); }
  $("pBack").addEventListener("click",function(){ pulseStop(false); show(returnTo); });
  $("pBpm").addEventListener("input",function(){ pulse.bpm=parseInt(this.value,10); $("pBpmVal").textContent=pulse.bpm+" bpm"; $("pBpmNum").textContent=pulse.bpm; pulseUpdTitle();
    if(pulse.playing){ if(pulse.lfo&&ctx)pulse.lfo.frequency.setTargetAtTime(pulse.bpm/60,ctx.currentTime,0.05); $("pViz").parentNode.style.setProperty("--pulse-dur",(60/pulse.bpm).toFixed(3)+"s"); } });
  $("pVol").addEventListener("input",function(){ pulse.vol=parseInt(this.value,10)/100; $("pVolLbl").textContent=this.value; if(pulse.master&&ctx)pulse.master.gain.setTargetAtTime(pulse.playing?pulse.vol:0,ctx.currentTime,0.02); });
  $("pPlay").addEventListener("click",function(){ unlockAudio(); if(pulse.playing)pulseStop(false); else pulseStart(); });

  var favJustSaved=-1;

    favSlots.forEach(function(f,i){
      var row=document.createElement("button"); row.className="ftile"+(i===favJustSaved?" justadded":"");

        var tot=f.steps.reduce(function(a,s){return a+s.m;},0);

          if(a==="edit"){ favBuild={slot:i, steps:f.steps.slice(), name:f.name}; show("favRecap"); renderFavRecap(); return; }
          openSeq({fr:f.name,en:f.name,es:f.name,ic:"⭐",s:f.steps}, "favList");
        });

  function renderFavKeypad(){
    if(favKb.mode==="duration"){

      $("favKbTitle").textContent=t("manual_title");

      $("favKbHint").textContent="";

  function favKbDigit(d){ var max=(favKb.mode==="duration")?2:9; if(favKb.kb.length>=max)return; if(d==="."){ if(favKb.mode==="duration"||favKb.kb.indexOf(".")>=0)return; } favKb.kb+=d; renderFavKeypad(); }
  function favKbBack(){ favKb.kb=favKb.kb.slice(0,-1); renderFavKeypad(); }
  function favKbOk(){
    if(favKb.mode==="duration"){
      var mn=parseInt(favKb.kb,10);
      if(!favKb.kb||isNaN(mn)||mn<1||mn>60){ flashMsg(t("fav_dur_err")); return; }
      favBuild.steps.push({n:favBuild.pending.n, f:favBuild.pending.f, m:mn});
      favBuild.pending=null;
      renderFavNext(); show("favNext");
    } else {
      var v=parseFloat(favKb.kb); if(!favKb.kb||isNaN(v)||v<=0)return;

  $("favRecapPlay").addEventListener("click",function(){
    var steps=favBuild.steps.slice(), name=t("chain_temp_name");
    favBuild=null; $("libTitle").textContent=t("tab_freq");
    openSeq({fr:name,en:name,es:name,ic:"🔗",s:steps}, "home");
  });
  $("favRecapSave").addEventListener("click",function(){
    $("favNameTitle").textContent=t("fav_name_title");
    $("favNameInput").placeholder=t("fav_name_ph");
    $("favNameInput").value=favBuild.name||"";
    show("favName");
  });
  $("favNameBack").addEventListener("click",function(){ show("favRecap"); });
  $("favNameSave").addEventListener("click",function(){
    var slot=favBuild.slot;
    if(slot==null){ slot=favSlots.findIndex(function(s){return !s;}); if(slot<0){ flashMsg(t("fav_no_slot")); return; } }
    var name=$("favNameInput").value.trim() || (t("fav_default_name")+" "+(slot+1));
    favSlots[slot]={name:name, steps:favBuild.steps.slice()};
    saveFavSlots(); favJustSaved=slot;
    favBuild=null; $("libTitle").textContent=t("tab_freq");
    show("favList"); renderFavList();
  });

  // ---------- fond de particules ----------
  var Particles=null;
  (function(){
    var cv=$("pbg"); if(!cv)return;
    var g2=cv.getContext("2d"); if(!g2)return;
    var P=[],W=0,H=0,raf=null,last=0;
    var level="full", dens=1, spd=1, tw=true;   // dens=densité, spd=vitesse, tw=scintillement
    var COLS=["127,216,240","127,216,240","127,216,240","185,143,224","185,143,224","233,201,106"];
    function animates(){ return level!=="off" && !prefersReduce; }
    function size(){ var d=Math.min(window.devicePixelRatio||1,2);
      W=window.innerWidth; H=window.innerHeight;
      cv.width=Math.round(W*d); cv.height=Math.round(H*d); g2.setTransform(d,0,0,d,0,0); }
    function make(){ P=[]; var base=Math.max(40,Math.min(80,Math.round(W*H/14000))); var n=Math.round(base*dens);
      for(var i=0;i<n;i++){ var glow=Math.random()<0.12;
        P.push({ x:Math.random()*W, y:Math.random()*H,
          r:glow?(6+Math.random()*8):(0.7+Math.random()*1.5), g:glow,
          a:glow?(0.04+Math.random()*0.05):(0.08+Math.random()*0.24),
          c:COLS[(Math.random()*COLS.length)|0],
          vx:(Math.random()*12-6), vy:-(5+Math.random()*13),
          ph:Math.random()*6.283, ps:0.3+Math.random()*0.9 }); } }
    function draw(twinkle){ g2.clearRect(0,0,W,H);
      for(var i=0;i<P.length;i++){ var p=P[i];
        var a=twinkle?p.a*(0.55+0.45*Math.sin(p.ph)):p.a;
        if(p.g){ var gr=g2.createRadialGradient(p.x,p.y,0,p.x,p.y,p.r);
          gr.addColorStop(0,"rgba("+p.c+","+a.toFixed(3)+")"); gr.addColorStop(1,"rgba("+p.c+",0)");
          g2.fillStyle=gr; g2.fillRect(p.x-p.r,p.y-p.r,p.r*2,p.r*2); }
        else { g2.fillStyle="rgba("+p.c+","+a.toFixed(3)+")";
          g2.beginPath(); g2.arc(p.x,p.y,p.r,0,6.283); g2.fill(); } } }
    function step(ts){ raf=requestAnimationFrame(step);
      if(!last){ last=ts; return; }
      var dt=Math.min((ts-last)/1000,0.1); last=ts;
      for(var i=0;i<P.length;i++){ var p=P[i];
        p.x+=p.vx*spd*dt; p.y+=p.vy*spd*dt; p.ph+=p.ps*dt;
        if(p.y<-20){ p.y=H+20; p.x=Math.random()*W; }
        if(p.x<-20)p.x=W+20; else if(p.x>W+20)p.x=-20; }
      draw(tw); }
    function start(){ if(raf)return; if(!animates()){ draw(false); return; } last=0; raf=requestAnimationFrame(step); }
    function stop(){ if(raf){ cancelAnimationFrame(raf); raf=null; } }
    function setLevel(lv){ level=lv; stop();
      if(lv==="off"){ cv.style.display="none"; g2.clearRect(0,0,W,H); return; }
      cv.style.display="";
      if(lv==="reduced"){ dens=0.45; spd=0.55; tw=false; } else { dens=1; spd=1; tw=true; }
      size(); make(); start(); }
    Particles={ setLevel:setLevel };
    setLevel(settings.anim);
    document.addEventListener("visibilitychange",function(){ if(document.hidden)stop(); else if(level!=="off")start(); });
    var rT=null;
    window.addEventListener("resize",function(){ clearTimeout(rT);
      rT=setTimeout(function(){ if(level==="off")return; stop(); size(); make(); start(); },200); });
  })();

  // ---------- paramètres ----------
  function applyDefaultVolume(pct){ var f=pct/100; state.vol=f; gp.vol=f; pulse.vol=f; bin.vol=f;
    [["vol","volLbl"],["sVol","sVolLbl"],["gVol","gVolLbl"],["pVol","pVolLbl"],["binVol","binVolLbl"]].forEach(function(p){ var s=$(p[0]),l=$(p[1]); if(s)s.value=pct; if(l)l.textContent=pct; }); }
  function renderSettings(){
    Array.prototype.forEach.call(document.querySelectorAll("#setAnim button"),function(b){ b.setAttribute("aria-pressed", b.getAttribute("data-v")===settings.anim?"true":"false"); });
    $("setVol").value=settings.vol; $("setVolVal").textContent=settings.vol; }
  $("setBtn").addEventListener("click",function(){ show("settings"); renderSettings(); });
  $("setBack").addEventListener("click",function(){ show("home"); });
  Array.prototype.forEach.call(document.querySelectorAll("#setAnim button"),function(b){ b.addEventListener("click",function(){ settings.anim=b.getAttribute("data-v"); saveSettings(); if(Particles)Particles.setLevel(settings.anim); renderSettings(); }); });
  // sélecteur de langue des Réglages : peuplé par fillLangList (clics câblés à la création)
  $("setVol").addEventListener("input",function(){ settings.vol=parseInt(this.value,10); $("setVolVal").textContent=settings.vol; applyDefaultVolume(settings.vol); saveSettings(); });

  /* ===== Effet « vague liquide » sur la photo de l'écran de lecture ===== */
  /* Bandes horizontales décalées par deux sinus lents : l'onde traverse l'image
     du haut vers le bas, comme vue à travers l'eau. Amplitude faible, cycle lent,
     coupé si les animations sont réduites/désactivées (design system Auralis). */
  var gwave={raf:0,on:false,ctx:null,off:null,A:0,W:0,H:0,t0:0};
  function gWaveReduced(){
    try{ return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }catch(e){ return false; }
  }
  function gWaveStop(){
    if(gwave.raf){ cancelAnimationFrame(gwave.raf); gwave.raf=0; }
    gwave.on=false;
    var cv=$("gWave"), img=$("gPhoto");
    if(cv) cv.hidden=true;
    if(img) img.style.visibility="";
  }
  function gWaveFrame(now){
    if(!gwave.on) return;
    if(settings.anim==="off"){ gWaveStop(); return; }
    var ctx=gwave.ctx, off=gwave.off, W=gwave.W, H=gwave.H;
    var t=(now-gwave.t0)/1000;
    var soft=(settings.anim==="reduced")?0.5:1;       // niveau « réduit » = plus lent
    var spd=soft;
    // « Living Image v1 » : l'image reste EN PLACE. Ce qui traverse, c'est une
    // onde — réfraction de quelques pixels seulement — accompagnée d'une bande
    // lumineuse qui rehausse luminosité/contraste sur son passage. C'est cette
    // bande qui donne l'impression qu'une vague circule SOUS l'image.
    var M=gwave.M, dpr=gwave.dpr;
    var T=10/spd;                                      // durée de traversée (8-12 s)
    // Une nouvelle vague démarre quand la précédente est à 90 % de son trajet :
    // les deux se chevauchent brièvement, donc plus aucun temps mort ni « redémarrage ».
    var Tp=T*0.9, n=Math.floor(t/Tp);
    var pr1=(t-n*Tp)/T, pr2=(t-(n-1)*Tp)/T;
    var waves=[1.25-pr1*1.62];
    if(pr2<=1) waves.push(1.25-pr2*1.62);              // la précédente, encore en vue
    var wd=0.15;                                       // largeur ~30 %
    var R=3.6*dpr;                                     // réfraction 3,6 px (+20 %)
    var N=1.5*dpr;                                     // bruit organique 1,5 px
    var S=Math.max(2,Math.round(dpr*2));
    ctx.clearRect(0,0,W,H);
    for(var y=0;y<H;y+=S){
      var p=y/H, dy=0;
      // dérivée de gaussienne = réfraction (l'image se courbe au passage de l'onde)
      for(var wi=0;wi<waves.length;wi++){
        var u=(p-waves[wi])/wd;
        dy+=R*1.65*u*Math.exp(-0.5*u*u);
      }
      // deux sinus de fréquences non harmoniques = flux organique permanent
      var dx=N*(Math.sin(y*0.09/dpr+t*0.8*spd)+0.5*Math.sin(y*0.031/dpr-t*0.5*spd))/1.5;
      var sh=Math.min(S,H-y);
      ctx.drawImage(off, M+dx, M+y-dy, W, sh, 0, y, W, sh);
    }
    // bande lumineuse diagonale qui accompagne chaque onde (+ luminosité, + contraste)
    var sp=wd*H*1.9;
    for(var wi=0;wi<waves.length;wi++){
      var yc=waves[wi]*H;
      var g=ctx.createLinearGradient(W*0.2, yc+H*0.10-sp, W*0.8, yc-H*0.10+sp);
      g.addColorStop(0,"rgba(255,255,255,0)");
      g.addColorStop(0.5,"rgba(255,255,255,0.24)");
      g.addColorStop(1,"rgba(255,255,255,0)");
      ctx.globalCompositeOperation="soft-light";
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      ctx.globalCompositeOperation="lighter";
      ctx.globalAlpha=0.06; ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
      ctx.globalAlpha=1;
    }
    ctx.globalCompositeOperation="source-over";
    gwave.raf=requestAnimationFrame(gWaveFrame);
  }
  function gWaveStart(){
    var img=$("gPhoto"), cv=$("gWave");
    if(!img||!cv||img.hidden||settings.anim==="off"||gWaveReduced()){ gWaveStop(); return; }
    var build=function(){
      if(!img.naturalWidth) return;
      var r=img.getBoundingClientRect(), w=Math.round(r.width), hh=Math.round(r.height);
      if(!w||!hh){ gWaveStop(); return; }
      var dpr=Math.min(window.devicePixelRatio||1,2);
      cv.style.width=w+"px"; cv.style.height=hh+"px";
      cv.width=Math.round(w*dpr); cv.height=Math.round(hh*dpr);
      // Marge de quelques pixels autour de l'image : les déplacements de
      // réfraction (2-4 px) ne découvrent ainsi jamais de bord vide.
      var M=Math.round(10*dpr);
      var off=document.createElement("canvas");
      off.width=cv.width+2*M; off.height=cv.height+2*M;
      off.getContext("2d").drawImage(img,0,0,off.width,off.height);
      gwave.ctx=cv.getContext("2d"); gwave.off=off; gwave.M=M;
      gwave.W=cv.width; gwave.H=cv.height; gwave.dpr=dpr;
      gwave.t0=performance.now(); gwave.on=true;
      img.style.visibility="hidden"; cv.hidden=false;
      if(gwave.raf) cancelAnimationFrame(gwave.raf);
      gwave.raf=requestAnimationFrame(gWaveFrame);
    };
    if(img.complete&&img.naturalWidth) build(); else img.addEventListener("load",build,{once:true});
  }
  window.addEventListener("resize",function(){ if(gwave.on){ gWaveStop(); gWaveStart(); } });
  document.addEventListener("visibilitychange",function(){
    if(document.hidden) gWaveStop();
    else if(curView==="geoPlay") gWaveStart();
  });

  /* ===== Construis ta musique de méditation (version d'essai) ===== */
  var MIXSOUNDS=[
    {id:"riviere", key:"snd_riviere", sub:"snd_riviere_sub", icon:"≈", tc:"#7fd8f0", base:"app-sounds/ambience/riviere2", vol:60}
  ];
  var mix={ playing:false, bufs:{}, nodes:{}, gains:{}, vol:{}, muted:{} };

  function mixUrl(base){
    var a=document.createElement("audio");
    var ogg = a.canPlayType && a.canPlayType('audio/ogg; codecs="vorbis"');
    return base + (ogg==="probably"||ogg==="maybe" ? ".ogg" : ".m4a");
  }
  function mixLoad(s,cb){
    if(mix.bufs[s.id]) { cb(mix.bufs[s.id]); return; }
    var c=ensureCtx(), x=new XMLHttpRequest();
    x.open("GET",mixUrl(s.base),true); x.responseType="arraybuffer";
    x.onload=function(){ c.decodeAudioData(x.response,function(b){ mix.bufs[s.id]=b; cb(b); },function(){ cb(null); }); };
    x.onerror=function(){ cb(null); };
    x.send();
  }
  function mixStartTrack(s){
    if(mix.nodes[s.id]||!mix.bufs[s.id]) return;
    var c=ensureCtx();
    var src=c.createBufferSource(); src.buffer=mix.bufs[s.id]; src.loop=true;
    var g=c.createGain(); g.gain.value=mix.muted[s.id]?0:(mix.vol[s.id]/100);
    src.connect(g); g.connect(c.destination); src.start(0);
    mix.nodes[s.id]=src; mix.gains[s.id]=g;
  }
  function mixStopTrack(s){
    var n=mix.nodes[s.id]; if(!n) return;
    try{ n.stop(0); }catch(e){}
    try{ n.disconnect(); mix.gains[s.id].disconnect(); }catch(e){}
    mix.nodes[s.id]=null; mix.gains[s.id]=null;
  }
  function mixStop(){
    mix.playing=false;
    MIXSOUNDS.forEach(mixStopTrack);
    var b=$("mixPlay"); b.textContent="▶"; b.classList.remove("on");
  }
  function mixToggle(){
    if(mix.playing){ mixStop(); return; }
    unlockAudio();
    var pending=MIXSOUNDS.length, failed=false;
    flashMsg(t("mix_loading"));
    MIXSOUNDS.forEach(function(s){
      mixLoad(s,function(b){
        if(!b) failed=true;
        if(--pending===0){
          if(failed){ flashMsg(t("mix_err")); return; }
          mix.playing=true;
          MIXSOUNDS.forEach(mixStartTrack);
          var btn=$("mixPlay"); btn.textContent="❚❚"; btn.classList.add("on");
        }
      });
    });
  }
  function mixSetVol(s,pct){
    mix.vol[s.id]=pct;
    var g=mix.gains[s.id];
    if(g) g.gain.value = mix.muted[s.id] ? 0 : pct/100;
    var el=$("mixPct_"+s.id); if(el) el.textContent=pct+" %";
  }
  function mixToggleMute(s){
    mix.muted[s.id]=!mix.muted[s.id];
    var g=mix.gains[s.id];
    if(g) g.gain.value = mix.muted[s.id] ? 0 : mix.vol[s.id]/100;
    var card=$("mixCard_"+s.id), b=$("mixMute_"+s.id);
    if(card) card.classList.toggle("off",mix.muted[s.id]);
    if(b) b.textContent = mix.muted[s.id] ? "🔇" : "🔊";
  }
  function mixRender(){
    var box=$("mixTracks"); box.innerHTML="";
    MIXSOUNDS.forEach(function(s){
      if(mix.vol[s.id]===undefined) mix.vol[s.id]=s.vol;
      var card=document.createElement("div");
      card.className="mixtrack"+(mix.muted[s.id]?" off":"");
      card.id="mixCard_"+s.id; card.style.setProperty("--tc",s.tc);
      var row=document.createElement("div"); row.className="mixrow";
      var ic=document.createElement("span"); ic.className="mixicon"; ic.textContent=s.icon;
      var nm=document.createElement("span"); nm.className="mixname";
      nm.innerHTML="<b></b><i></i>";
      nm.querySelector("b").textContent=t(s.key);
      nm.querySelector("i").textContent=t(s.sub);
      var pc=document.createElement("span"); pc.className="mixpct"; pc.id="mixPct_"+s.id; pc.textContent=mix.vol[s.id]+" %";
      var mu=document.createElement("button"); mu.className="mixmute"; mu.id="mixMute_"+s.id;
      mu.textContent=mix.muted[s.id]?"🔇":"🔊";
      mu.addEventListener("click",function(){ mixToggleMute(s); });
      row.appendChild(ic); row.appendChild(nm); row.appendChild(pc); row.appendChild(mu);
      var sl=document.createElement("input");
      sl.type="range"; sl.min=0; sl.max=100; sl.step=1; sl.value=mix.vol[s.id];
      sl.setAttribute("aria-label",t(s.key));
      sl.addEventListener("input",function(){ mixSetVol(s,parseInt(this.value,10)); });
      card.appendChild(row); card.appendChild(sl);
      box.appendChild(card);
    });
  }
  function openMix(){
    $("mixTitle").textContent=t("mix_title");
    $("mixTimerLbl").textContent=t("mix_timer");
    $("mixResetLbl").textContent=t("mix_reset");
    $("mixNote").textContent=t("mix_note");
    mixRender(); show("mix");
  }
  $("mixPlay").addEventListener("click",mixToggle);
  $("mixBack").addEventListener("click",function(){ mixStop(); show("home"); });
  $("mixReset").addEventListener("click",function(){
    MIXSOUNDS.forEach(function(s){ mix.muted[s.id]=false; mixSetVol(s,s.vol); });
    mixRender();
  });
  $("mixTimer").addEventListener("click",function(){ flashMsg(t("mix_soon")); });

  makeViz("viz",function(){return state.playing;});
  makeViz("sViz",function(){return seq.playing;});
  makeViz("pViz",function(){return pulse.playing;});

  applyDefaultVolume(settings.vol);
  applyLang(); show("home");
})();
</script>
