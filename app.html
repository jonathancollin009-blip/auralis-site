inuent avec l'âge. Le corps la fabrique à partir de la vitamine B3. Sa fréquence Auralis (123,60 Hz) dérive de sa masse molaire.", "en": "NAD+ (nicotinamide adenine dinucleotide) is an indispensable molecule present in every cell, where it acts as a 'carrier' in the reactions that produce energy. It is also involved in DNA repair and in the regulation of cellular aging, which makes it a very active area of research. Its levels decrease with age. The body makes it from vitamin B3. Its Auralis frequency (123.60 Hz) derives from its molar mass.", "es": "El NAD+ (nicotinamida adenina dinucleótido) es una molécula indispensable presente en cada célula, donde actúa como «transportador» en las reacciones que producen energía. También interviene en la reparación del ADN y en la regulación del envejecimiento celular, lo que la convierte en un tema de investigación muy activo. Sus niveles disminuyen con la edad. El cuerpo la fabrica a partir de la vitamina B3. Su frecuencia Auralis (123,60 Hz) deriva de su masa molar."}, "NADH": {"fr": "Le NADH est la forme « chargée en énergie » du NAD+ : c'est lui qui transporte les électrons issus de la digestion des aliments jusqu'aux mitochondries, où ils servent à fabriquer l'ATP. Il est donc un maillon central de la production d'énergie cellulaire et possède aussi un rôle antioxydant. On l'étudie comme complément lié à l'énergie et à la vigilance. Sa fréquence Auralis (123,98 Hz) est dérivée de sa masse molaire.", "en": "NADH is the 'energy-charged' form of NAD+: it is what carries the electrons from the digestion of food to the mitochondria, where they are used to make ATP. It is therefore a central link in cellular energy production and also has an antioxidant role. It is studied as a supplement linked to energy and alertness. Its Auralis frequency (123.98 Hz) is derived from its molar mass.", "es": "El NADH es la forma «cargada de energía» del NAD+: es el que transporta los electrones de la digestión de los alimentos hasta las mitocondrias, donde se usan para fabricar ATP. Es por tanto un eslabón central de la producción de energía celular y también tiene un papel antioxidante. Se estudia como complemento ligado a la energía y la vigilancia. Su frecuencia Auralis (123,98 Hz) se deriva de su masa molar."}, "Oxyde nitrique": {"fr": "L'oxyde nitrique (NO) est une minuscule molécule gazeuse que le corps fabrique en permanence pour servir de messager. Son rôle le plus connu est de détendre la paroi des vaisseaux sanguins, ce qui favorise la circulation — une découverte récompensée par un prix Nobel. Il intervient aussi dans l'immunité et la communication entre neurones. Le corps le produit à partir d'un acide aminé, l'arginine. Sa fréquence Auralis (89,46 Hz) dérive de sa masse molaire.", "en": "Nitric oxide (NO) is a tiny gaseous molecule the body constantly makes to serve as a messenger. Its best-known role is to relax the walls of blood vessels, which promotes circulation — a discovery rewarded with a Nobel Prize. It is also involved in immunity and communication between neurons. The body makes it from an amino acid, arginine. Its Auralis frequency (89.46 Hz) derives from its molar mass.", "es": "El óxido nítrico (NO) es una minúscula molécula gaseosa que el cuerpo fabrica de forma constante para servir de mensajero. Su papel más conocido es relajar la pared de los vasos sanguíneos, lo que favorece la circulación — un descubrimiento premiado con un Nobel. También interviene en la inmunidad y la comunicación entre neuronas. El cuerpo lo produce a partir de un aminoácido, la arginina. Su frecuencia Auralis (89,46 Hz) deriva de su masa molar."}, "PQQ": {"fr": "La PQQ (pyrroloquinoléine quinone) est une petite molécule aux propriétés antioxydantes marquées, présente dans de nombreux aliments comme le natto, le persil, le thé vert et les poivrons. Elle est particulièrement étudiée pour son rôle possible dans la santé et la formation des mitochondries, les centrales énergétiques des cellules. Elle est proposée comme complément lié à l'énergie. Sa fréquence Auralis (123,04 Hz) est dérivée de sa masse molaire.", "en": "PQQ (pyrroloquinoline quinone) is a small molecule with marked antioxidant properties, present in many foods such as natto, parsley, green tea and peppers. It is particularly studied for its possible role in the health and formation of the mitochondria, the cells' energy plants. It is offered as a supplement linked to energy. Its Auralis frequency (123.04 Hz) is derived from its molar mass.", "es": "La PQQ (pirroloquinolina quinona) es una pequeña molécula de propiedades antioxidantes marcadas, presente en numerosos alimentos como el natto, el perejil, el té verde y los pimientos. Se estudia en particular por su posible papel en la salud y la formación de las mitocondrias, las centrales energéticas de las células. Se ofrece como complemento ligado a la energía. Su frecuencia Auralis (123,04 Hz) se deriva de su masa molar."}, "Sérotonine": {"fr": "La sérotonine est un neurotransmetteur souvent surnommé « molécule de la bonne humeur », impliqué dans la régulation de l'humeur, de l'appétit et du sommeil. Fait surprenant, la majeure partie se trouve dans l'intestin, où elle participe à la digestion. Le corps la fabrique à partir du tryptophane, un acide aminé de l'alimentation, et elle est le précurseur de la mélatonine. Sa fréquence Auralis (131,32 Hz) dérive de sa masse molaire.", "en": "Serotonin is a neurotransmitter often nicknamed the 'good-mood molecule', involved in regulating mood, appetite and sleep. Surprisingly, most of it is found in the gut, where it takes part in digestion. The body makes it from tryptophan, an amino acid from food, and it is the precursor of melatonin. Its Auralis frequency (131.32 Hz) derives from its molar mass.", "es": "La serotonina es un neurotransmisor a menudo apodado «molécula del buen ánimo», implicado en la regulación del estado de ánimo, el apetito y el sueño. Sorprendentemente, la mayor parte se encuentra en el intestino, donde participa en la digestión. El cuerpo la fabrica a partir del triptófano, un aminoácido de la alimentación, y es la precursora de la melatonina. Su frecuencia Auralis (131,32 Hz) deriva de su masa molar."}, "Taurine": {"fr": "La taurine est une molécule apparentée aux acides aminés, très concentrée dans le cœur, le cerveau, la rétine et les muscles. Elle participe à l'équilibre des liquides et des minéraux dans les cellules et possède un rôle antioxydant. Le corps en fabrique, et on la trouve dans les fruits de mer, le poisson et la viande ; c'est aussi un ingrédient classique des boissons énergisantes. Sa fréquence Auralis (186,53 Hz) est dérivée de sa masse molaire.", "en": "Taurine is a molecule related to amino acids, highly concentrated in the heart, brain, retina and muscles. It takes part in the balance of fluids and minerals within cells and has an antioxidant role. The body makes some, and it is found in seafood, fish and meat; it is also a classic ingredient of energy drinks. Its Auralis frequency (186.53 Hz) is derived from its molar mass.", "es": "La taurina es una molécula emparentada con los aminoácidos, muy concentrada en el corazón, el cerebro, la retina y los músculos. Participa en el equilibrio de los líquidos y minerales dentro de las células y tiene un papel antioxidante. El cuerpo fabrica algo, y se encuentra en los mariscos, el pescado y la carne; también es un ingrediente clásico de las bebidas energéticas. Su frecuencia Auralis (186,53 Hz) se deriva de su masa molar."}, "Vitamine B12": {"fr": "La vitamine B12 (cobalamine) est indispensable au bon fonctionnement du système nerveux et à la fabrication des globules rouges, ainsi qu'au métabolisme de l'ADN. Elle se trouve presque exclusivement dans les produits d'origine animale — viande, poisson, œufs, produits laitiers — ce qui explique qu'elle soit souvent supplémentée dans les régimes végétaliens. Le corps peut en stocker plusieurs années. Sa fréquence Auralis (126,26 Hz) dérive de sa masse molaire.", "en": "Vitamin B12 (cobalamin) is indispensable to the proper functioning of the nervous system and to the making of red blood cells, as well as to DNA metabolism. It is found almost exclusively in animal products — meat, fish, eggs, dairy — which is why it is often supplemented in vegan diets. The body can store several years' worth of it. Its Auralis frequency (126.26 Hz) derives from its molar mass.", "es": "La vitamina B12 (cobalamina) es indispensable para el buen funcionamiento del sistema nervioso y la fabricación de los glóbulos rojos, así como para el metabolismo del ADN. Se encuentra casi exclusivamente en los productos de origen animal — carne, pescado, huevos, lácteos — por lo que suele suplementarse en las dietas veganas. El cuerpo puede almacenar reservas de varios años. Su frecuencia Auralis (126,26 Hz) deriva de su masa molar."}, "Vitamine D": {"fr": "La vitamine D est particulière : le corps la fabrique surtout lui-même, au niveau de la peau exposée au soleil. Elle est essentielle à l'absorption du calcium et donc à la solidité des os et des dents, et joue aussi un rôle dans l'immunité. On la trouve dans les poissons gras, le jaune d'œuf et les aliments enrichis ; sous nos latitudes, elle est fréquemment supplémentée en hiver. Sa fréquence Auralis (143,32 Hz) est dérivée de sa masse molaire.", "en": "Vitamin D is special: the body makes most of it itself, in the skin exposed to the sun. It is essential to the absorption of calcium and therefore to the strength of bones and teeth, and it also plays a role in immunity. It is found in oily fish, egg yolk and fortified foods; in our latitudes, it is often supplemented in winter. Its Auralis frequency (143.32 Hz) is derived from its molar mass.", "es": "La vitamina D es especial: el cuerpo la fabrica sobre todo por sí mismo, en la piel expuesta al sol. Es esencial para la absorción del calcio y, por tanto, para la solidez de los huesos y los dientes, y también desempeña un papel en la inmunidad. Se encuentra en los pescados azules, la yema de huevo y los alimentos enriquecidos; en nuestras latitudes, suele suplementarse en invierno. Su frecuencia Auralis (143,32 Hz) se deriva de su masa molar."}, "Estradiol (E2)": {"fr": "L'estradiol — ou 17β-estradiol, abrégé E2 — est le principal et le plus puissant des estrogènes pendant les années fécondes, produit surtout par les ovaires. Identique à celui que le corps fabrique (« bio-identique »), c'est la forme la plus prescrite en hormonothérapie : comprimés, patchs ou gels. Au-delà de la reproduction, il agit aussi sur les os, la peau, le cœur et le cerveau. Sa fréquence Auralis (101,49 Hz) dérive de sa masse molaire.", "en": "Estradiol — or 17β-estradiol, abbreviated E2 — is the main and most potent estrogen of the reproductive years, produced mainly by the ovaries. Identical to the one the body makes (bio-identical), it is the most prescribed form in hormone therapy: tablets, patches or gels. Beyond reproduction, it also acts on bones, skin, heart and brain. Its Auralis frequency (101.49 Hz) derives from its molar mass.", "es": "El estradiol — o 17β-estradiol, abreviado E2 — es el principal y más potente estrógeno de los años fértiles, producido sobre todo por los ovarios. Idéntico al que fabrica el cuerpo (bioidéntico), es la forma más prescrita en terapia hormonal: comprimidos, parches o geles. Más allá de la reproducción, también actúa sobre los huesos, la piel, el corazón y el cerebro. Su frecuencia Auralis (101,49 Hz) deriva de su masa molar."}, "Progestérone": {"fr": "La progestérone est une hormone clé du cycle féminin : produite surtout après l'ovulation, elle prépare l'utérus à une éventuelle grossesse et joue un rôle majeur pendant celle-ci. Elle intervient aussi sur l'humeur, la température du corps et le sommeil. Comme les œstrogènes, ses niveaux varient au fil du cycle et de la vie. Sa fréquence Auralis (117,17 Hz) est dérivée de sa masse molaire.", "en": "Progesterone is a key hormone of the female cycle: produced mainly after ovulation, it prepares the uterus for a possible pregnancy and plays a major role during it. It also acts on mood, body temperature and sleep. Like estrogens, its levels vary over the cycle and over life. Its Auralis frequency (117.17 Hz) is derived from its molar mass.", "es": "La progesterona es una hormona clave del ciclo femenino: producida sobre todo después de la ovulación, prepara el útero para un posible embarazo y desempeña un papel mayor durante el mismo. También actúa sobre el ánimo, la temperatura del cuerpo y el sueño. Como los estrógenos, sus niveles varían a lo largo del ciclo y de la vida. Su frecuencia Auralis (117,17 Hz) se deriva de su masa molar."}, "Ocytocine": {"fr": "L'ocytocine est une hormone et un messager du cerveau souvent surnommée « hormone de l'attachement » ou « du lien » : elle est libérée lors des câlins, du contact et de l'allaitement, et favorise la confiance et le lien social. Elle joue aussi un rôle physiologique majeur pendant l'accouchement et l'allaitement. Le corps la produit dans l'hypothalamus. Sa fréquence Auralis (187,65 Hz) dérive de sa masse molaire.", "en": "Oxytocin is a hormone and brain messenger often nicknamed the 'attachment hormone' or 'bonding hormone': it is released during hugs, contact and breastfeeding, and promotes trust and social bonding. It also plays a major physiological role during childbirth and breastfeeding. The body produces it in the hypothalamus. Its Auralis frequency (187.65 Hz) derives from its molar mass.", "es": "La oxitocina es una hormona y un mensajero del cerebro a menudo apodado «hormona del apego» o «del vínculo»: se libera durante los abrazos, el contacto y la lactancia, y favorece la confianza y el vínculo social. También desempeña un papel fisiológico mayor durante el parto y la lactancia. El cuerpo la produce en el hipotálamo. Su frecuencia Auralis (187,65 Hz) deriva de su masa molar."}, "Testostérone": {"fr": "La testostérone est la principale hormone sexuelle masculine, produite surtout par les testicules, mais présente aussi, en plus petite quantité, chez les femmes. Elle influence la masse musculaire et osseuse, la pilosité, la voix, mais aussi l'énergie et l'humeur. Ses niveaux culminent chez le jeune adulte puis déclinent lentement avec l'âge. Sa fréquence Auralis (107,47 Hz) est dérivée de sa masse molaire.", "en": "Testosterone is the main male sex hormone, produced mainly by the testicles, but also present, in smaller amounts, in women. It influences muscle and bone mass, body hair and the voice, but also energy and mood. Its levels peak in young adulthood and then slowly decline with age. Its Auralis frequency (107.47 Hz) is derived from its molar mass.", "es": "La testosterona es la principal hormona sexual masculina, producida sobre todo por los testículos, pero también presente, en menor cantidad, en las mujeres. Influye en la masa muscular y ósea, el vello y la voz, pero también en la energía y el ánimo. Sus niveles alcanzan su punto máximo en el adulto joven y luego declinan lentamente con la edad. Su frecuencia Auralis (107,47 Hz) se deriva de su masa molar."}, "Ghréline": {"fr": "La ghréline est l'« hormone de la faim » : sécrétée surtout par l'estomac lorsqu'il est vide, elle envoie au cerveau le signal qu'il est temps de manger. Elle forme un duo avec la leptine, l'hormone de la satiété, pour réguler l'appétit. Elle intervient aussi dans le sommeil et la gestion de l'énergie. Sa fréquence Auralis (157,01 Hz) dérive de sa masse molaire.", "en": "Ghrelin is the 'hunger hormone': secreted mainly by the stomach when it is empty, it sends the brain the signal that it is time to eat. It forms a pair with leptin, the satiety hormone, to regulate appetite. It is also involved in sleep and energy management. Its Auralis frequency (157.01 Hz) derives from its molar mass.", "es": "La grelina es la «hormona del hambre»: secretada sobre todo por el estómago cuando está vacío, envía al cerebro la señal de que es hora de comer. Forma un dúo con la leptina, la hormona de la saciedad, para regular el apetito. También interviene en el sueño y la gestión de la energía. Su frecuencia Auralis (157,01 Hz) deriva de su masa molar."}, "5-HTP": {"fr": "Le 5-HTP (5-hydroxytryptophane) est une molécule que le corps utilise comme étape intermédiaire pour fabriquer la sérotonine, elle-même précurseur de la mélatonine. On l'extrait surtout des graines du Griffonia simplicifolia, un arbuste d'Afrique de l'Ouest. Il est traditionnellement proposé en complément dans une optique d'humeur et de sommeil. Sa fréquence Auralis (164,12 Hz) est dérivée de sa masse molaire.", "en": "5-HTP (5-hydroxytryptophan) is a molecule the body uses as an intermediate step to make serotonin, itself the precursor of melatonin. It is extracted mainly from the seeds of Griffonia simplicifolia, a West African shrub. It is traditionally offered as a supplement with mood and sleep in mind. Its Auralis frequency (164.12 Hz) is derived from its molar mass.", "es": "El 5-HTP (5-hidroxitriptófano) es una molécula que el cuerpo usa como etapa intermedia para fabricar serotonina, a su vez precursora de la melatonina. Se extrae sobre todo de las semillas de la Griffonia simplicifolia, un arbusto de África Occidental. Se ofrece tradicionalmente como complemento con el ánimo y el sueño en mente. Su frecuencia Auralis (164,12 Hz) se deriva de su masa molar."}, "Acide carnosique": {"fr": "L'acide carnosique est l'un des principaux antioxydants du romarin et de la sauge ; c'est en partie lui qui aide ces plantes aromatiques à protéger les aliments de l'oxydation. Étudié pour ses propriétés antioxydantes, il est associé, dans la tradition, aux vertus toniques du romarin. On l'extrait des feuilles de ces herbes méditerranéennes. Sa fréquence Auralis (123,87 Hz) dérive de sa masse molaire.", "en": "Carnosic acid is one of the main antioxidants of rosemary and sage; it is partly what helps these aromatic plants protect food from oxidation. Studied for its antioxidant properties, it is associated in tradition with the tonic virtues of rosemary. It is extracted from the leaves of these Mediterranean herbs. Its Auralis frequency (123.87 Hz) derives from its molar mass.", "es": "El ácido carnósico es uno de los principales antioxidantes del romero y la salvia; es en parte lo que ayuda a estas plantas aromáticas a proteger los alimentos de la oxidación. Estudiado por sus propiedades antioxidantes, se asocia, en la tradición, con las virtudes tónicas del romero. Se extrae de las hojas de estas hierbas mediterráneas. Su frecuencia Auralis (123,87 Hz) deriva de su masa molar."}, "Acide ganodérique A": {"fr": "L'acide ganodérique A est l'un des composés caractéristiques du reishi (Ganoderma lucidum), un champignon surnommé « champignon de l'immortalité » dans la médecine traditionnelle chinoise, où il est employé depuis des millénaires. Il appartient à la famille des triterpènes, étudiés pour leurs propriétés. Le reishi est traditionnellement associé à la vitalité et à l'équilibre. Sa fréquence Auralis (192,52 Hz) dérive de sa masse molaire.", "en": "Ganoderic acid A is one of the characteristic compounds of reishi (Ganoderma lucidum), a mushroom nicknamed the 'mushroom of immortality' in traditional Chinese medicine, where it has been used for millennia. It belongs to the family of triterpenes, studied for their properties. Reishi is traditionally associated with vitality and balance. Its Auralis frequency (192.52 Hz) derives from its molar mass.", "es": "El ácido ganodérico A es uno de los compuestos característicos del reishi (Ganoderma lucidum), un hongo apodado «hongo de la inmortalidad» en la medicina tradicional china, donde se emplea desde hace milenios. Pertenece a la familia de los triterpenos, estudiados por sus propiedades. El reishi se asocia tradicionalmente con la vitalidad y el equilibrio. Su frecuencia Auralis (192,52 Hz) deriva de su masa molar."}, "Acide rosmarinique": {"fr": "L'acide rosmarinique est un antioxydant très répandu dans les plantes aromatiques de la famille des lamiacées — romarin, mélisse, basilic, sauge, origan. Il contribue à leur saveur et les protège. Étudié pour ses propriétés antioxydantes et apaisantes, il est associé à la réputation traditionnelle de la mélisse comme plante de détente. Sa fréquence Auralis (134,26 Hz) dérive de sa masse molaire.", "en": "Rosmarinic acid is an antioxidant very widespread in aromatic plants of the Lamiaceae family — rosemary, lemon balm, basil, sage, oregano. It contributes to their flavor and protects them. Studied for its antioxidant and soothing properties, it is associated with the traditional reputation of lemon balm as a relaxation plant. Its Auralis frequency (134.26 Hz) derives from its molar mass.", "es": "El ácido rosmarínico es un antioxidante muy extendido en las plantas aromáticas de la familia de las lamiáceas — romero, melisa, albahaca, salvia, orégano. Contribuye a su sabor y las protege. Estudiado por sus propiedades antioxidantes y calmantes, se asocia con la reputación tradicional de la melisa como planta de relajación. Su frecuencia Auralis (134,26 Hz) deriva de su masa molar."}, "Acide valérénique": {"fr": "L'acide valérénique est la molécule signature de la racine de valériane (Valeriana officinalis), une plante utilisée depuis l'Antiquité. La valériane est l'une des plantes les plus traditionnellement associées à la détente, au calme et à l'endormissement, et figure dans de nombreuses tisanes du soir. Sa fréquence Auralis (174,63 Hz) est dérivée de sa masse molaire.", "en": "Valerenic acid is the signature molecule of valerian root (Valeriana officinalis), a plant used since antiquity. Valerian is one of the plants most traditionally associated with relaxation, calm and falling asleep, and appears in many evening herbal teas. Its Auralis frequency (174.63 Hz) is derived from its molar mass.", "es": "El ácido valerénico es la molécula distintiva de la raíz de valeriana (Valeriana officinalis), una planta usada desde la Antigüedad. La valeriana es una de las plantas más tradicionalmente asociadas con la relajación, la calma y la conciliación del sueño, y figura en muchas infusiones nocturnas. Su frecuencia Auralis (174,63 Hz) se deriva de su masa molar."}, "AKBA": {"fr": "L'AKBA (acide acétyl-11-céto-bêta-boswellique) est l'un des composés les plus étudiés de la résine de Boswellia (l'encens, ou oliban). Cette résine est utilisée depuis des millénaires en médecine ayurvédique et dans les rituels du Moyen-Orient. L'encens est traditionnellement associé au confort articulaire et à l'apaisement. Sa fréquence Auralis (191,05 Hz) dérive de sa masse molaire.", "en": "AKBA (acetyl-11-keto-beta-boswellic acid) is one of the most studied compounds of Boswellia resin (frankincense, or olibanum). This resin has been used for millennia in Ayurvedic medicine and in Middle Eastern rituals. Frankincense is traditionally associated with joint comfort and calm. Its Auralis frequency (191.05 Hz) derives from its molar mass.", "es": "El AKBA (ácido acetil-11-ceto-beta-boswélico) es uno de los compuestos más estudiados de la resina de Boswellia (el incienso, u olíbano). Esta resina se usa desde hace milenios en la medicina ayurvédica y en los rituales de Oriente Medio. El incienso se asocia tradicionalmente con el confort articular y la calma. Su frecuencia Auralis (191,05 Hz) deriva de su masa molar."}, "Apigénine": {"fr": "L'apigénine est un flavonoïde que l'on trouve notamment dans la camomille, le persil, le céleri et certaines tisanes. C'est l'un des composés qui contribuent à la réputation apaisante de la camomille, traditionnellement bue le soir pour favoriser la détente et l'endormissement. Il est étudié pour ses propriétés antioxydantes. Sa fréquence Auralis (100,70 Hz) est dérivée de sa masse molaire.", "en": "Apigenin is a flavonoid found notably in chamomile, parsley, celery and some herbal teas. It is one of the compounds that contribute to the soothing reputation of chamomile, traditionally drunk in the evening to promote relaxation and falling asleep. It is studied for its antioxidant properties. Its Auralis frequency (100.70 Hz) is derived from its molar mass.", "es": "La apigenina es un flavonoide que se encuentra en particular en la manzanilla, el perejil, el apio y algunas infusiones. Es uno de los compuestos que contribuyen a la reputación calmante de la manzanilla, tradicionalmente bebida por la noche para favorecer la relajación y la conciliación del sueño. Se estudia por sus propiedades antioxidantes. Su frecuencia Auralis (100,70 Hz) se deriva de su masa molar."}, "Asiaticoside": {"fr": "L'asiaticoside est l'un des principes actifs du gotu kola (Centella asiatica), une plante rampante d'Asie très présente dans les médecines ayurvédique et traditionnelle chinoise. Elle y est traditionnellement associée à la peau, à la cicatrisation et à la longévité — on la surnomme parfois « herbe de longévité ». Sa fréquence Auralis (178,69 Hz) dérive de sa masse molaire.", "en": "Asiaticoside is one of the active principles of gotu kola (Centella asiatica), a creeping plant of Asia very present in Ayurvedic and traditional Chinese medicine. There it is traditionally associated with the skin, healing and longevity — it is sometimes nicknamed the 'herb of longevity'. Its Auralis frequency (178.69 Hz) derives from its molar mass.", "es": "El asiaticósido es uno de los principios activos del gotu kola (Centella asiatica), una planta rastrera de Asia muy presente en la medicina ayurvédica y tradicional china. Allí se asocia tradicionalmente con la piel, la cicatrización y la longevidad — a veces se la apoda «hierba de la longevidad». Su frecuencia Auralis (178,69 Hz) deriva de su masa molar."}, "Astragaloside IV": {"fr": "L'astragaloside IV est le composé le plus étudié de la racine d'astragale (Astragalus membranaceus), l'une des grandes plantes toniques de la médecine traditionnelle chinoise, où elle est employée depuis des siècles. L'astragale y est traditionnellement associée au soutien de l'énergie vitale (« Qi ») et des défenses de l'organisme. Sa fréquence Auralis (146,25 Hz) est dérivée de sa masse molaire.", "en": "Astragaloside IV is the most studied compound of astragalus root (Astragalus membranaceus), one of the great tonic plants of traditional Chinese medicine, where it has been used for centuries. There astragalus is traditionally associated with supporting vital energy ('Qi') and the body's defenses. Its Auralis frequency (146.25 Hz) is derived from its molar mass.", "es": "El astragalósido IV es el compuesto más estudiado de la raíz de astrágalo (Astragalus membranaceus), una de las grandes plantas tónicas de la medicina tradicional china, donde se emplea desde hace siglos. Allí el astrágalo se asocia tradicionalmente con el apoyo de la energía vital («Qi») y las defensas del organismo. Su frecuencia Auralis (146,25 Hz) se deriva de su masa molar."}, "Bacoside A3": {"fr": "Le bacoside A3 est l'un des principes actifs du Bacopa monnieri, aussi appelé brahmi, une plante aquatique très utilisée dans l'Ayurveda indien. Le brahmi y est traditionnellement associé à la mémoire, à l'apprentissage et à la clarté mentale, et fait l'objet de nombreuses recherches sur les fonctions cognitives. Sa fréquence Auralis (143,27 Hz) dérive de sa masse molaire.", "en": "Bacoside A3 is one of the active principles of Bacopa monnieri, also called brahmi, an aquatic plant widely used in Indian Ayurveda. There brahmi is traditionally associated with memory, learning and mental clarity, and is the subject of much research on cognitive function. Its Auralis frequency (143.27 Hz) derives from its molar mass.", "es": "El bacósido A3 es uno de los principios activos del Bacopa monnieri, también llamado brahmi, una planta acuática muy usada en el Ayurveda indio. Allí el brahmi se asocia tradicionalmente con la memoria, el aprendizaje y la claridad mental, y es objeto de numerosas investigaciones sobre las funciones cognitivas. Su frecuencia Auralis (143,27 Hz) deriva de su masa molar."}, "Bilobalide": {"fr": "Le bilobalide est un composé propre aux feuilles de ginkgo (Ginkgo biloba), un arbre considéré comme un « fossile vivant », présent sur Terre depuis des millions d'années. Le ginkgo est traditionnellement associé à la circulation et à la mémoire, et reste l'une des plantes les plus étudiées et vendues au monde. Sa fréquence Auralis (121,59 Hz) est dérivée de sa masse molaire.", "en": "Bilobalide is a compound specific to ginkgo leaves (Ginkgo biloba), a tree considered a 'living fossil', present on Earth for millions of years. Ginkgo is traditionally associated with circulation and memory, and remains one of the most studied and sold plants in the world. Its Auralis frequency (121.59 Hz) is derived from its molar mass.", "es": "El bilobálido es un compuesto propio de las hojas de ginkgo (Ginkgo biloba), un árbol considerado un «fósil viviente», presente en la Tierra desde hace millones de años. El ginkgo se asocia tradicionalmente con la circulación y la memoria, y sigue siendo una de las plantas más estudiadas y vendidas del mundo. Su frecuencia Auralis (121,59 Hz) se deriva de su masa molar."}, "Caféine": {"fr": "La caféine est la substance stimulante la plus consommée sur la planète, naturellement présente dans le café, le thé, le cacao, le maté et le guarana. Elle agit en bloquant l'adénosine, la molécule qui favorise la sensation de fatigue, d'où son effet d'éveil et de vigilance. Consommée depuis des siècles sous forme de boissons, elle est indissociable de nombreuses cultures. Sa fréquence Auralis (144,72 Hz) dérive de sa masse molaire.", "en": "Caffeine is the most consumed stimulant on the planet, naturally present in coffee, tea, cocoa, maté and guarana. It works by blocking adenosine, the molecule that promotes the feeling of tiredness, hence its effect of wakefulness and alertness. Consumed for centuries in the form of drinks, it is inseparable from many cultures. Its Auralis frequency (144.72 Hz) derives from its molar mass.", "es": "La cafeína es la sustancia estimulante más consumida del planeta, presente de forma natural en el café, el té, el cacao, el mate y el guaraná. Actúa bloqueando la adenosina, la molécula que favorece la sensación de cansancio, de ahí su efecto de vigilia y atención. Consumida desde hace siglos en forma de bebidas, es inseparable de muchas culturas. Su frecuencia Auralis (144,72 Hz) deriva de su masa molar."}, "Chrysine": {"fr": "La chrysine est un flavonoïde que l'on trouve dans la passiflore, la propolis des abeilles et le miel. Elle contribue à la réputation apaisante de la passiflore (fleur de la passion), plante traditionnellement utilisée en tisane pour favoriser le calme et un sommeil paisible. Elle est étudiée pour ses propriétés antioxydantes. Sa fréquence Auralis (189,47 Hz) est dérivée de sa masse molaire.", "en": "Chrysin is a flavonoid found in passionflower, bee propolis and honey. It contributes to the soothing reputation of passionflower (passion flower), a plant traditionally used in herbal tea to promote calm and peaceful sleep. It is studied for its antioxidant properties. Its Auralis frequency (189.47 Hz) is derived from its molar mass.", "es": "La crisina es un flavonoide que se encuentra en la pasiflora, el propóleo de las abejas y la miel. Contribuye a la reputación calmante de la pasiflora (flor de la pasión), planta tradicionalmente usada en infusión para favorecer la calma y un sueño apacible. Se estudia por sus propiedades antioxidantes. Su frecuencia Auralis (189,47 Hz) se deriva de su masa molar."}, "Cordycépine": {"fr": "La cordycépine est le composé caractéristique du cordyceps, un champignon qui pousse en altitude sur les hauts plateaux himalayens et très prisé dans les traditions chinoise et tibétaine. Le cordyceps y est traditionnellement associé à l'énergie, à l'endurance et à la vitalité. Sa fréquence Auralis (187,23 Hz) dérive de sa masse molaire.", "en": "Cordycepin is the characteristic compound of cordyceps, a mushroom that grows at altitude on the high Himalayan plateaus and is highly prized in Chinese and Tibetan traditions. There cordyceps is traditionally associated with energy, endurance and vitality. Its Auralis frequency (187.23 Hz) derives from its molar mass.", "es": "La cordicepina es el compuesto característico del cordyceps, un hongo que crece en altura en las altas mesetas del Himalaya y muy apreciado en las tradiciones china y tibetana. Allí el cordyceps se asocia tradicionalmente con la energía, la resistencia y la vitalidad. Su frecuencia Auralis (187,23 Hz) deriva de su masa molar."}, "Curcumine": {"fr": "La curcumine est le pigment jaune-orangé du curcuma, la racine qui donne sa couleur au curry. Utilisée depuis des millénaires dans la cuisine et la médecine ayurvédique indienne, elle est l'un des composés naturels les plus étudiés au monde pour ses propriétés antioxydantes. Le curcuma est traditionnellement associé au confort articulaire et digestif. Sa fréquence Auralis (137,27 Hz) est dérivée de sa masse molaire.", "en": "Curcumin is the yellow-orange pigment of turmeric, the root that gives curry its color. Used for millennia in Indian cooking and Ayurvedic medicine, it is one of the most studied natural compounds in the world for its antioxidant properties. Turmeric is traditionally associated with joint and digestive comfort. Its Auralis frequency (137.27 Hz) is derived from its molar mass.", "es": "La curcumina es el pigmento amarillo-anaranjado de la cúrcuma, la raíz que da color al curry. Usada desde hace milenios en la cocina y la medicina ayurvédica india, es uno de los compuestos naturales más estudiados del mundo por sus propiedades antioxidantes. La cúrcuma se asocia tradicionalmente con el confort articular y digestivo. Su frecuencia Auralis (137,27 Hz) se deriva de su masa molar."}, "EGCG": {"fr": "L'EGCG (épigallocatéchine gallate) est la catéchine la plus abondante et la plus étudiée du thé vert. C'est un puissant antioxydant qui contribue à la réputation santé de cette boisson consommée depuis des millénaires en Asie. Le thé vert est traditionnellement associé à la vitalité et à la longévité. Sa fréquence Auralis (170,80 Hz) dérive de sa masse molaire.", "en": "EGCG (epigallocatechin gallate) is the most abundant and most studied catechin of green tea. It is a powerful antioxidant that contributes to the health reputation of this drink consumed for millennia in Asia. Green tea is traditionally associated with vitality and longevity. Its Auralis frequency (170.80 Hz) derives from its molar mass.", "es": "El EGCG (galato de epigalocatequina) es la catequina más abundante y más estudiada del té verde. Es un potente antioxidante que contribuye a la reputación saludable de esta bebida consumida desde hace milenios en Asia. El té verde se asocia tradicionalmente con la vitalidad y la longevidad. Su frecuencia Auralis (170,80 Hz) deriva de su masa molar."}, "Faradiol": {"fr": "Le faradiol est l'un des composés actifs des fleurs de calendula (Calendula officinalis), le souci officinal. Cette fleur orangée est traditionnellement utilisée en soin de la peau — dans les baumes, crèmes et macérats — pour son action apaisante sur les irritations. Sa fréquence Auralis (164,97 Hz) est dérivée de sa masse molaire.", "en": "Faradiol is one of the active compounds of calendula flowers (Calendula officinalis), the pot marigold. This orange flower is traditionally used in skin care — in balms, creams and macerated oils — for its soothing action on irritations. Its Auralis frequency (164.97 Hz) is derived from its molar mass.", "es": "El faradiol es uno de los compuestos activos de las flores de caléndula (Calendula officinalis), la maravilla. Esta flor anaranjada se usa tradicionalmente en el cuidado de la piel — en bálsamos, cremas y aceites macerados — por su acción calmante sobre las irritaciones. Su frecuencia Auralis (164,97 Hz) se deriva de su masa molar."}, "Ginkgolide A": {"fr": "Le ginkgolide A fait partie des ginkgolides, molécules propres au ginkgo (Ginkgo biloba), un arbre parmi les plus anciens de la planète. Ces composés participent à la réputation du ginkgo, traditionnellement associé à la circulation et à la mémoire. Sa fréquence Auralis (152,18 Hz) dérive de sa masse molaire.", "en": "Ginkgolide A is part of the ginkgolides, molecules specific to ginkgo (Ginkgo biloba), one of the oldest trees on the planet. These compounds contribute to the reputation of ginkgo, traditionally associated with circulation and memory. Its Auralis frequency (152.18 Hz) derives from its molar mass.", "es": "El ginkgólido A forma parte de los ginkgólidos, moléculas propias del ginkgo (Ginkgo biloba), uno de los árboles más antiguos del planeta. Estos compuestos contribuyen a la reputación del ginkgo, tradicionalmente asociado con la circulación y la memoria. Su frecuencia Auralis (152,18 Hz) deriva de su masa molar."}, "Ginkgolide B": {"fr": "Le ginkgolide B est le plus étudié des ginkgolides, ces molécules caractéristiques des feuilles de ginkgo. Le ginkgo, « fossile vivant » présent depuis des millions d'années, est traditionnellement associé à la mémoire et à la bonne circulation, et reste l'une des plantes les plus utilisées au monde. Sa fréquence Auralis (158,14 Hz) est dérivée de sa masse molaire.", "en": "Ginkgolide B is the most studied of the ginkgolides, those molecules characteristic of ginkgo leaves. Ginkgo, a 'living fossil' present for millions of years, is traditionally associated with memory and good circulation, and remains one of the most used plants in the world. Its Auralis frequency (158.14 Hz) is derived from its molar mass.", "es": "El ginkgólido B es el más estudiado de los ginkgólidos, esas moléculas características de las hojas de ginkgo. El ginkgo, «fósil viviente» presente desde hace millones de años, se asocia tradicionalmente con la memoria y la buena circulación, y sigue siendo una de las plantas más usadas del mundo. Su frecuencia Auralis (158,14 Hz) se deriva de su masa molar."}, "Ginkgolide C": {"fr": "Le ginkgolide C appartient à la famille des ginkgolides, molécules que l'on ne trouve que dans le ginkgo (Ginkgo biloba). Comme ses cousins, il participe au profil unique de cet arbre ancestral, traditionnellement associé à la circulation, à la mémoire et à la vitalité. Sa fréquence Auralis (164,10 Hz) dérive de sa masse molaire.", "en": "Ginkgolide C belongs to the family of ginkgolides, molecules found only in ginkgo (Ginkgo biloba). Like its cousins, it contributes to the unique profile of this ancestral tree, traditionally associated with circulation, memory and vitality. Its Auralis frequency (164.10 Hz) derives from its molar mass.", "es": "El ginkgólido C pertenece a la familia de los ginkgólidos, moléculas que solo se encuentran en el ginkgo (Ginkgo biloba). Como sus primos, contribuye al perfil único de este árbol ancestral, tradicionalmente asociado con la circulación, la memoria y la vitalidad. Su frecuencia Auralis (164,10 Hz) deriva de su masa molar."}, "Ginsénoside Rb1": {"fr": "Le ginsénoside Rb1 est l'un des principaux ginsénosides, les composés actifs du ginseng (Panax ginseng). Racine emblématique de la médecine traditionnelle chinoise et coréenne, le ginseng y est utilisé depuis des millénaires et traditionnellement associé à l'énergie, à la résistance au stress et à la vitalité. Sa fréquence Auralis (103,34 Hz) est dérivée de sa masse molaire.", "en": "Ginsenoside Rb1 is one of the main ginsenosides, the active compounds of ginseng (Panax ginseng). An emblematic root of traditional Chinese and Korean medicine, ginseng has been used there for millennia and is traditionally associated with energy, stress resistance and vitality. Its Auralis frequency (103.34 Hz) is derived from its molar mass.", "es": "El ginsenósido Rb1 es uno de los principales ginsenósidos, los compuestos activos del ginseng (Panax ginseng). Raíz emblemática de la medicina tradicional china y coreana, el ginseng se usa allí desde hace milenios y se asocia tradicionalmente con la energía, la resistencia al estrés y la vitalidad. Su frecuencia Auralis (103,34 Hz) se deriva de su masa molar."}, "Ginsénoside Rg1": {"fr": "Le ginsénoside Rg1 fait partie des ginsénosides, les molécules signatures du ginseng. Le ginseng est l'une des plantes « adaptogènes » les plus réputées, traditionnellement utilisée en Asie pour soutenir l'énergie, la concentration et la résistance à la fatigue. Sa fréquence Auralis (149,24 Hz) dérive de sa masse molaire.", "en": "Ginsenoside Rg1 is part of the ginsenosides, the signature molecules of ginseng. Ginseng is one of the most renowned 'adaptogenic' plants, traditionally used in Asia to support energy, concentration and resistance to fatigue. Its Auralis frequency (149.24 Hz) derives from its molar mass.", "es": "El ginsenósido Rg1 forma parte de los ginsenósidos, las moléculas distintivas del ginseng. El ginseng es una de las plantas «adaptógenas» más renombradas, tradicionalmente usada en Asia para apoyar la energía, la concentración y la resistencia a la fatiga. Su frecuencia Auralis (149,24 Hz) deriva de su masa molar."}, "Ginsénoside Rg3": {"fr": "Le ginsénoside Rg3 est un ginsénoside souvent plus concentré dans le ginseng rouge, obtenu par cuisson à la vapeur de la racine. Il fait l'objet de nombreuses recherches. Le ginseng reste, dans la tradition asiatique, un symbole de vitalité et de longévité. Sa fréquence Auralis (146,25 Hz) est dérivée de sa masse molaire.", "en": "Ginsenoside Rg3 is a ginsenoside often more concentrated in red ginseng, obtained by steaming the root. It is the subject of much research. Ginseng remains, in Asian tradition, a symbol of vitality and longevity. Its Auralis frequency (146.25 Hz) is derived from its molar mass.", "es": "El ginsenósido Rg3 es un ginsenósido a menudo más concentrado en el ginseng rojo, obtenido cociendo la raíz al vapor. Es objeto de numerosas investigaciones. El ginseng sigue siendo, en la tradición asiática, un símbolo de vitalidad y longevidad. Su frecuencia Auralis (146,25 Hz) se deriva de su masa molar."}, "Honokiol": {"fr": "Le honokiol est l'un des composés actifs de l'écorce de magnolia (Magnolia officinalis), utilisée depuis des siècles dans les médecines traditionnelles chinoise et japonaise. Le magnolia y est traditionnellement associé à la détente, à l'apaisement et au sommeil. Sa fréquence Auralis (198,48 Hz) dérive de sa masse molaire.", "en": "Honokiol is one of the active compounds of magnolia bark (Magnolia officinalis), used for centuries in traditional Chinese and Japanese medicine. There magnolia is traditionally associated with relaxation, calm and sleep. Its Auralis frequency (198.48 Hz) derives from its molar mass.", "es": "El honokiol es uno de los compuestos activos de la corteza de magnolia (Magnolia officinalis), usada desde hace siglos en las medicinas tradicionales china y japonesa. Allí la magnolia se asocia tradicionalmente con la relajación, la calma y el sueño. Su frecuencia Auralis (198,48 Hz) deriva de su masa molar."}, "Huperzine A": {"fr": "L'huperzine A est une molécule extraite d'une mousse de Chine, l'Huperzia serrata, utilisée dans la médecine traditionnelle chinoise. Elle est particulièrement étudiée pour son action sur l'acétylcholine, un neurotransmetteur de la mémoire, ce qui la relie à la réputation cognitive de cette plante. Sa fréquence Auralis (180,59 Hz) est dérivée de sa masse molaire.", "en": "Huperzine A is a molecule extracted from a Chinese moss, Huperzia serrata, used in traditional Chinese medicine. It is particularly studied for its action on acetylcholine, a memory neurotransmitter, which links it to the cognitive reputation of this plant. Its Auralis frequency (180.59 Hz) is derived from its molar mass.", "es": "La huperzina A es una molécula extraída de un musgo de China, la Huperzia serrata, usada en la medicina tradicional china. Se estudia en particular por su acción sobre la acetilcolina, un neurotransmisor de la memoria, lo que la vincula con la reputación cognitiva de esta planta. Su frecuencia Auralis (180,59 Hz) se deriva de su masa molar."}, "Isovitexine": {"fr": "L'isovitexine est un flavonoïde antioxydant présent dans plusieurs plantes, dont la passiflore, le millet, le bambou et certaines céréales. Comme d'autres flavonoïdes de la passiflore, il participe à la réputation apaisante traditionnelle de cette fleur. Sa fréquence Auralis (161,11 Hz) dérive de sa masse molaire.", "en": "Isovitexin is an antioxidant flavonoid present in several plants, including passionflower, millet, bamboo and some cereals. Like other flavonoids of passionflower, it contributes to the traditional soothing reputation of this flower. Its Auralis frequency (161.11 Hz) derives from its molar mass.", "es": "La isovitexina es un flavonoide antioxidante presente en varias plantas, entre ellas la pasiflora, el mijo, el bambú y algunos cereales. Como otros flavonoides de la pasiflora, contribuye a la reputación calmante tradicional de esta flor. Su frecuencia Auralis (161,11 Hz) deriva de su masa molar."}, "L-Théanine": {"fr": "Acide aminé caractéristique du thé vert (Camellia sinensis), où il participe à la saveur douce dite « umami ». On le trouve presque exclusivement dans le thé et quelques champignons. Le thé étant consommé depuis des millénaires en Asie, la L-théanine accompagne l'une des boissons les plus anciennes du monde. Elle est réputée pour favoriser un état de calme attentif — une détente sans somnolence — et elle est souvent évoquée aux côtés de la caféine du thé, avec laquelle elle formerait un duo à l'énergie plus douce que le café. Sa fréquence Auralis (129,82 Hz) dérive de sa masse molaire.", "en": "An amino acid characteristic of green tea (Camellia sinensis), where it contributes to the gentle flavor known as 'umami'. It is found almost exclusively in tea and a few mushrooms. Since tea has been consumed for millennia in Asia, L-theanine accompanies one of the oldest drinks in the world. It is reputed to promote a state of attentive calm — relaxation without drowsiness — and is often mentioned alongside the caffeine of tea, with which it is said to form a pair with gentler energy than coffee. Its Auralis frequency (129.82 Hz) derives from its molar mass.", "es": "Aminoácido característico del té verde (Camellia sinensis), donde contribuye al sabor suave llamado «umami». Se encuentra casi exclusivamente en el té y algunas setas. Como el té se consume desde hace milenios en Asia, la L-teanina acompaña a una de las bebidas más antiguas del mundo. Es reputada por favorecer un estado de calma atenta — relajación sin somnolencia — y se menciona a menudo junto a la cafeína del té, con la que formaría un dúo de energía más suave que el café. Su frecuencia Auralis (129,82 Hz) deriva de su masa molar."}, "L-Tyrosine": {"fr": "La L-tyrosine est un acide aminé que l'organisme emploie comme matière première pour fabriquer la dopamine, la noradrénaline et les hormones thyroïdiennes. On la trouve dans les aliments riches en protéines : fromage, soja, viande, œufs, noix. Elle est traditionnellement proposée en complément dans une optique de vigilance et de concentration, notamment en période de fatigue. Sa fréquence Auralis (135,03 Hz) dérive de sa masse molaire.", "en": "L-tyrosine is an amino acid the body uses as raw material to make dopamine, noradrenaline and thyroid hormones. It is found in protein-rich foods: cheese, soy, meat, eggs, nuts. It is traditionally offered as a supplement with alertness and concentration in mind, notably during periods of fatigue. Its Auralis frequency (135.03 Hz) derives from its molar mass.", "es": "La L-tirosina es un aminoácido que el organismo emplea como materia prima para fabricar dopamina, noradrenalina y hormonas tiroideas. Se encuentra en alimentos ricos en proteínas: queso, soja, carne, huevos, frutos secos. Se ofrece tradicionalmente como complemento con la vigilancia y la concentración en mente, en particular en periodos de fatiga. Su frecuencia Auralis (135,03 Hz) deriva de su masa molar."}, "Lutéine": {"fr": "La lutéine est un caroténoïde, un pigment naturel jaune-orangé présent dans les légumes à feuilles vertes (épinard, chou kale), le maïs et le jaune d'œuf. L'organisme la concentre dans la rétine, en particulier la macula, où elle agit comme un filtre protecteur de la lumière. Elle est traditionnellement associée à la santé des yeux. Sa fréquence Auralis (105,99 Hz) est dérivée de sa masse molaire.", "en": "Lutein is a carotenoid, a natural yellow-orange pigment present in leafy green vegetables (spinach, kale), corn and egg yolk. The body concentrates it in the retina, particularly the macula, where it acts as a protective filter against light. It is traditionally associated with eye health. Its Auralis frequency (105.99 Hz) is derived from its molar mass.", "es": "La luteína es un carotenoide, un pigmento natural amarillo-anaranjado presente en las verduras de hoja verde (espinaca, col rizada), el maíz y la yema de huevo. El organismo la concentra en la retina, en particular la mácula, donde actúa como un filtro protector de la luz. Se asocia tradicionalmente con la salud de los ojos. Su frecuencia Auralis (105,99 Hz) se deriva de su masa molar."}, "Macamide": {"fr": "Les macamides sont des composés propres à la maca (Lepidium meyenii), une racine qui pousse en haute altitude dans les Andes péruviennes, cultivée depuis des millénaires. La maca est traditionnellement associée à l'énergie, à l'endurance et à la vitalité. Sa fréquence Auralis (128,76 Hz) dérive de sa masse molaire.", "en": "Macamides are compounds specific to maca (Lepidium meyenii), a root that grows at high altitude in the Peruvian Andes, cultivated for millennia. Maca is traditionally associated with energy, endurance and vitality. Its Auralis frequency (128.76 Hz) derives from its molar mass.", "es": "Las macamidas son compuestos propios de la maca (Lepidium meyenii), una raíz que crece a gran altitud en los Andes peruanos, cultivada desde hace milenios. La maca se asocia tradicionalmente con la energía, la resistencia y la vitalidad. Su frecuencia Auralis (128,76 Hz) deriva de su masa molar."}, "Madecassoside": {"fr": "Le madecassoside est l'un des principes actifs du gotu kola (Centella asiatica), plante des médecines ayurvédique et chinoise. Il est particulièrement étudié et utilisé en cosmétique pour ses propriétés apaisantes et réparatrices sur la peau. Le gotu kola est traditionnellement associé à la cicatrisation et à la longévité. Sa fréquence Auralis (181,68 Hz) est dérivée de sa masse molaire.", "en": "Madecassoside is one of the active principles of gotu kola (Centella asiatica), a plant of Ayurvedic and Chinese medicine. It is particularly studied and used in cosmetics for its soothing and repairing properties on the skin. Gotu kola is traditionally associated with healing and longevity. Its Auralis frequency (181.68 Hz) is derived from its molar mass.", "es": "El madecasósido es uno de los principios activos del gotu kola (Centella asiatica), planta de las medicinas ayurvédica y china. Se estudia y usa en particular en cosmética por sus propiedades calmantes y reparadoras sobre la piel. El gotu kola se asocia tradicionalmente con la cicatrización y la longevidad. Su frecuencia Auralis (181,68 Hz) se deriva de su masa molar."}, "Magnolol": {"fr": "Le magnolol est, avec le honokiol, l'un des deux composés majeurs de l'écorce de magnolia (Magnolia officinalis), utilisée depuis des siècles dans les médecines traditionnelles chinoise et japonaise. Le magnolia y est traditionnellement associé à la détente, à l'apaisement du mental et au sommeil. Sa fréquence Auralis (198,48 Hz) dérive de sa masse molaire.", "en": "Magnolol is, together with honokiol, one of the two major compounds of magnolia bark (Magnolia officinalis), used for centuries in traditional Chinese and Japanese medicine. There magnolia is traditionally associated with relaxation, easing of the mind and sleep. Its Auralis frequency (198.48 Hz) derives from its molar mass.", "es": "El magnolol es, junto al honokiol, uno de los dos compuestos mayores de la corteza de magnolia (Magnolia officinalis), usada desde hace siglos en las medicinas tradicionales china y japonesa. Allí la magnolia se asocia tradicionalmente con la relajación, la calma mental y el sueño. Su frecuencia Auralis (198,48 Hz) deriva de su masa molar."}, "Pipérine": {"fr": "La pipérine est l'alcaloïde qui donne au poivre noir sa saveur piquante caractéristique. Au-delà du goût, elle est connue pour améliorer l'absorption par l'organisme d'autres composés — c'est pourquoi on l'associe souvent à la curcumine dans les compléments. Le poivre est l'une des épices les plus anciennes et les plus échangées de l'histoire. Sa fréquence Auralis (106,32 Hz) est dérivée de sa masse molaire.", "en": "Piperine is the alkaloid that gives black pepper its characteristic pungent flavor. Beyond taste, it is known for improving the body's absorption of other compounds — which is why it is often combined with curcumin in supplements. Pepper is one of the oldest and most traded spices in history. Its Auralis frequency (106.32 Hz) is derived from its molar mass.", "es": "La piperina es el alcaloide que da a la pimienta negra su sabor picante característico. Más allá del gusto, es conocida por mejorar la absorción por el organismo de otros compuestos — por eso se combina a menudo con la curcumina en los complementos. La pimienta es una de las especias más antiguas y comerciadas de la historia. Su frecuencia Auralis (106,32 Hz) se deriva de su masa molar."}, "Quercétine": {"fr": "La quercétine est l'un des flavonoïdes antioxydants les plus répandus dans l'alimentation : on la trouve dans l'oignon, la pomme, les câpres, les baies, le thé et le vin rouge. Elle donne aux plantes une partie de leurs couleurs et les protège. Elle est étudiée pour ses propriétés antioxydantes et est associée, dans la tradition, au confort respiratoire saisonnier. Sa fréquence Auralis (112,62 Hz) dérive de sa masse molaire.", "en": "Quercetin is one of the most widespread antioxidant flavonoids in the diet: it is found in onion, apple, capers, berries, tea and red wine. It gives plants part of their colors and protects them. It is studied for its antioxidant properties and is associated, in tradition, with seasonal respiratory comfort. Its Auralis frequency (112.62 Hz) derives from its molar mass.", "es": "La quercetina es uno de los flavonoides antioxidantes más extendidos en la alimentación: se encuentra en la cebolla, la manzana, las alcaparras, las bayas, el té y el vino tinto. Da a las plantas parte de sus colores y las protege. Se estudia por sus propiedades antioxidantes y se asocia, en la tradición, con el confort respiratorio estacional. Su frecuencia Auralis (112,62 Hz) deriva de su masa molar."}, "Resvératrol": {"fr": "Le resvératrol est un antioxydant produit par certaines plantes pour se défendre, concentré dans la peau du raisin, le vin rouge, les myrtilles et les arachides. Il a été rendu célèbre par le « paradoxe français » et fait l'objet de nombreuses recherches sur le vieillissement cellulaire. Il est traditionnellement associé à la vitalité et à la longévité. Sa fréquence Auralis (170,09 Hz) est dérivée de sa masse molaire.", "en": "Resveratrol is an antioxidant produced by certain plants to defend themselves, concentrated in grape skin, red wine, blueberries and peanuts. It was made famous by the 'French paradox' and is the subject of much research on cellular aging. It is traditionally associated with vitality and longevity. Its Auralis frequency (170.09 Hz) is derived from its molar mass.", "es": "El resveratrol es un antioxidante producido por ciertas plantas para defenderse, concentrado en la piel de la uva, el vino tinto, los arándanos y los cacahuetes. Se hizo célebre por la «paradoja francesa» y es objeto de numerosas investigaciones sobre el envejecimiento celular. Se asocia tradicionalmente con la vitalidad y la longevidad. Su frecuencia Auralis (170,09 Hz) se deriva de su masa molar."}, "Rosavine": {"fr": "La rosavine est l'un des composés caractéristiques de la rhodiole (Rhodiola rosea), une plante qui pousse dans les régions froides et montagneuses de l'hémisphère nord. Plante « adaptogène » classique, la rhodiole est traditionnellement associée à la résistance au stress, à la fatigue et à l'endurance, notamment dans les traditions scandinaves et russes. Sa fréquence Auralis (159,64 Hz) dérive de sa masse molaire.", "en": "Rosavin is one of the characteristic compounds of rhodiola (Rhodiola rosea), a plant that grows in the cold, mountainous regions of the northern hemisphere. A classic 'adaptogenic' plant, rhodiola is traditionally associated with resistance to stress, fatigue and endurance, notably in Scandinavian and Russian traditions. Its Auralis frequency (159.64 Hz) derives from its molar mass.", "es": "La rosavina es uno de los compuestos característicos de la rodiola (Rhodiola rosea), una planta que crece en las regiones frías y montañosas del hemisferio norte. Planta «adaptógena» clásica, la rodiola se asocia tradicionalmente con la resistencia al estrés, la fatiga y la resistencia física, en particular en las tradiciones escandinavas y rusas. Su frecuencia Auralis (159,64 Hz) deriva de su masa molar."}, "Salidroside": {"fr": "Le salidroside est, avec la rosavine, l'un des deux composés actifs les plus étudiés de la rhodiole (Rhodiola rosea). Cette plante des climats froids est réputée dans la tradition comme un adaptogène aidant l'organisme à faire face au stress et à la fatigue. Sa fréquence Auralis (111,90 Hz) est dérivée de sa masse molaire.", "en": "Salidroside is, together with rosavin, one of the two most studied active compounds of rhodiola (Rhodiola rosea). This plant of cold climates is reputed in tradition as an adaptogen helping the body cope with stress and fatigue. Its Auralis frequency (111.90 Hz) is derived from its molar mass.", "es": "El salidrósido es, junto a la rosavina, uno de los dos compuestos activos más estudiados de la rodiola (Rhodiola rosea). Esta planta de climas fríos es reputada en la tradición como un adaptógeno que ayuda al organismo a afrontar el estrés y la fatiga. Su frecuencia Auralis (111,90 Hz) se deriva de su masa molar."}, "Schisandrine A": {"fr": "La schisandrine A est l'un des composés actifs de la schisandra (Schisandra chinensis), une baie surnommée « fruit aux cinq saveurs » en médecine traditionnelle chinoise, où elle est classée parmi les grands adaptogènes. La schisandra y est traditionnellement associée à l'énergie, à l'équilibre et à la vitalité. Sa fréquence Auralis (155,20 Hz) dérive de sa masse molaire.", "en": "Schisandrin A is one of the active compounds of schisandra (Schisandra chinensis), a berry nicknamed the 'five-flavor fruit' in traditional Chinese medicine, where it is classed among the great adaptogens. There schisandra is traditionally associated with energy, balance and vitality. Its Auralis frequency (155.20 Hz) derives from its molar mass.", "es": "La esquisandrina A es uno de los compuestos activos de la esquisandra (Schisandra chinensis), una baya apodada «fruto de los cinco sabores» en la medicina tradicional china, donde se clasifica entre los grandes adaptógenos. Allí la esquisandra se asocia tradicionalmente con la energía, el equilibrio y la vitalidad. Su frecuencia Auralis (155,20 Hz) deriva de su masa molar."}, "Schisandrine B": {"fr": "La schisandrine B (ou gomisine) est un composé de la schisandra particulièrement étudié pour son rôle possible dans la protection du foie. Cette baie rouge de la tradition chinoise est réputée adaptogène, associée à la résistance au stress et à la vitalité. Sa fréquence Auralis (149,22 Hz) est dérivée de sa masse molaire.", "en": "Schisandrin B (or gomisin) is a compound of schisandra particularly studied for its possible role in protecting the liver. This red berry of Chinese tradition is reputed adaptogenic, associated with resistance to stress and vitality. Its Auralis frequency (149.22 Hz) is derived from its molar mass.", "es": "La esquisandrina B (o gomisina) es un compuesto de la esquisandra particularmente estudiado por su posible papel en la protección del hígado. Esta baya roja de la tradición china es reputada adaptógena, asociada con la resistencia al estrés y la vitalidad. Su frecuencia Auralis (149,22 Hz) se deriva de su masa molar."}, "Schisandrine C": {"fr": "La schisandrine C fait partie des lignanes de la schisandra, la baie « aux cinq saveurs » de la pharmacopée chinoise. Comme les autres composés de cette plante adaptogène, elle est étudiée pour ses propriétés, notamment sur le foie et la résistance au stress. Sa fréquence Auralis (143,24 Hz) dérive de sa masse molaire.", "en": "Schisandrin C is part of the lignans of schisandra, the 'five-flavor' berry of Chinese pharmacopoeia. Like the other compounds of this adaptogenic plant, it is studied for its properties, notably on the liver and resistance to stress. Its Auralis frequency (143.24 Hz) derives from its molar mass.", "es": "La esquisandrina C forma parte de los lignanos de la esquisandra, la baya «de los cinco sabores» de la farmacopea china. Como los otros compuestos de esta planta adaptógena, se estudia por sus propiedades, en particular sobre el hígado y la resistencia al estrés. Su frecuencia Auralis (143,24 Hz) deriva de su masa molar."}, "Sulforaphane": {"fr": "Le sulforaphane est un composé soufré libéré lorsqu'on croque ou coupe les crucifères — brocoli, chou, chou-fleur, roquette — et surtout les jeunes pousses de brocoli. C'est l'un des composés végétaux les plus étudiés pour ses propriétés antioxydantes et de soutien aux défenses naturelles des cellules. Sa fréquence Auralis (132,12 Hz) est dérivée de sa masse molaire.", "en": "Sulforaphane is a sulfur compound released when cruciferous vegetables — broccoli, cabbage, cauliflower, arugula — and especially young broccoli sprouts are chewed or cut. It is one of the most studied plant compounds for its antioxidant properties and its support of the cells' natural defenses. Its Auralis frequency (132.12 Hz) is derived from its molar mass.", "es": "El sulforafano es un compuesto azufrado liberado al masticar o cortar las crucíferas — brócoli, col, coliflor, rúcula — y sobre todo los brotes jóvenes de brócoli. Es uno de los compuestos vegetales más estudiados por sus propiedades antioxidantes y su apoyo a las defensas naturales de las células. Su frecuencia Auralis (132,12 Hz) se deriva de su masa molar."}, "Tryptophane": {"fr": "Le tryptophane est un acide aminé essentiel, c'est-à-dire que le corps ne sait pas fabriquer et doit puiser dans l'alimentation : dinde, œufs, fromage, noix, graines. Il est la matière première à partir de laquelle l'organisme produit la sérotonine, puis la mélatonine. Il est ainsi traditionnellement associé à l'humeur et au sommeil. Sa fréquence Auralis (152,20 Hz) dérive de sa masse molaire.", "en": "Tryptophan is an essential amino acid, meaning the body cannot make it and must obtain it from food: turkey, eggs, cheese, nuts, seeds. It is the raw material from which the body produces serotonin, then melatonin. It is thus traditionally associated with mood and sleep. Its Auralis frequency (152.20 Hz) derives from its molar mass.", "es": "El triptófano es un aminoácido esencial, es decir que el cuerpo no sabe fabricar y debe obtener de la alimentación: pavo, huevos, queso, frutos secos, semillas. Es la materia prima a partir de la cual el organismo produce serotonina, y luego melatonina. Así se asocia tradicionalmente con el ánimo y el sueño. Su frecuencia Auralis (152,20 Hz) deriva de su masa molar."}, "Valtrate": {"fr": "Le valtrate fait partie des valépotriates, des composés propres à la racine de valériane (Valeriana officinalis). La valériane est l'une des plantes les plus anciennement et traditionnellement associées à la détente et au sommeil, utilisée en tisane depuis l'Antiquité gréco-romaine. Sa fréquence Auralis (157,42 Hz) est dérivée de sa masse molaire.", "en": "Valtrate is part of the valepotriates, compounds specific to valerian root (Valeriana officinalis). Valerian is one of the plants most anciently and traditionally associated with relaxation and sleep, used in herbal tea since Greco-Roman antiquity. Its Auralis frequency (157.42 Hz) is derived from its molar mass.", "es": "El valtrato forma parte de los valepotriatos, compuestos propios de la raíz de valeriana (Valeriana officinalis). La valeriana es una de las plantas más antigua y tradicionalmente asociadas con la relajación y el sueño, usada en infusión desde la Antigüedad grecorromana. Su frecuencia Auralis (157,42 Hz) se deriva de su masa molar."}, "Vinpocétine": {"fr": "La vinpocétine est une molécule dérivée d'un composé de la petite pervenche (Vinca minor), une plante à fleurs bleues des sous-bois européens. Elle est étudiée pour son action sur la circulation sanguine cérébrale et traditionnellement associée à la mémoire et à la clarté mentale. Sa fréquence Auralis (130,58 Hz) dérive de sa masse molaire.", "en": "Vinpocetine is a molecule derived from a compound of the lesser periwinkle (Vinca minor), a blue-flowered plant of European woodlands. It is studied for its action on cerebral blood circulation and traditionally associated with memory and mental clarity. Its Auralis frequency (130.58 Hz) derives from its molar mass.", "es": "La vinpocetina es una molécula derivada de un compuesto de la vincapervinca menor (Vinca minor), una planta de flores azules de los bosques europeos. Se estudia por su acción sobre la circulación sanguínea cerebral y se asocia tradicionalmente con la memoria y la claridad mental. Su frecuencia Auralis (130,58 Hz) deriva de su masa molar."}, "Vitexine": {"fr": "La vitexine est un flavonoïde antioxydant que l'on retrouve notamment dans l'aubépine, la passiflore et le millet. Elle participe à la réputation traditionnelle de l'aubépine, arbuste associé depuis longtemps au confort du cœur et à l'apaisement nerveux. Sa fréquence Auralis (161,11 Hz) est dérivée de sa masse molaire.", "en": "Vitexin is an antioxidant flavonoid found notably in hawthorn, passionflower and millet. It contributes to the traditional reputation of hawthorn, a shrub long associated with heart comfort and nervous calm. Its Auralis frequency (161.11 Hz) is derived from its molar mass.", "es": "La vitexina es un flavonoide antioxidante que se encuentra en particular en el espino blanco, la pasiflora y el mijo. Contribuye a la reputación tradicional del espino blanco, arbusto asociado desde antiguo con el confort del corazón y la calma nerviosa. Su frecuencia Auralis (161,11 Hz) se deriva de su masa molar."}, "Withaférine A": {"fr": "La withaférine A est l'un des composés actifs de l'ashwagandha (Withania somnifera), aussi appelée « ginseng indien », l'une des plantes les plus importantes de la médecine ayurvédique. Adaptogène par excellence, l'ashwagandha est traditionnellement associée à la résistance au stress, au calme et à la vitalité — son nom sanskrit évoque d'ailleurs la force. Sa fréquence Auralis (175,35 Hz) dérive de sa masse molaire.", "en": "Withaferin A is one of the active compounds of ashwagandha (Withania somnifera), also called 'Indian ginseng', one of the most important plants of Ayurvedic medicine. An adaptogen par excellence, ashwagandha is traditionally associated with resistance to stress, calm and vitality — its Sanskrit name indeed evokes strength. Its Auralis frequency (175.35 Hz) derives from its molar mass.", "es": "La witaferina A es uno de los compuestos activos de la ashwagandha (Withania somnifera), también llamada «ginseng indio», una de las plantas más importantes de la medicina ayurvédica. Adaptógeno por excelencia, la ashwagandha se asocia tradicionalmente con la resistencia al estrés, la calma y la vitalidad — su nombre sánscrito evoca de hecho la fuerza. Su frecuencia Auralis (175,35 Hz) deriva de su masa molar."}, "Échinacoside": {"fr": "L'échinacoside est l'un des composés de l'échinacée (Echinacea), une fleur pourpre originaire d'Amérique du Nord, utilisée par les peuples autochtones puis très popularisée en phytothérapie. L'échinacée est traditionnellement associée au soutien des défenses naturelles, surtout à la saison froide. Sa fréquence Auralis (146,58 Hz) est dérivée de sa masse molaire.", "en": "Echinacoside is one of the compounds of echinacea (Echinacea), a purple flower native to North America, used by Indigenous peoples and then made very popular in herbal medicine. Echinacea is traditionally associated with supporting the natural defenses, especially in the cold season. Its Auralis frequency (146.58 Hz) is derived from its molar mass.", "es": "El equinacósido es uno de los compuestos de la equinácea (Echinacea), una flor púrpura originaria de América del Norte, usada por los pueblos indígenas y luego muy popularizada en la fitoterapia. La equinácea se asocia tradicionalmente con el apoyo de las defensas naturales, sobre todo en la estación fría. Su frecuencia Auralis (146,58 Hz) se deriva de su masa molar."}, "Érinacine A": {"fr": "L'érinacine A est un composé caractéristique de l'Hericium erinaceus, un champignon blanc à longues épines surnommé « crinière de lion » ou « tête de singe ». Utilisé dans la tradition asiatique, il est aujourd'hui très étudié pour son lien possible avec les cellules nerveuses, ce qui le rattache à une réputation de soutien cognitif. Sa fréquence Auralis (155,21 Hz) dérive de sa masse molaire.", "en": "Erinacine A is a characteristic compound of Hericium erinaceus, a white mushroom with long spines nicknamed 'lion's mane' or 'monkey head'. Used in Asian tradition, it is today much studied for its possible link with nerve cells, which connects it to a reputation for cognitive support. Its Auralis frequency (155.21 Hz) derives from its molar mass.", "es": "La erinacina A es un compuesto característico del Hericium erinaceus, un hongo blanco de largas espinas apodado «melena de león» o «cabeza de mono». Usado en la tradición asiática, hoy es muy estudiado por su posible vínculo con las células nerviosas, lo que lo relaciona con una reputación de apoyo cognitivo. Su frecuencia Auralis (155,21 Hz) deriva de su masa molar."}, "Théobromine": {"fr": "La théobromine est la principale molécule stimulante du cacao — son nom grec signifie « nourriture des dieux ». Plus douce et plus longue que la caféine, elle contribue à la sensation de bien-être associée au chocolat noir. Le cacao était considéré comme sacré par les Mayas et les Aztèques. Sa fréquence Auralis (134,26 Hz) est dérivée de sa masse molaire.", "en": "Theobromine is the main stimulant molecule of cocoa — its Greek name means 'food of the gods'. Gentler and longer-lasting than caffeine, it contributes to the sense of well-being associated with dark chocolate. Cocoa was considered sacred by the Mayans and Aztecs. Its Auralis frequency (134.26 Hz) is derived from its molar mass.", "es": "La teobromina es la principal molécula estimulante del cacao — su nombre griego significa «alimento de los dioses». Más suave y más duradera que la cafeína, contribuye a la sensación de bienestar asociada con el chocolate negro. El cacao era considerado sagrado por los mayas y los aztecas. Su frecuencia Auralis (134,26 Hz) se deriva de su masa molar."}, "Berbérine": {"fr": "La berbérine est un composé au jaune vif présent dans plusieurs plantes — épine-vinette, coptis, hydrastis. Elle est utilisée depuis longtemps dans les médecines traditionnelles chinoise et ayurvédique et fait aujourd'hui l'objet de nombreuses recherches, notamment autour du métabolisme du sucre et de la digestion. Sa fréquence Auralis (125,33 Hz) dérive de sa masse molaire.", "en": "Berberine is a bright yellow compound present in several plants — barberry, coptis, goldenseal. It has long been used in traditional Chinese and Ayurvedic medicine and is today the subject of much research, notably around sugar metabolism and digestion. Its Auralis frequency (125.33 Hz) derives from its molar mass.", "es": "La berberina es un compuesto de amarillo vivo presente en varias plantas — agracejo, coptis, sello de oro. Se usa desde hace mucho en las medicinas tradicionales china y ayurvédica y hoy es objeto de numerosas investigaciones, en particular sobre el metabolismo del azúcar y la digestión. Su frecuencia Auralis (125,33 Hz) deriva de su masa molar."}, "Chlorophylle": {"fr": "La chlorophylle est le pigment qui donne leur couleur verte aux plantes et leur permet de capter l'énergie du soleil pour la photosynthèse — le processus qui nourrit presque toute la vie sur Terre. Sa structure ressemble étonnamment à celle de l'hémoglobine de notre sang. On la trouve dans tous les légumes verts. Sa fréquence Auralis (166,47 Hz) est dérivée de sa masse molaire.", "en": "Chlorophyll is the pigment that gives plants their green color and allows them to capture the sun's energy for photosynthesis — the process that feeds almost all life on Earth. Its structure is strikingly similar to that of the hemoglobin in our blood. It is found in all green vegetables. Its Auralis frequency (166.47 Hz) is derived from its molar mass.", "es": "La clorofila es el pigmento que da su color verde a las plantas y les permite captar la energía del sol para la fotosíntesis — el proceso que alimenta casi toda la vida en la Tierra. Su estructura se parece asombrosamente a la de la hemoglobina de nuestra sangre. Se encuentra en todas las verduras verdes. Su frecuencia Auralis (166,47 Hz) se deriva de su masa molar."}, "Igname": {"fr": "L'igname sauvage (Dioscorea) est une racine tropicale dont on extrait la diosgénine, une molécule qui a servi historiquement de base à la fabrication d'hormones de synthèse. L'igname est traditionnellement associée, dans l'herboristerie, à l'équilibre féminin et au confort de la ménopause. Sa fréquence Auralis (154,50 Hz) dérive de sa masse molaire.", "en": "Wild yam (Dioscorea) is a tropical root from which diosgenin is extracted, a molecule that historically served as a base for making synthetic hormones. Yam is traditionally associated, in herbalism, with female balance and menopausal comfort. Its Auralis frequency (154.50 Hz) derives from its molar mass.", "es": "El ñame silvestre (Dioscorea) es una raíz tropical de la que se extrae la diosgenina, una molécula que sirvió históricamente de base para fabricar hormonas de síntesis. El ñame se asocia tradicionalmente, en la herbolaria, con el equilibrio femenino y el confort de la menopausia. Su frecuencia Auralis (154,50 Hz) deriva de su masa molar."}, "Cayenne": {"fr": "Le poivre de Cayenne est un piment fort dont le composé actif, la capsaïcine, est responsable de la sensation de chaleur en bouche. Au-delà de la cuisine, il est traditionnellement utilisé pour stimuler la circulation et réchauffer, et la capsaïcine entre dans certains baumes pour le confort musculaire. Sa fréquence Auralis (113,80 Hz) est dérivée de sa masse molaire.", "en": "Cayenne pepper is a hot pepper whose active compound, capsaicin, is responsible for the sensation of heat in the mouth. Beyond cooking, it is traditionally used to stimulate circulation and warm, and capsaicin is included in some balms for muscle comfort. Its Auralis frequency (113.80 Hz) is derived from its molar mass.", "es": "La pimienta de Cayena es un pimiento picante cuyo compuesto activo, la capsaicina, es responsable de la sensación de calor en la boca. Más allá de la cocina, se usa tradicionalmente para estimular la circulación y calentar, y la capsaicina forma parte de algunos bálsamos para el confort muscular. Su frecuencia Auralis (113,80 Hz) se deriva de su masa molar."}, "Angélique": {"fr": "L'angélique (Angelica) est une grande plante aromatique dont on utilise la racine et les graines. Présente à la fois dans l'herboristerie européenne — où elle parfume liqueurs et confiseries — et dans la médecine chinoise (dang gui), elle est traditionnellement associée à la digestion, à la circulation et au réconfort féminin. Sa fréquence Auralis (138,73 Hz) dérive de sa masse molaire.", "en": "Angelica (Angelica) is a large aromatic plant whose root and seeds are used. Present both in European herbalism — where it flavors liqueurs and confectionery — and in Chinese medicine (dang gui), it is traditionally associated with digestion, circulation and female comfort. Its Auralis frequency (138.73 Hz) derives from its molar mass.", "es": "La angélica (Angelica) es una gran planta aromática de la que se usan la raíz y las semillas. Presente tanto en la herbolaria europea — donde perfuma licores y confituras — como en la medicina china (dang gui), se asocia tradicionalmente con la digestión, la circulación y el bienestar femenino. Su frecuencia Auralis (138,73 Hz) deriva de su masa molar."}, "Coriandre": {"fr": "La coriandre est une herbe aromatique cultivée depuis l'Antiquité, dont on emploie aussi bien les feuilles fraîches que les graines. Présente dans les cuisines du monde entier, elle est traditionnellement associée au confort digestif et est parfois évoquée pour son rôle dans l'élimination de certains métaux. Sa fréquence Auralis (116,46 Hz) est dérivée de sa masse molaire.", "en": "Coriander is an aromatic herb cultivated since antiquity, whose fresh leaves and seeds are both used. Present in cuisines around the world, it is traditionally associated with digestive comfort and is sometimes mentioned for its role in eliminating certain metals. Its Auralis frequency (116.46 Hz) is derived from its molar mass.", "es": "El cilantro es una hierba aromática cultivada desde la Antigüedad, de la que se emplean tanto las hojas frescas como las semillas. Presente en las cocinas del mundo entero, se asocia tradicionalmente con el confort digestivo y a veces se evoca por su papel en la eliminación de ciertos metales. Su frecuencia Auralis (116,46 Hz) se deriva de su masa molar."}, "Pamplemousse": {"fr": "Le pamplemousse est un agrume riche en vitamine C et en flavonoïdes comme la naringine, qui lui donne son amertume. L'extrait de pépins de pamplemousse est traditionnellement valorisé en usage naturel. À noter : le pamplemousse peut interagir avec de nombreux médicaments, un fait bien connu en pharmacologie. Sa fréquence Auralis (108,16 Hz) dérive de sa masse molaire.", "en": "Grapefruit is a citrus fruit rich in vitamin C and in flavonoids such as naringin, which gives it its bitterness. Grapefruit seed extract is traditionally valued in natural use. Note: grapefruit can interact with many medications, a well-known fact in pharmacology. Its Auralis frequency (108.16 Hz) derives from its molar mass.", "es": "El pomelo es un cítrico rico en vitamina C y en flavonoides como la naringina, que le da su amargor. El extracto de semillas de pomelo se valora tradicionalmente en uso natural. Nota: el pomelo puede interactuar con numerosos medicamentos, un hecho bien conocido en farmacología. Su frecuencia Auralis (108,16 Hz) deriva de su masa molar."}, "Huile de ricin": {"fr": "L'huile de ricin est extraite des graines du ricin (Ricinus communis). Épaisse et riche en acide ricinoléique, elle est traditionnellement utilisée en soin externe pour la peau, les cheveux, les cils et les ongles, ainsi que dans les fameux « cataplasmes » de la tradition. Sa fréquence Auralis (111,21 Hz) est dérivée de sa masse molaire.", "en": "Castor oil is extracted from the seeds of the castor plant (Ricinus communis). Thick and rich in ricinoleic acid, it is traditionally used in external care for the skin, hair, eyelashes and nails, as well as in the famous 'poultices' of tradition. Its Auralis frequency (111.21 Hz) is derived from its molar mass.", "es": "El aceite de ricino se extrae
